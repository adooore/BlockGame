<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方寸枢机 - 竞技红线危机</title>
    <script src="libs/tailwind.js"></script>
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-pink: #ff00ff;
            --bg-dark: #050505;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'JetBrains Mono', monospace;
            touch-action: none;
        }

        /* Scanlines Effect */
        body::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 3px 100%;
            z-index: 10;
            pointer-events: none;
        }

        canvas { display: block; }

        #ui-overlay {
            position: absolute;
            top: 30px;
            left: 30px;
            color: var(--neon-cyan);
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 10px var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            transform-origin: top left;
            transition: transform 0.2s ease;
        }

        .cyber-border {
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 10px var(--neon-cyan);
            background: rgba(0, 0, 0, 0.8);
        }

        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 30px 40px;
            border-radius: 4px;
            text-align: center;
            display: none;
            z-index: 100;
            font-family: 'Orbitron', sans-serif;
            min-width: 400px;
        }

        .neon-text-pink { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink); }
        .neon-text-cyan { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }

        @keyframes flicker {
            0% { opacity: 0.9; } 5% { opacity: 0.5; } 10% { opacity: 0.9; } 100% { opacity: 1; }
        }
        .flicker { animation: flicker 3s infinite step-end; }

        .btn-cyber {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px 40px;
            font-size: 1.1rem;
            min-width: 200px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
        }

        .btn-cyber:hover, .btn-cyber.selected {
            background: var(--neon-cyan);
            color: #000 !important;
            box-shadow: 0 0 30px var(--neon-cyan);
        }

        /* 调试面板样式由 debugPanel.js 模块注入 */
        .log-pink { color: #ff00ff; }

        /* 菜单操作提示样式 */
        .menu-control-hints {
            margin-top: 24px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
        .hint-item { display: flex; align-items: center; gap: 4px; }
        .hint-key {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #fff;
            min-width: 20px;
            text-align: center;
        }
        .hint-sep { color: rgba(255, 255, 255, 0.3); }
        .hint-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-family: 'Zhi Mang Xing', cursive;
            font-size: 14px;
            color: #fff;
        }
        .hint-btn-west {
            border: 2px solid #3b82f6;
            background: rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.02); }
        }
        
    </style>
    <!-- 引入模块 -->
    <script src="js/controlHint.js"></script>
    <script src="js/gameData.js"></script>
    <script src="js/gridSystem.js"></script>
    <script src="js/waveSystem.js"></script>
    <script src="js/loadingAnimations.js"></script>
    <script src="js/gameUtils.js"></script>
    <script src="js/frameScheduler.js"></script>
    <script src="js/fpsOverlay.js"></script>
    <script src="js/player.js"></script>
    <script src="js/controllerManager.js"></script>
    <script src="js/soundManager.js"></script>
    <script src="js/competeScoreboard.js"></script>
    <script src="js/pauseMenu.js"></script>
    <script src="js/gameWebSocket.js"></script>
    <script src="js/debugPanel.js"></script>
</head>
<body>

    <!-- 竞技模式排行榜由 CompeteScoreboard 模块动态创建 -->

    <!-- 左上角游戏信息 -->
    <div id="ui-overlay" class="flicker">
        <!-- 关卡标题 -->
        <div id="level-title" class="mb-2" style="font-size: 18px; opacity: 0.9; letter-spacing: 3px; font-weight: bold;">竞技模式 - 颜色收集</div>
        
        <!-- 波次信息 -->
        <div class="mt-2" style="font-size: 14px; opacity: 0.7;">
            波次: <span id="wave-num" class="neon-text-cyan" style="font-weight: bold;">0</span> / <span id="max-waves">12</span>
        </div>
        
        <!-- 颜色指示器容器 -->
        <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px;">
            <!-- 目标颜色指示器 -->
            <div id="target-color-box" style="background: rgba(0,0,0,0.8); border: 3px solid #00f2ff; border-radius: 10px; padding: 12px 16px; display: inline-block;">
                <div style="font-size: 10px; opacity: 0.7; margin-bottom: 5px;">收集目标</div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div id="target-color-indicator" style="width: 35px; height: 35px; border-radius: 6px; background: #00f2ff; box-shadow: 0 0 15px #00f2ff;"></div>
                    <div>
                        <div id="target-color-name" style="font-size: 16px; font-weight: bold;">青色</div>
                        <div id="target-color-count" style="font-size: 10px; opacity: 0.7;">剩余: 0</div>
                    </div>
                </div>
            </div>
        
            <!-- 危险颜色指示器 -->
            <div id="danger-color-box" style="background: rgba(0,0,0,0.8); border: 3px solid #ff00ff; border-radius: 10px; padding: 12px 16px; display: none;">
                <div style="font-size: 10px; opacity: 0.7; margin-bottom: 5px;">⚠ 危险障碍</div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div id="danger-color-indicator" style="width: 35px; height: 35px; border-radius: 6px; background: #ff00ff; box-shadow: 0 0 15px #ff00ff;"></div>
                    <div>
                        <div id="danger-color-name" style="font-size: 16px; font-weight: bold; color: #ff00ff;">粉色</div>
                        <div style="font-size: 10px; opacity: 0.7;">触碰即死</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 操作提示和玩家状态由 JS 动态生成 -->
        <div id="game-ui-container"></div>
        
        <!-- 调试信息 -->
        <div id="debug-info" class="mt-4 text-xs tracking-widest" style="font-family: 'JetBrains Mono', monospace;">
            <div class="mt-1" id="color-counts">
                <!-- 动态生成颜色计数 -->
            </div>
        </div>
    </div>
    
    <!-- 开始蒙版由 JS 动态生成 -->

    <!-- Game Over / Victory 界面由 JS 动态生成 -->

    <!-- 调试面板由 debugPanel.js 模块动态创建 -->

    <canvas id="gameCanvas"></canvas>

    <script>
        // ==================== 获取关卡信息 ====================
        const urlParams = new URLSearchParams(window.location.search);
        const currentLevel = parseInt(urlParams.get('level')) || 1;
        
        // 关卡模式名称配置
        const LEVEL_MODES = {
            1: '单线追击',
            2: '双线夹击',
            3: '十字封锁'
        };
        
        // ==================== 加载界面 ====================
        const loadingScreen = LoadingAnimations.create({
            title: `红线危机 · ${LEVEL_MODES[currentLevel] || '单线追击'}`,
            subtitle: '⚔ 竞技模式',
            subtitle2: '多人对战 · 争夺最高分',
            minDuration: 1000,
            showControls: true,
            onComplete: () => {
                // 加载动画结束后播放游戏BGM并开始游戏
                SoundManager.playRedlineBGM();
                SoundManager.initBGMAutoplay();
                startGame();
            }
        });
        
        // ==================== 游戏配置 ====================
        const config = {
            gridSize: 12,
            tileGap: 6,
            playerSizeRatio: 0.5,
            moveSpeed: 7.5,
            dashMultiplier: 3.5,
            dashDuration: 8,
            dashCooldown: 30,
            jumpPower: 14,
            gravity: 1.0,
            trailLength: 6,
            maxWaves: 12,
            initialCyan: 12,
            cyanDecrement: 1,
            minCyan: 6,
            initialPink: 5,
            pinkIncrement: 2,
            maxPink: 25,
            colors: { bg: '#050505', grid: '#1a1a1a', cyan: '#00f2ff', pink: '#ff00ff' },
            collectibleColors: ['cyan', 'yellow', 'purple', 'orange'],
            colorHex: { cyan: '#00f2ff', yellow: '#facc15', purple: '#a855f7', orange: '#fb923c', pink: '#ff00ff', red: '#ff4444', gray: '#888888' },
            colorNames: { cyan: '青色', yellow: '黄色', purple: '紫色', orange: '橙色', pink: '粉色', red: '红色', gray: '灰色' },
            wrongColorPenalty: 5,
            dangerColors: ['pink', 'red', 'gray'],
            dangerColorHex: { pink: '#ff00ff', red: '#ff4444', gray: '#888888' },
            dangerColorNames: { pink: '粉色', red: '红色', gray: '灰色' },
            // 第三关：所有颜色统一池，可以互换
            allColors: ['cyan', 'yellow', 'purple', 'orange', 'pink', 'red', 'gray']
        };
        
        // ==================== 关卡配置 ====================
        // currentLevel 和 urlParams 已在上方定义
        const levelNames = { 
            1: '竞技红线危机 I', 
            2: '竞技红线危机 II', 
            3: '竞技红线危机 III' 
        };
        const levelSubtitles = {
            1: '单线追击 - 躲避移动红线',
            2: '双线夹击 - 双向红线夹击',
            3: '十字封锁 - 水平垂直红线'
        };
        
        // ==================== 红线系统 ====================
        const redLineConfig = {
            color: '#ff4444',
            glowColor: '#ff0000',
            baseSpeed: 1 / 60,  // 基础速度：每个60Hz逻辑步移动的格子数，约1秒1格
            maxSpeedMult: 3,    // 最终速度倍率：第12波时达到3倍速
            warningTime: 60     // 红线出现前的警告时间（帧）
        };
        
        // 红线对象数组（支持多条红线）
        let redLines = [];
        
        /**
         * 创建一条红线
         */
        function createRedLine(direction, startPos = 0) {
            const line = {
                direction: direction,
                position: startPos,
                isHorizontal: direction === 'left' || direction === 'right',
                warning: redLineConfig.warningTime,
                active: false
            };
            
            if (direction === 'down') line.position = -1;
            else if (direction === 'up') line.position = config.gridSize;
            else if (direction === 'right') line.position = -1;
            else if (direction === 'left') line.position = config.gridSize;
            
            return line;
        }
        
        /**
         * 初始化红线（根据关卡模式）
         */
        function initRedLines() {
            redLines = [];
            
            if (currentLevel === 1) {
                redLines.push(createRedLine('down'));
            } else if (currentLevel === 2) {
                redLines.push(createRedLine('down'));
                redLines.push(createRedLine('up'));
            } else {
                redLines.push(createRedLine('down'));
                redLines.push(createRedLine('right'));
            }
        }
        
        /**
         * 更新红线位置
         */
        function updateRedLines(dtScale) {
            redLines.forEach(line => {
                if (line.warning > 0) {
                    line.warning = Math.max(0, line.warning - dtScale);
                    if (line.warning <= 0) {
                        line.active = true;
                    }
                    return;
                }
                
                const waveProgress = (waveSys.waveNumber - 1) / (config.maxWaves - 1);
                const speedMult = 1 + waveProgress * (redLineConfig.maxSpeedMult - 1);
                const speed = redLineConfig.baseSpeed * speedMult * dtScale;
                
                switch (line.direction) {
                    case 'down':
                        line.position += speed;
                        if (line.position >= config.gridSize) {
                            line.position = -1;
                            line.warning = redLineConfig.warningTime;
                            line.active = false;
                        }
                        break;
                    case 'up':
                        line.position -= speed;
                        if (line.position < -1) {
                            line.position = config.gridSize;
                            line.warning = redLineConfig.warningTime;
                            line.active = false;
                        }
                        break;
                    case 'right':
                        line.position += speed;
                        if (line.position >= config.gridSize) {
                            line.position = -1;
                            line.warning = redLineConfig.warningTime;
                            line.active = false;
                        }
                        break;
                    case 'left':
                        line.position -= speed;
                        if (line.position < -1) {
                            line.position = config.gridSize;
                            line.warning = redLineConfig.warningTime;
                            line.active = false;
                        }
                        break;
                }
            });
        }
        
        /**
         * 绘制红线
         */
        function drawRedLines() {
            const { gridX, gridY, tileSize } = gridSys;
            const gap = config.tileGap;
            const totalTileSize = tileSize + gap;
            
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            
            redLines.forEach(line => {
                const pos = Math.floor(line.position);
                const fraction = line.position - pos;
                
                if (line.isHorizontal) {
                    const x = gridX + pos * totalTileSize + fraction * totalTileSize;
                    
                    if (line.active) {
                        ctx.fillStyle = redLineConfig.color;
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = redLineConfig.glowColor;
                        ctx.fillRect(x, gridY, tileSize, config.gridSize * totalTileSize - gap);
                        ctx.shadowBlur = 0;
                        ctx.shadowColor = 'transparent';
                    } else if (line.warning > 0) {
                        const alpha = 0.3 + Math.sin(Date.now() / 100) * 0.2;
                        ctx.fillStyle = `rgba(255, 68, 68, ${alpha})`;
                        const warnX = line.direction === 'right' ? gridX : gridX + (config.gridSize - 1) * totalTileSize;
                        ctx.fillRect(warnX, gridY, tileSize, config.gridSize * totalTileSize - gap);
                    }
                } else {
                    const y = gridY + pos * totalTileSize + fraction * totalTileSize;
                    
                    if (line.active) {
                        ctx.fillStyle = redLineConfig.color;
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = redLineConfig.glowColor;
                        ctx.fillRect(gridX, y, config.gridSize * totalTileSize - gap, tileSize);
                        ctx.shadowBlur = 0;
                        ctx.shadowColor = 'transparent';
                    } else if (line.warning > 0) {
                        const alpha = 0.3 + Math.sin(Date.now() / 100) * 0.2;
                        ctx.fillStyle = `rgba(255, 68, 68, ${alpha})`;
                        const warnY = line.direction === 'down' ? gridY : gridY + (config.gridSize - 1) * totalTileSize;
                        ctx.fillRect(gridX, warnY, config.gridSize * totalTileSize - gap, tileSize);
                    }
                }
            });
            
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
        }
        
        /**
         * 检测玩家是否碰到红线
         */
        function checkRedLineCollision(p) {
            if (p.z >= 1 || p.isDead) return false;
            
            const { gridX, gridY, tileSize } = gridSys;
            const gap = config.tileGap;
            const totalTileSize = tileSize + gap;
            
            const playerLeft = p.x;
            const playerRight = p.x + p.width;
            const playerTop = p.y;
            const playerBottom = p.y + p.height;
            
            for (const line of redLines) {
                if (!line.active) continue;
                
                const pos = Math.floor(line.position);
                const fraction = line.position - pos;
                
                if (line.isHorizontal) {
                    const lineX = gridX + pos * totalTileSize + fraction * totalTileSize;
                    const lineLeft = lineX;
                    const lineRight = lineX + tileSize;
                    
                    if (playerRight > lineLeft && playerLeft < lineRight) {
                        return true;
                    }
                } else {
                    const lineY = gridY + pos * totalTileSize + fraction * totalTileSize;
                    const lineTop = lineY;
                    const lineBottom = lineY + tileSize;
                    
                    if (playerBottom > lineTop && playerTop < lineBottom) {
                        return true;
                    }
                }
            }
            
            return false;
        }
        
        let targetColor = 'cyan';
        let dangerColor = 'pink';
        
        // 玩家颜色（使用 GameData 统一管理）
        const ALL_COLORS = GameData.playerColors.getAllColors();

        // ==================== DOM 元素 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ==================== 游戏状态 ====================
        let gameState = 'waiting';
        let gameTime = 0;
        let gameStartTime = 0;
        let bestTime = 0;
        let invincibleTimer = 0;
        const INVINCIBLE_DURATION = 120;
        const REVIVE_PENALTY = 60;
        let penaltyTime = 0;  // 惩罚时间（秒）
        let purePlayTime = 0;  // 纯游戏时间（秒）
        let width, height;
        
        // ==================== 竞技模式 - 使用 CompeteScoreboard 模块 ====================
        // 常量快捷引用
        const CORRECT_SCORE = CompeteScoreboard.CORRECT_SCORE;
        const WRONG_PENALTY = CompeteScoreboard.WRONG_PENALTY;
        const DEATH_PENALTY = CompeteScoreboard.DEATH_PENALTY;
        
        // ==================== 初始化模块 ====================
        const gridSys = GridSystem.create({ gridSize: config.gridSize, tileGap: config.tileGap, colors: config.colors });
        const waveSys = WaveSystem.create({
            maxWaves: config.maxWaves,
            initialTarget: config.initialCyan,
            targetDecrement: config.cyanDecrement,
            minTarget: config.minCyan,
            initialDanger: config.initialPink,
            dangerIncrement: config.pinkIncrement,
            maxDanger: config.maxPink
        });
        const floatingText = GameUtils.createFloatingTextSystem();
        const menuSystem = GameUtils.createMenuSystem();
        const debugLog = GameUtils.createDebugLog('logContent', 20);
        
        // 游戏界面（使用抽象层）
        let gameScreens = null;   // 游戏结束屏幕
        
        // 基准 tileSize（用于速度缩放）
        const BASE_TILE_SIZE = 70;
        let scaledMoveSpeed = config.moveSpeed;
        let frameScheduler = null;

        function initFrameScheduler() {
            frameScheduler = FrameScheduler.create({
                fixedHz: 60,
                onUpdate: (fixedDt) => update(fixedDt),
                onRender: () => draw()
            });
            frameScheduler.start();
            console.log('[FrameScheduler] 启动: logic=60Hz, render=60');
        }
        
        // ==================== 玩家对象 ====================
        // 通过 ControllerManager 管理玩家，游戏只需关心玩家对象本身
        const GAME_PLAYER_COLORS = [ALL_COLORS[0], ALL_COLORS[1], ALL_COLORS[2], ALL_COLORS[3]];
        const SPAWN_OFFSETS = [
            { x: -1, y: 0 },   // P1 左侧
            { x: 1, y: 0 },    // P2 右侧
            { x: 0, y: -1 },   // P3 上方
            { x: 0, y: 1 }     // P4 下方
        ];
        
        // 兼容旧代码的引用
        let player = null;
        let player2 = null;
        
        /**
         * 创建游戏玩家对象（由 ControllerManager 调用）
         */
        function createGamePlayer(id) {
            // 从 GameData 读取保存的颜色，没有则使用默认
            const savedColor = GameData.playerColors.getPlayerColor(id);
            const colorData = savedColor || GAME_PLAYER_COLORS[(id - 1) % GAME_PLAYER_COLORS.length];
            
            const p = {
                id: id,
                x: 0, y: 0, z: 0, vz: 0, width: 0, height: 0, vx: 0, vy: 0,
                trail: [], 
                colors: { main: colorData.main, glow: colorData.glow, core: colorData.core },
                isJumping: false, isJumpHeld: false,
                dashTimer: 0, dashCooldown: 0, ghostMarker: null,
                isDead: false,           // 竞技模式：死亡状态
                reviveTimer: 0           // 竞技模式：复活倒计时
            };
            // 设置初始大小
            const { tileSize } = gridSys;
            p.width = tileSize * config.playerSizeRatio;
            p.height = tileSize * config.playerSizeRatio;
            resetPlayerPosition(p, id);
            console.log(`[Game] 玩家 ${id} 加入游戏，颜色:`, colorData.name || colorData.main);

            // 更新兼容引用
            if (id === 1) player = p;
            if (id === 2) player2 = p;
            
            // 竞技模式：初始化分数并更新排行榜
            CompeteScoreboard.initPlayerScore(id);
            CompeteScoreboard.updateLeaderboard(gameState);
            
            return p;
        }
        
        /**
         * 移除游戏玩家（由 ControllerManager 调用）
         */
        function removeGamePlayer(id) {
            console.log(`[Game] 玩家 ${id} 离开游戏`);
            if (id === 1) player = null;
            if (id === 2) player2 = null;
            
            // 竞技模式：移除分数并更新排行榜
            CompeteScoreboard.removePlayer(id);
        }
        
        /**
         * 更新控制器 UI 显示（P1-P8）
         */
        // 游戏内 UI（操作提示 + 玩家状态）
        const gameUI = GameUtils.createGameUI(document.getElementById('game-ui-container'));
        
        function updateControllerUI() {
            gameUI.updateControllerUI(ControllerManager);
        }

        // ==================== 远程控制器 (WebSocket) ====================
        // 记录上一帧的按钮状态，用于检测按下事件
        let prevButtonStates = {};

        // 使用 GameWebSocket 抽象层
        GameWebSocket.init({
            loadingScreen: loadingScreen,

        // ==================== 波次系统 ====================
        function triggerNewWave() {
            // 红线模式：只生成目标颜色方块，危险来自红线
            targetColor = 'cyan';
            dangerColor = 'red';  // 红线颜色标识
            
            updateTargetColorUI();
            
            // 增加波次计数
            const allPlayers = ControllerManager.getPlayers();
            waveSys.triggerWave(gridSys, {
                targetColors: ['cyan'],
                dangerColors: [],
                currentTarget: targetColor,
                currentDanger: dangerColor,
                players: Object.values(allPlayers),
                dynamicTarget: false,
                dynamicDanger: false
            });
            
            // 重新放置方块
            gridSys.clearAll();
            const occupied = gridSys.getOccupiedTiles(Object.values(allPlayers));
            const availableTiles = gridSys.getAvailableTiles(occupied);
            const shuffled = GameUtils.shuffle([...availableTiles]);
            
            const { targetCount } = waveSys.getWaveConfig();
            
            let idx = 0;
            
            // 只放置目标颜色方块（青色）
            const actualTarget = Math.min(targetCount, shuffled.length - idx);
            for (let i = 0; i < actualTarget && idx < shuffled.length; i++, idx++) {
                shuffled[idx].type = targetColor;
                shuffled[idx].pulse = 0;
            }
            
            // 不放置危险方块，危险来自红线
            
            console.log(`[Wave ${waveSys.waveNumber}] 目标: ${targetColor}, 目标数: ${actualTarget}, 红线数: ${redLines.length}`);
            debugLog.logWave(waveSys.waveNumber, actualTarget, redLines.length);
            
            // 重新初始化红线（每波开始时红线重置）
            initRedLines();
            
            invincibleTimer = INVINCIBLE_DURATION;
        }
        
        function checkAndRefresh() {
            if (gameState !== 'playing') return;
            
            const targetCount = gridSys.countTiles(targetColor);
            document.getElementById('target-color-count').textContent = `剩余: ${targetCount}`;
            
            if (targetCount === 0) {
                if (waveSys.isComplete()) {
                    victory();
                } else {
                    triggerNewWave();
                }
            }
        }

        // ==================== 窗口调整 ====================
        const BASE_UI_WIDTH = 1280;  // UI设计基准宽度

        // ==================== 游戏控制 ====================
        function startGame() {
            if (gameState === 'waiting') {
                gameState = 'playing';
                gameStartTime = Date.now();
                invincibleTimer = INVINCIBLE_DURATION;
                console.log('[Game] 游戏开始计时！');
            }
        }
        
        // ==================== 游戏输入处理 ====================
        // ControllerManager 已经处理了键盘映射，这里只需要监听特殊事件
        let menuInputThrottle = false;
        let menuInputLocked = false;  // 菜单输入锁定（游戏结束后必须松开所有按键才能操作）
        let prevMenuInput = { joystick: { x: 0, y: 0 }, buttons: { N: false, S: false, E: false, W: false } };
        
        /**
         * 重置菜单输入状态（游戏结束时调用）
         * 锁定菜单输入，直到玩家松开所有按键
         */
        function resetMenuInputState() {
            menuInputLocked = true;
            menuInputThrottle = true;
            console.log('[Menu] 菜单输入已锁定，等待松开所有按键');
        }
        
        /**
         * 检测输入变化（用于菜单等需要检测"按下"而非"按住"的场景）
         */
        function checkMenuInput() {
            const input = ControllerManager.getInput(1);
            if (!input) {
                console.log('[Menu] 没有获取到输入');
                return;
            }
            
            const deadzone = 0.3;
            
            // 检查是否有任何输入（摇杆或按钮）
            const hasAnyInput = Math.abs(input.joystick.x) > deadzone || 
                               Math.abs(input.joystick.y) > deadzone ||
                               input.buttons.N || input.buttons.S || 
                               input.buttons.E || input.buttons.W;
            
            // 如果菜单被锁定，等待所有按键松开才解锁
            if (menuInputLocked) {
                console.log('[Menu] 锁定中, hasAnyInput:', hasAnyInput, 
                    'joystick:', input.joystick.x.toFixed(2), input.joystick.y.toFixed(2),
                    'buttons:', input.buttons);
                if (!hasAnyInput) {
                    console.log('[Menu] 检测到全部松开，解锁菜单！');
                    menuInputLocked = false;
                    menuInputThrottle = false;
                    // 重置 prevMenuInput 为全部松开状态
                    prevMenuInput = { joystick: { x: 0, y: 0 }, buttons: { N: false, S: false, E: false, W: false } };
                }
                return;  // 锁定期间不处理菜单输入
            }
            
            // 检测摇杆移动（有死区的方向变化）
            const newUp = input.joystick.y < -deadzone;
            const newDown = input.joystick.y > deadzone;
            const oldUp = prevMenuInput.joystick.y < -deadzone;
            const oldDown = prevMenuInput.joystick.y > deadzone;
            
            if (!menuInputThrottle) {
                if (newUp && !oldUp) {
                    console.log('[Menu] 触发 moveUp');
                        menuSystem.moveUp();
                    menuInputThrottle = true;
                    setTimeout(() => menuInputThrottle = false, 150);
                    }
                if (newDown && !oldDown) {
                    console.log('[Menu] 触发 moveDown');
                        menuSystem.moveDown();
                    menuInputThrottle = true;
                    setTimeout(() => menuInputThrottle = false, 150);
                    }
                }
            
            // 确认按钮 (只有西键 = 确认，避免跳跃键误触)
            const confirmPressed = (input.buttons.W && !prevMenuInput.buttons.W);
            if (confirmPressed) {
                console.log('[Menu] 触发 confirm');
                menuSystem.confirm();
            }
            
            // 保存当前状态
            prevMenuInput = {
                joystick: { ...input.joystick },
                buttons: { ...input.buttons }
            };
        }
        
        // 监听任意键开始游戏
        window.addEventListener('keydown', e => {
            if (gameState === 'waiting') {
                startGame();
            }
        });

        // ==================== 游戏更新 ====================
        function update(fixedDt) {
            // 暂停检测（手柄 Start 按钮）
            PauseMenu.pollGamepadStart();
            if (PauseMenu.isPaused()) return;
            
            if (gameState !== 'playing') return;
            const dtScale = fixedDt * 60;

            // 竞技模式不显示时间，只需要更新计分板
            if (gameStartTime > 0) {
                purePlayTime = (Date.now() - gameStartTime) / 1000;
                gameTime = purePlayTime;
            }

            const deadzone = 0.3;
            const players = ControllerManager.getPlayers();

            // 遍历所有活跃玩家
            Object.values(players).forEach(p => {
                // 死亡状态下不处理输入
                if (p.isDead) return;
                
                // 从 ControllerManager 获取统一的输入（已合并键盘和手柄）
                const input = ControllerManager.getInput(p.id);
                
                p.vx = 0; p.vy = 0;
                
                // 获取摇杆输入（ControllerManager 已处理键盘->摇杆映射）
                if (input && (Math.abs(input.joystick.x) > deadzone || Math.abs(input.joystick.y) > deadzone)) {
                    p.vx = input.joystick.x;
                    p.vy = input.joystick.y;
                }
            
                // 处理按钮输入（按下事件）
                if (input && input.buttons) {
                    const prevState = prevButtonStates[p.id] || { S: false, E: false };
                    
                    // 南键 = 跳跃
                    p.isJumpHeld = input.buttons.S;
                    if (input.buttons.S && !prevState.S && !p.isJumping) {
                        p.isJumping = true;
                        p.vz = config.jumpPower;
                        p.ghostMarker = { x: p.x, y: p.y, type: 'jump', opacity: 1, timer: 60 };
                        SoundManager.playJump();
                    }
                    
                    // 东键 = 冲刺
                    if (input.buttons.E && !prevState.E && p.dashCooldown <= 0 && (p.vx !== 0 || p.vy !== 0)) {
                        p.dashTimer = config.dashDuration;
                        p.dashCooldown = config.dashCooldown;
                        p.ghostMarker = { x: p.x, y: p.y, type: 'dash', opacity: 1, timer: 60 };
                        SoundManager.playDash();
                    }
                    
                    // 保存当前状态供下一帧比较
                    prevButtonStates[p.id] = { S: input.buttons.S, E: input.buttons.E };
                }
                
                // 静步检测 (北键 = 静步)
                const isPrecise = input && input.buttons && input.buttons.N;
                const speedMult = isPrecise ? 0.5 : 1.0;

                updatePlayerMovement(p, speedMult, dtScale);
            });

            if (invincibleTimer > 0) invincibleTimer = Math.max(0, invincibleTimer - dtScale);
            
            // 更新红线位置
            updateRedLines(dtScale);

            // 碰撞检测和复活 - 遍历所有玩家
            let needLeaderboardUpdate = false;
            Object.values(players).forEach(p => {
                // 检测红线碰撞（竞技模式：死亡但不结束游戏）
                if (invincibleTimer <= 0 && !p.isDead && checkRedLineCollision(p)) {
                    handlePlayerDeathCompete(p);
                }
                // 检测方块碰撞（收集得分方块）
                checkPlayerCollision(p);
                if (p.isDead) {
                    updatePlayerRevive(p, dtScale);
                    // 更新复活倒计时显示
                    const reviveEl = document.getElementById(`revive-${p.id}`);
                    if (reviveEl) {
                        reviveEl.textContent = Math.ceil(p.reviveTimer / 60);
                    }
                    if (p.reviveTimer <= 0) needLeaderboardUpdate = true;
                }
            });
            
            // 有玩家复活时更新排行榜
            if (needLeaderboardUpdate) CompeteScoreboard.updateLeaderboard(gameState);

            gridSys.grid.forEach(t => t.pulse += 0.05 * dtScale);
            updateDebugInfo();
            checkAndRefresh();
        }
        
        function updatePlayerMovement(p, speedMult, dtScale) {
            const { gridX, gridY, gridTotalDim, tileSize } = gridSys;
            
            const isDashing = p.dashTimer > 0;
            if (isDashing) {
                p.x += p.vx * scaledMoveSpeed * config.dashMultiplier * speedMult * dtScale;
                p.y += p.vy * scaledMoveSpeed * config.dashMultiplier * speedMult * dtScale;
                p.dashTimer = Math.max(0, p.dashTimer - dtScale);
                } else {
                p.x += p.vx * scaledMoveSpeed * speedMult * dtScale;
                p.y += p.vy * scaledMoveSpeed * speedMult * dtScale;
                }
            if (p.dashCooldown > 0) p.dashCooldown = Math.max(0, p.dashCooldown - dtScale);

            if (p.isJumping) {
                p.z += p.vz * dtScale;
                const effectiveGravity = p.isJumpHeld ? config.gravity * 0.5 : config.gravity;
                p.vz -= effectiveGravity * dtScale;
                if (p.z <= 0) { 
                    p.z = 0; p.vz = 0; p.isJumping = false; p.isJumpHeld = false;
                    SoundManager.playLand();
                }
                }

            const isMoving = p.vx !== 0 || p.vy !== 0;
            if (isMoving || p.isJumping) p.trail.unshift({x: p.x, y: p.y, z: p.z, opacity: 1});
            const maxTrail = p.dashTimer > 0 ? config.trailLength + 4 : config.trailLength;
            while (p.trail.length > maxTrail) p.trail.pop();
            if (!isMoving && !p.isJumping && p.trail.length > 0) p.trail.pop();

            p.x = Math.max(gridX, Math.min(p.x, gridX + gridTotalDim - p.width));
            p.y = Math.max(gridY, Math.min(p.y, gridY + gridTotalDim - p.height));

            if (p.ghostMarker) {
                p.ghostMarker.timer = Math.max(0, p.ghostMarker.timer - dtScale);
                p.ghostMarker.opacity = p.ghostMarker.timer / 60;
                if (p.ghostMarker.timer <= 0) p.ghostMarker = null;
                }
            }

        function checkPlayerCollision(p) {
            // 跳跃中或死亡中不检测碰撞
            if (p.z >= 1 || p.isDead) return;
            
            const { gridX, gridY, tileSize } = gridSys;
            const cx = p.x + p.width/2;
            const cy = p.y + p.height/2;
            const col = Math.floor((cx - gridX) / (tileSize + config.tileGap));
            const row = Math.floor((cy - gridY) / (tileSize + config.tileGap));

            if (row >= 0 && row < config.gridSize && col >= 0 && col < config.gridSize) {
                const tile = gridSys.grid.find(t => t.row === row && t.col === col);
                if (tile && tile.type !== 'none') {
                    // 红线模式：只收集目标颜色方块（青色）
                    if (tile.type === targetColor) {
                        tile.type = 'none';
                        const pos = gridSys.getTilePosition(row, col);
                        const streak = CompeteScoreboard.getStreak(p.id);
                        const bonus = streak > 0 ? ` x${streak + 1}` : '';
                        CompeteScoreboard.addScore(p.id, CORRECT_SCORE, true);
                        floatingText.show(`+${CORRECT_SCORE}${bonus}`, config.colorHex[targetColor], pos.centerX, pos.y);
                        SoundManager.playScore();
                    }
                }
            }
        }
        
        /**
         * 竞技模式：玩家死亡处理（不结束游戏，而是暂时死亡后复活）
         */
        const REVIVE_COOLDOWN = CompeteScoreboard.REVIVE_COOLDOWN;
        
        function handlePlayerDeathCompete(p) {
            p.isDead = true;
            p.reviveTimer = REVIVE_COOLDOWN;
            
            // 扣分
            CompeteScoreboard.handleDeath(p.id);
            
            // 震动反馈
            ControllerManager.vibrateStrong();
            SoundManager.playError();
            
            // 显示死亡提示
            const pos = { x: p.x, y: p.y };
            floatingText.show(`${DEATH_PENALTY} 死亡!`, '#ff4444', pos.x + p.width/2, pos.y);
            
            console.log(`[Compete] 玩家 ${p.id} 死亡，${REVIVE_COOLDOWN/60}秒后复活`);
        }
        
        /**
         * 更新玩家复活状态
         */
        function updatePlayerRevive(p, dtScale) {
            if (!p.isDead) return;
            
            p.reviveTimer = Math.max(0, p.reviveTimer - dtScale);
            if (p.reviveTimer <= 0) {
                // 复活
                p.isDead = false;
                resetPlayerPosition(p, p.id);
                
                // 移除死亡状态UI
                const card = document.getElementById(`score-card-${p.id}`);
                if (card) card.classList.remove('dead');
                
                floatingText.show('复活!', p.colors.main, p.x + p.width/2, p.y);
                console.log(`[Compete] 玩家 ${p.id} 复活`);
            }
        }
            
        // ==================== 绘制 ====================
        function draw() {
            // 重置 canvas 状态，防止残留效果
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            
            ctx.fillStyle = config.colors.bg;
            ctx.fillRect(0, 0, width, height);

            const { gridX, gridY, gridTotalDim, tileSize } = gridSys;

            // 网格线
            gridSys.drawGridLines(ctx);

            // 方块
            gridSys.drawTiles(ctx, (tile) => {
                // 红线模式：只有目标色
                const color = config.colorHex[tile.type] || config.colors.cyan;
                return { 
                    color, 
                    isHighlight: tile.type === targetColor,
                    isDanger: false
                };
            });
            
            // 绘制红线
            drawRedLines();

            // 绘制玩家 - 遍历所有玩家
            const players = ControllerManager.getPlayers();
            Object.values(players).forEach(p => {
                drawPlayer(p);
            });

            // 浮动文字
            floatingText.draw(ctx);
            floatingText.update();
            
            // 菜单状态下检查输入
            if (gameState === 'gameover' || gameState === 'victory') {
                checkMenuInput();
            }
            
        }
        
        function drawPlayer(p) {
            const { tileSize } = gridSys;
            
            // 死亡状态：绘制幽灵效果
            if (p.isDead) {
                const reviveProgress = 1 - (p.reviveTimer / REVIVE_COOLDOWN);
                ctx.globalAlpha = 0.2 + reviveProgress * 0.3;
                
                // 绘制复活进度圈
                const cx = p.x + p.width / 2;
                const cy = p.y + p.height / 2;
                const radius = p.width * 0.8;
                
                ctx.strokeStyle = p.colors.main;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * reviveProgress);
                ctx.stroke();
                
                // 绘制半透明方块
                ctx.fillStyle = '#444';
                ctx.fillRect(p.x, p.y, p.width, p.height);
                
                // 绘制复活倒计时
                ctx.globalAlpha = 0.8;
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${Math.floor(p.width * 0.5)}px Orbitron`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(Math.ceil(p.reviveTimer / 60).toString(), cx, cy);
                
                ctx.globalAlpha = 1.0;
                return;  // 死亡时不绘制正常外观
            }

            // Ghost Marker
            if (p.ghostMarker) {
                const ghost = p.ghostMarker;
                ctx.globalAlpha = ghost.opacity * 0.6;
                ctx.strokeStyle = p.colors.main;
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.strokeRect(ghost.x, ghost.y, p.width, p.height);
                ctx.beginPath();
                ctx.moveTo(ghost.x + p.width/2, ghost.y + p.height/2);
                ctx.lineTo(p.x + p.width/2, p.y + p.height/2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.globalAlpha = 1;
            }

            // Shadow
            if (p.z > 0) {
                const shadowScale = Math.max(0.2, 1 - p.z / 150);
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath();
                ctx.ellipse(p.x + p.width/2, p.y + p.height/2, (p.width/2) * shadowScale, (p.height/2) * shadowScale, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Trails
            p.trail.forEach((t, i) => {
                const trailScale = 1 + (t.z / 120);
                const tw = p.width * trailScale;
                const th = p.height * trailScale;
                const tx = t.x - (tw - p.width) / 2;
                const ty = t.y - (th - p.height) / 2;
                ctx.globalAlpha = (p.trail.length - i) / (p.trail.length * 3);
                ctx.fillStyle = p.colors.main;
                ctx.fillRect(tx, ty, tw, th);
            });
            ctx.globalAlpha = 1.0;

            // Body
            const jumpScale = 1 + (p.z / 80);
            const drawW = p.width * jumpScale;
            const drawH = p.height * jumpScale;
            const drawX = p.x - (drawW - p.width) / 2;
            const drawY = p.y - (drawH - p.height) / 2;

            const isInvincible = invincibleTimer > 0;
            if (isInvincible) ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 50) * 0.5;

            ctx.shadowBlur = 15 + Math.sin(Date.now()/100) * 5 + (p.z/5);
            ctx.shadowColor = isInvincible ? '#ffffff' : p.colors.glow;
            ctx.fillStyle = p.colors.main;
            ctx.fillRect(drawX, drawY, drawW, drawH);
            
            ctx.fillStyle = p.colors.core;
            ctx.fillRect(drawX + drawW*0.25, drawY + drawH*0.25, drawW*0.5, drawH*0.5);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        }

        // ==================== 游戏结束/胜利 ====================
        // 竞技模式下不使用传统的 gameOver，而是让玩家复活继续
        function gameOver() {
            // 竞技模式：这个函数不再触发，死亡由 handlePlayerDeathCompete 处理
            console.log('[Compete] gameOver 被调用但在竞技模式中被忽略');
        }
        
        function victory() {
            gameState = 'victory';
            
            // 计算最终排名
            const rankings = CompeteScoreboard.getFinalRankings();
            
            // 显示竞技模式结果
            CompeteScoreboard.showResults({
                waveInfo: `${waveSys.waveNumber} / ${config.maxWaves}`,
                currentLevel: currentLevel,
                maxLevel: 3,
                nextLevelUrl: `competeRedLine.html?level=${currentLevel + 1}`,
                onRestart: () => {
                    resetCompeteGame();
                    startGame();
                },
                menuSystem: menuSystem
            });
            
            ControlHint.hide();
            debugLog.add(`<span style="color: #ffd700;">🎉 竞技结束！冠军: P${rankings[0]?.playerId || 1} (${rankings[0]?.score || 0}分)</span>`);
            resetMenuInputState();
        }
        
        function resetPlayerPosition(p, playerId) {
            p.trail = [];
            // 根据玩家ID设置不同的初始位置
            const id = playerId || p.id || 1;
            const offset = SPAWN_OFFSETS[(id - 1) % SPAWN_OFFSETS.length];
            p.x = width / 2 - p.width / 2 + offset.x * gridSys.tileSize * 1.5;
            p.y = height / 2 - p.height / 2 + offset.y * gridSys.tileSize * 1.5;
            p.z = 0;
            p.vz = 0;
        }
        
        function resetGame() {
            gameState = 'waiting';  // 重置游戏状态
            gameTime = 0;
            gameStartTime = 0;
            penaltyTime = 0;
            purePlayTime = 0;
            
            waveSys.reset();
            gridSys.clearAll();
            
            // 重置所有玩家
            ControllerManager.resetAllPlayers(p => {
                resetPlayerPosition(p);
                p.isJumping = false;
                p.dashTimer = 0;
                p.dashCooldown = 0;
                p.ghostMarker = null;
                p.isDead = false;
                p.reviveTimer = 0;
            });
        }
        
        /**
         * 竞技模式：重置游戏（包括分数）
         */
        function resetCompeteGame() {
            resetGame();
            
            // 重置所有玩家分数
            CompeteScoreboard.reset();
            
            console.log('[Compete] 竞技游戏重置');
        }
        
        // ==================== 调试面板初始化（由 DebugPanel 模块处理）====================
        DebugPanel.init({
            onVictoryTest: () => {
                if (gameState === 'playing' || gameState === 'waiting') {
                    if (gameState === 'waiting') startGame();
                    victory();
                }
            }
        });
        
        // ==================== 初始化 ====================
        window.addEventListener('resize', resize);
        gridSys.initGrid();
        initLevelUI();
        
        // 初始化竞技计分板
        CompeteScoreboard.init({
            controllerManager: ControllerManager
        });
        
        // 初始化游戏结束屏幕（使用抽象层，支持复用）
        gameScreens = GameUtils.createGameScreens({
            gameType: 'redline',
            currentLevel: currentLevel,
            maxLevel: 3,
            onRestart: () => {
                gameScreens.hide();
                resetGame();
                // 重新播放BGM并开始游戏
                SoundManager.playRedlineBGM();
                startGame();
            },
            onRevive: () => {
                gameScreens.hide();
                gameState = 'playing';
                penaltyTime += REVIVE_PENALTY;
                floatingText.show(`+${REVIVE_PENALTY}秒复活惩罚`, '#ff6b6b', width/2, height/2 - 50);
                // 重新播放BGM
                SoundManager.playRedlineBGM();
                ControllerManager.resetAllPlayers(p => {
                    resetPlayerPosition(p);
                    p.isJumping = false;
                    p.dashTimer = 0;
                    p.dashCooldown = 0;
                    p.ghostMarker = null;
                });
                invincibleTimer = INVINCIBLE_DURATION;
            },
            onNextLevel: () => {
                if (currentLevel < 3) {
                    window.location.href = `competeRedLine.html?level=${currentLevel + 1}`;
                } else {
                    window.location.href = 'index.html';
                }
            },
            onBackToMenu: () => {
                window.location.href = 'index.html';
            }
        });
        gameScreens.bindMenuSystem(menuSystem);
        
        // 初始化暂停菜单
        PauseMenu.init({
            canPause: () => gameState === 'playing',
            onPause: () => {
                console.log('[Compete] 游戏暂停');
            },
            onResume: () => {
                console.log('[Compete] 游戏恢复');
            },
            onRestart: () => {
                resetCompeteGame();
                startGame();
            },
            onBackToMenu: () => {
                window.location.href = 'index.html';
            }
        });
        
        // ControllerManager 初始化延迟到 WebSocket 连接成功后
        // 这样可以先加载配置，再根据配置创建玩家，避免先创建再删除
        let controllerInitialized = false;
        
        function initControllerAfterConfig() {
            if (controllerInitialized) return;
            controllerInitialized = true;
            
            const keyboardEnabled = GameData.gameSettings.getKeyboardEnabled();
            console.log('[Game] 配置加载完成，键盘控制:', keyboardEnabled ? '启用' : '禁用');
            
            ControllerManager.init({
                onPlayerCreate: createGamePlayer,
                onPlayerRemove: removeGamePlayer,
                onUpdate: () => {
                    updateControllerUI();
                    if (gameState === 'waiting' && ControllerManager.hasAnyInput()) {
                        startGame();
                    }
                },
                onReassign: (webControllerMapping) => {
                    // 键盘开关后重新分配了 playerId，通知所有 Web 控制器更新显示
                    console.log('[Game] 设备重新分配，通知 Web 控制器更新 playerId:', webControllerMapping);
                    const ws = GameData._ws;
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        Object.entries(webControllerMapping).forEach(([controllerId, playerId]) => {
                            ws.send(JSON.stringify({
                                type: 'update_player_id',
                                controller_id: parseInt(controllerId),
                                player_id: playerId
                            }));
                        });
                    }
                    updateControllerUI();
                },
                enableKeyboard: keyboardEnabled
            });
            
            loadPlayerColors();
            updateControllerUI();
        }
        
        resize();
        resetGame();
        initFrameScheduler();
        
        // ==================== 音频（使用 SoundManager 统一管理）====================
        SoundManager.preload();
        
        // 全局按钮点击音效
        document.addEventListener('click', (e) => {
            const target = e.target.closest('button, .btn-cyber, .menu-btn');
            if (target) {
                SoundManager.playClick();
            }
        });
        
        // 加载保存的音量设置
        (function applyVolumeSettings() {
            const volumes = GameData.gameSettings.getVolume();
            SoundManager.setMasterVolume(volumes.master);
            SoundManager.setBGMVolume(volumes.bgm);
            SoundManager.setSFXVolume(volumes.sfx);
        })();
        
        // BGM 已在加载动画 onComplete 中播放
        // 页面卸载通知已由 GameWebSocket.setupUnloadHandler() 处理
    </script>
</body>
</html>
