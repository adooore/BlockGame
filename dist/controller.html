<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>方寸枢-控制器</title>
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            background: #0a0a0f;
            font-family: 'Orbitron', 'Consolas', 'Monaco', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 主容器 */
        .landscape-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            overscroll-behavior: none;
        }

        /* 竖屏提示 */
        .rotate-hint {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ffff;
            font-size: 18px;
            text-align: center;
            padding: 20px;
        }

        .rotate-hint > svg {
            width: 80px;
            height: 80px;
            fill: #00ffff;
            margin-bottom: 20px;
            animation: rotateHint 2s ease-in-out infinite;
        }

        @keyframes rotateHint {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        .hint-fullscreen-btn {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 16px;
            font-family: 'Orbitron', monospace;
            color: #00ffff;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .hint-fullscreen-btn:hover,
        .hint-fullscreen-btn:active {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .hint-fullscreen-btn svg {
            width: 24px;
            height: 24px;
            fill: #00ffff;
        }

        @media screen and (orientation: portrait) {
            .rotate-hint {
                display: flex;
            }
            .landscape-container {
                display: none;
            }
        }

        /* 网格背景 */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* 扫描线效果 */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.1) 2px,
                rgba(0, 0, 0, 0.1) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        /* 移动组件容器 */
        .joystick-container {
            position: absolute;
            left: 20%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            touch-action: none;
        }

        /* 摇杆区域 */
        .joystick-zone {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1a1a2e 0%, #0f0f1a 100%);
            border: 3px solid #00ffff;
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.5),
                0 0 40px rgba(0, 255, 255, 0.3),
                0 0 60px rgba(0, 255, 255, 0.1),
                inset 0 0 30px rgba(0, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        /* XY轴向标签 */
        .axis-label {
            position: absolute;
            font-size: 10px;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
            font-weight: 700;
            opacity: 0.7;
        }
        .axis-label.axis-x-pos { right: -25px; top: 50%; transform: translateY(-50%); }
        .axis-label.axis-x-neg { left: -25px; top: 50%; transform: translateY(-50%); }
        .axis-label.axis-y-pos { top: -20px; left: 50%; transform: translateX(-50%); }
        .axis-label.axis-y-neg { bottom: -20px; left: 50%; transform: translateX(-50%); }

        /* XY数值显示 - 绝对定位锚定到摇杆 */
        .axis-values {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        .axis-value {
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid;
            border-radius: 4px;
        }
        .axis-value.x-value {
            color: #ff00ff;
            border-color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }
        .axis-value.y-value {
            color: #00ff00;
            border-color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }

        .joystick-zone::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(0, 255, 255, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }

        .joystick-base {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 50% 50%, transparent 30%, rgba(0, 255, 255, 0.1) 70%);
            border: 1px dashed rgba(0, 255, 255, 0.3);
        }

        .joystick {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(145deg, #2a2a4a 0%, #1a1a2e 50%, #0f0f1a 100%);
            border: 3px solid #ff00ff;
            box-shadow: 
                0 0 15px rgba(255, 0, 255, 0.6),
                0 0 30px rgba(255, 0, 255, 0.4),
                inset 0 -5px 15px rgba(0, 0, 0, 0.5),
                inset 0 5px 15px rgba(255, 255, 255, 0.1);
            cursor: grab;
            transition: box-shadow 0.1s;
            touch-action: none;
        }

        .joystick:active {
            cursor: grabbing;
            box-shadow: 
                0 0 25px rgba(255, 0, 255, 0.8),
                0 0 50px rgba(255, 0, 255, 0.5),
                inset 0 -5px 15px rgba(0, 0, 0, 0.5),
                inset 0 5px 15px rgba(255, 255, 255, 0.1);
        }

        .joystick::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff00ff 0%, transparent 70%);
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* 操作组件容器 */
        .controller {
            position: absolute;
            left: 80%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* 操作按钮区域 */
        .buttons-zone {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(145deg, #2a2a4a 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Zhi Mang Xing', cursive, serif;
            font-size: 38px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.1s ease;
            touch-action: manipulation;
        }

        .btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn:active::before,
        .btn.pressed::before {
            opacity: 1;
        }

        .btn.pressed {
            filter: brightness(1.2);
        }

        /* 北按钮 - 黄色 */
        .btn-n {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border: 3px solid #ffff00;
            color: #ffff00;
            text-shadow: 0 0 10px #ffff00;
            box-shadow: 
                0 0 15px rgba(255, 255, 0, 0.5),
                0 0 30px rgba(255, 255, 0, 0.3),
                inset 0 0 20px rgba(255, 255, 0, 0.1);
        }

        .btn-n:active {
            background: radial-gradient(circle, rgba(255, 255, 0, 0.3) 0%, #1a1a2e 100%);
            box-shadow: 
                0 0 25px rgba(255, 255, 0, 0.8),
                0 0 50px rgba(255, 255, 0, 0.5),
                inset 0 0 30px rgba(255, 255, 0, 0.3);
        }

        /* 南按钮 - 绿色 */
        .btn-s {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border: 3px solid #00ff00;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            box-shadow: 
                0 0 15px rgba(0, 255, 0, 0.5),
                0 0 30px rgba(0, 255, 0, 0.3),
                inset 0 0 20px rgba(0, 255, 0, 0.1);
        }

        .btn-s:active {
            background: radial-gradient(circle, rgba(0, 255, 0, 0.3) 0%, #1a1a2e 100%);
            box-shadow: 
                0 0 25px rgba(0, 255, 0, 0.8),
                0 0 50px rgba(0, 255, 0, 0.5),
                inset 0 0 30px rgba(0, 255, 0, 0.3);
        }

        /* 西按钮 - 蓝色 */
        .btn-w {
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            border: 3px solid #00aaff;
            color: #00aaff;
            text-shadow: 0 0 10px #00aaff;
            box-shadow: 
                0 0 15px rgba(0, 170, 255, 0.5),
                0 0 30px rgba(0, 170, 255, 0.3),
                inset 0 0 20px rgba(0, 170, 255, 0.1);
        }

        .btn-w:active {
            background: radial-gradient(circle, rgba(0, 170, 255, 0.3) 0%, #1a1a2e 100%);
            box-shadow: 
                0 0 25px rgba(0, 170, 255, 0.8),
                0 0 50px rgba(0, 170, 255, 0.5),
                inset 0 0 30px rgba(0, 170, 255, 0.3);
        }

        /* 东按钮 - 红色 */
        .btn-e {
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            border: 3px solid #ff0066;
            color: #ff0066;
            text-shadow: 0 0 10px #ff0066;
            box-shadow: 
                0 0 15px rgba(255, 0, 102, 0.5),
                0 0 30px rgba(255, 0, 102, 0.3),
                inset 0 0 20px rgba(255, 0, 102, 0.1);
        }

        .btn-e:active {
            background: radial-gradient(circle, rgba(255, 0, 102, 0.3) 0%, #1a1a2e 100%);
            box-shadow: 
                0 0 25px rgba(255, 0, 102, 0.8),
                0 0 50px rgba(255, 0, 102, 0.5),
                inset 0 0 30px rgba(255, 0, 102, 0.3);
        }

        /* 装饰性元素 */
        .corner-decor {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            pointer-events: none;
        }

        .corner-decor.top-left {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
        }

        .corner-decor.top-right {
            top: 15px;
            right: 15px;
            border-left: none;
            border-bottom: none;
        }

        .corner-decor.bottom-left {
            bottom: 15px;
            left: 15px;
            border-right: none;
            border-top: none;
        }

        .corner-decor.bottom-right {
            bottom: 15px;
            right: 15px;
            border-left: none;
            border-top: none;
        }

        /* 标题 */
        .title {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            animation: flicker 3s infinite;
            white-space: nowrap;
        }
        
        .title-main {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #00ffff;
            text-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #00ffff;
        }
        
        .title-main.cn {
            font-family: 'Zhi Mang Xing', cursive, serif;
            font-size: 38px;
            letter-spacing: 16px;
        }
        
        .title-slogan {
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(0, 255, 255, 0.6);
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }
        
        .title-slogan.cn {
            font-family: 'Zhi Mang Xing', cursive, serif;
            font-size: 20px;
            letter-spacing: 6px;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.8; }
            94% { opacity: 1; }
            95% { opacity: 0.9; }
            96% { opacity: 1; }
        }

        /* 信息栏（居中） */
        .info-bar {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        /* 菜单栏（右侧） */
        .menu-bar {
            position: absolute;
            top: 22px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2000;
        }
        
        .menu-toggle {
            width: 32px;
            height: 32px;
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid #00ffff;
            border-radius: 6px;
            color: #00ffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .menu-toggle:hover {
            background: rgba(0, 255, 255, 0.2);
        }
        
        .menu-toggle svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.3s;
        }
        
        .menu-toggle.collapsed svg {
            transform: rotate(180deg);
        }
        
        .menu-content {
            display: flex;
            align-items: center;
            gap: 12px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .menu-content.collapsed {
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px);
        }

        .top-buttons {
            display: flex;
            gap: 10px;
        }

        .top-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 20, 40, 0.85);
            border: 1.5px solid #00ffff;
            color: #00ffff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .top-btn:active {
            transform: scale(0.9);
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.8),
                0 0 40px rgba(0, 255, 255, 0.5);
        }

        .top-btn svg {
            width: 20px;
            height: 20px;
            fill: #00ffff;
        }

        .top-btn.active {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
        }

        /* 拖动手柄 */
        .drag-handle {
            display: none;
            position: absolute;
            bottom: -15px;
            width: 30px;
            height: 30px;
            background: rgba(255, 0, 255, 0.8);
            border: 2px solid #ff00ff;
            border-radius: 50%;
            cursor: move;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.6);
            z-index: 3000;
            touch-action: none;
        }

        .joystick-container .drag-handle {
            left: -15px;
        }

        .controller .drag-handle {
            right: -15px;
        }

        .drag-handle svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .drag-handle.visible {
            display: flex;
        }

        .drag-handle:active {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.9);
        }

        /* 调整模式下的容器样式 */
        .adjusting .joystick-container,
        .adjusting .controller {
            outline: 2px dashed rgba(255, 0, 255, 0.5);
            outline-offset: 10px;
        }

        /* 状态显示 */
        .status {
            font-size: 11px;
            color: #ff00ff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff00ff;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }

        /* 延迟显示 */
        .latency {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .latency.good {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        .latency.medium {
            color: #ffff00;
            text-shadow: 0 0 10px #ffff00;
        }

        .latency.bad {
            color: #ff0066;
            text-shadow: 0 0 10px #ff0066;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 10px #00ff00;
            animation: blink 1s infinite;
        }

        .player-id {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-right: 8px;
            letter-spacing: 1px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 缩放面板 */
        .scale-panel {
            position: absolute;
            top: 70px;
            right: 25px;
            background: rgba(0, 20, 40, 0.95);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 15px;
            z-index: 3000;
            display: none;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        
        .scale-panel.visible {
            display: flex;
        }
        
        .scale-panel-title {
            font-size: 12px;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
            letter-spacing: 2px;
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .scale-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .scale-label {
            font-size: 11px;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            width: 45px;
        }
        
        .scale-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }
        
        .scale-btn:active {
            background: rgba(0, 255, 255, 0.3);
            transform: scale(0.9);
        }
        
        .scale-value {
            font-size: 12px;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
            width: 45px;
            text-align: center;
        }
        
        .scale-reset-btn {
            margin-top: 5px;
            padding: 8px 12px;
            background: rgba(255, 0, 255, 0.1);
            border: 1px solid #ff00ff;
            border-radius: 5px;
            color: #ff00ff;
            font-size: 10px;
            font-family: 'Orbitron', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .scale-reset-btn:active {
            background: rgba(255, 0, 255, 0.3);
        }

        /* 小屏幕横屏适配 */
        @media screen and (max-height: 450px) {
            .joystick-zone {
                width: 140px;
                height: 140px;
                left: 60px;
            }
            
            .joystick-base {
                width: 90px;
                height: 90px;
            }
            
            .joystick {
                width: 55px;
                height: 55px;
            }
            
            .buttons-zone {
                width: 180px;
                height: 180px;
            }
            
            .btn {
                width: 55px;
                height: 55px;
                font-size: 28px;
            }
            
            .title-main {
                font-size: 14px;
                letter-spacing: 4px;
            }
            
            .title-main.cn {
                font-size: 32px;
                letter-spacing: 12px;
            }
            
            .title-slogan {
                font-size: 9px;
            }
            
            .title-slogan.cn {
                font-size: 16px;
            }

            .corner-decor {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <!-- 竖屏提示 -->
    <div class="rotate-hint" id="rotateHint">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

            <!-- 拖动手柄 -->
            <div class="drag-handle" id="buttonsHandle">
                <svg viewBox="0 0 24 24"><path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"/></svg>

        <!-- 缩放控制面板 -->
        <div class="scale-panel" id="scalePanel">
            <div class="scale-panel-title">按键大小调整</div>
            <div class="scale-control">
                <span class="scale-label">摇杆:</span>
                <button class="scale-btn" id="joystickScaleDown">−</button>
                <span class="scale-value" id="joystickScaleValue">100%</span>
                <button class="scale-btn" id="joystickScaleUp">+</button>

            <div class="scale-control">
                <span class="scale-label">按钮:</span>
                <button class="scale-btn" id="buttonsScaleDown">−</button>
                <span class="scale-value" id="buttonsScaleValue">100%</span>
                <button class="scale-btn" id="buttonsScaleUp">+</button>
            </div>
            <div class="scale-control">
                <span class="scale-label">间距:</span>
                <button class="scale-btn" id="spacingDown">−</button>
                <span class="scale-value" id="spacingValue">100%</span>

    <script>
        // ==================== 菜单折叠 ====================
        const menuToggle = document.getElementById('menuToggle');
        const menuContent = document.getElementById('menuContent');
        let menuCollapsed = localStorage.getItem('menuCollapsed') === 'true';
        
        function updateMenuState() {
            if (menuCollapsed) {
                menuContent.classList.add('collapsed');
                menuToggle.classList.add('collapsed');
            } else {
                menuContent.classList.remove('collapsed');
                menuToggle.classList.remove('collapsed');
            }
        }
        
        menuToggle.addEventListener('click', () => {
            menuCollapsed = !menuCollapsed;
            localStorage.setItem('menuCollapsed', menuCollapsed);
            updateMenuState();
            if (navigator.vibrate) {
                navigator.vibrate(20);
            }
        });
        
        // 初始化菜单状态
        updateMenuState();
        
        // ==================== 刷新按钮 ====================
        const refreshBtn = document.getElementById('refreshBtn');
        refreshBtn.addEventListener('click', () => {
            location.reload();
        });

        // ==================== 语言切换 ====================
        const langBtn = document.getElementById('langBtn');
        const langIcon = document.getElementById('langIcon');
        
        // 按钮文字映射
        const buttonLabels = {
            cn: { '北': '北', '南': '南', '西': '西', '东': '东' },
            en: { '北': 'N', '南': 'S', '西': 'W', '东': 'E' }
        };
        
        // Logo 文字映射
        const titleLabels = {
            cn: { main: '方 寸 枢', slogan: '方寸之间 · 自有枢机' },
            en: { main: 'BLOCK CONTROLLER', slogan: 'Small Square, Infinite Control' }
        };
        
        // 状态文字映射
        const statusLabels = {
            cn: { online: '已连接', offline: '未连接', connecting: '连接中...' },
            en: { online: 'CONNECTED', offline: 'DISCONNECTED', connecting: 'CONNECTING...' }
        };
        
        const titleMain = document.getElementById('titleMain');
        const titleSlogan = document.getElementById('titleSlogan');
        const statusText = document.getElementById('statusText');
        
        let currentLang = localStorage.getItem('buttonLang') || 'cn';
        
        function updateLanguage() {
            // 更新按钮
            const labels = buttonLabels[currentLang];
            const btns = ['北', '南', '西', '东'];
            const font = currentLang === 'cn' 
                ? "'Zhi Mang Xing', cursive, serif" 
                : "'Orbitron', monospace";
            const fontSize = currentLang === 'cn' ? '38px' : '22px';
            
            btns.forEach(name => {
                const btn = document.getElementById('btn' + name);
                btn.textContent = labels[name];
                btn.style.fontFamily = font;
                btn.style.fontSize = fontSize;
            });
            
            // 更新 Logo
            const title = titleLabels[currentLang];
            titleMain.textContent = title.main;
            titleSlogan.textContent = title.slogan;
            
            if (currentLang === 'cn') {
                titleMain.classList.add('cn');
                titleSlogan.classList.add('cn');
            } else {
                titleMain.classList.remove('cn');
                titleSlogan.classList.remove('cn');
            }
            
            // 更新状态文字
            updateStatusText();
            
            if (currentLang === 'cn') {
                langIcon.textContent = '中';
                langIcon.style.fontFamily = "'Zhi Mang Xing', cursive, serif";
                langIcon.style.fontSize = '18px';
            } else {
                langIcon.textContent = 'EN';
                langIcon.style.fontFamily = "'Orbitron', monospace";
                langIcon.style.fontSize = '11px';
            }
        }
        
        // 更新状态文字（需要在连接状态变化时也调用）
        let connectionState = 'offline'; // 'online', 'offline', 'connecting'
        function updateStatusText() {
            statusText.textContent = statusLabels[currentLang][connectionState];
            if (currentLang === 'cn') {
                statusText.style.fontFamily = "'Zhi Mang Xing', cursive, serif";
                statusText.style.fontSize = '18px';
            } else {
                statusText.style.fontFamily = "'Orbitron', monospace";
                statusText.style.fontSize = '12px';
            }
        }
        
        langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'cn' ? 'en' : 'cn';
            localStorage.setItem('buttonLang', currentLang);
            updateLanguage();
            if (navigator.vibrate) {
                navigator.vibrate(20);
            }
        });
        
        // 初始化语言
        updateLanguage();

        // ==================== 布局调整 ====================
        const adjustBtn = document.getElementById('adjustBtn');
        const joystickContainer = document.getElementById('joystickContainer');
        const buttonsContainer = document.getElementById('buttonsContainer');
        const joystickHandle = document.getElementById('joystickHandle');
        const buttonsHandle = document.getElementById('buttonsHandle');
        const landscapeContainer = document.getElementById('landscapeContainer');
        
        let isAdjustMode = false;
        let currentDragTarget = null;
        let dragStartX = 0;
        let dragStartY = 0;
        let elementStartX = 0;
        let elementStartY = 0;
        
        // 加载保存的布局
        function loadLayout() {
            const saved = localStorage.getItem('controllerLayout');
            if (saved) {
                try {
                    const layout = JSON.parse(saved);
                    if (layout.joystick) {
                        joystickContainer.style.left = layout.joystick.left;
                        joystickContainer.style.top = layout.joystick.top;
                    }
                    if (layout.buttons) {
                        buttonsContainer.style.left = layout.buttons.left;
                        buttonsContainer.style.top = layout.buttons.top;
                        buttonsContainer.style.right = 'auto';
                    }
                } catch (e) {
                    console.log('布局加载失败');
                }
            }
        }
        
        // 保存布局
        function saveLayout() {
            const layout = {
                joystick: {
                    left: joystickContainer.style.left,
                    top: joystickContainer.style.top
                },
                buttons: {
                    left: buttonsContainer.style.left,
                    top: buttonsContainer.style.top
                }
            };
            localStorage.setItem('controllerLayout', JSON.stringify(layout));
        }
        
        // 切换调整模式
        adjustBtn.addEventListener('click', () => {
            isAdjustMode = !isAdjustMode;
            adjustBtn.classList.toggle('active', isAdjustMode);
            joystickHandle.classList.toggle('visible', isAdjustMode);
            buttonsHandle.classList.toggle('visible', isAdjustMode);
            landscapeContainer.classList.toggle('adjusting', isAdjustMode);
            
            if (!isAdjustMode) {
                saveLayout();
            }
            
            if (navigator.vibrate) {
                navigator.vibrate(20);
            }
        });
        
        // 拖动开始
        function startDrag(e, target, container) {
            if (!isAdjustMode) return;
            e.preventDefault();
            e.stopPropagation();
            
            currentDragTarget = container;
            const touch = e.touches ? e.touches[0] : e;
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;
            
            const rect = container.getBoundingClientRect();
            const parentRect = landscapeContainer.getBoundingClientRect();
            elementStartX = rect.left - parentRect.left + rect.width / 2;
            elementStartY = rect.top - parentRect.top + rect.height / 2;
        }
        
        // 拖动中
        function onDrag(e) {
            if (!currentDragTarget || !isAdjustMode) return;
            e.preventDefault();
            
            const touch = e.touches ? e.touches[0] : e;
            const deltaX = touch.clientX - dragStartX;
            const deltaY = touch.clientY - dragStartY;
            
            const newX = elementStartX + deltaX;
            const newY = elementStartY + deltaY;
            
            const parentRect = landscapeContainer.getBoundingClientRect();
            const percentX = (newX / parentRect.width) * 100;
            const percentY = (newY / parentRect.height) * 100;
            
            currentDragTarget.style.left = `${percentX}%`;
            currentDragTarget.style.top = `${percentY}%`;
            currentDragTarget.style.right = 'auto';
            currentDragTarget.style.transform = 'translate(-50%, -50%)';
        }
        
        // 拖动结束
        function endDrag() {
            if (currentDragTarget) {
                saveLayout();
            }
            currentDragTarget = null;
        }
        
        // 绑定事件
        joystickHandle.addEventListener('mousedown', (e) => startDrag(e, joystickHandle, joystickContainer));
        joystickHandle.addEventListener('touchstart', (e) => startDrag(e, joystickHandle, joystickContainer), { passive: false });
        
        buttonsHandle.addEventListener('mousedown', (e) => startDrag(e, buttonsHandle, buttonsContainer));
        buttonsHandle.addEventListener('touchstart', (e) => startDrag(e, buttonsHandle, buttonsContainer), { passive: false });
        
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('touchmove', onDrag, { passive: false });
        
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
        
        // 页面加载时恢复布局
        loadLayout();

        // ==================== 缩放控制 ====================
        const scaleBtn = document.getElementById('scaleBtn');
        const scalePanel = document.getElementById('scalePanel');
        const joystickScaleUp = document.getElementById('joystickScaleUp');
        const joystickScaleDown = document.getElementById('joystickScaleDown');
        const joystickScaleValue = document.getElementById('joystickScaleValue');
        const buttonsScaleUp = document.getElementById('buttonsScaleUp');
        const buttonsScaleDown = document.getElementById('buttonsScaleDown');
        const buttonsScaleValue = document.getElementById('buttonsScaleValue');
        const spacingUp = document.getElementById('spacingUp');
        const spacingDown = document.getElementById('spacingDown');
        const spacingValue = document.getElementById('spacingValue');
        const scaleResetBtn = document.getElementById('scaleResetBtn');
        const joystickZoneEl = document.getElementById('joystickZone');
        const buttonsZoneEl = document.querySelector('.buttons-zone');
        
        // 缩放配置
        const SCALE_MIN = 0.6;
        const SCALE_MAX = 1.5;
        const SCALE_STEP = 0.1;
        
        // 间距配置（基准 200px）
        const SPACING_BASE = 200;
        const SPACING_MIN = 0.5;
        const SPACING_MAX = 1.5;
        const SPACING_STEP = 0.1;
        
        // 当前缩放值
        let joystickScale = 1.0;
        let buttonsScale = 1.0;
        let buttonsSpacing = 1.0;
        
        // 加载保存的缩放
        function loadScale() {
            const saved = localStorage.getItem('controllerScale');
            if (saved) {
                try {
                    const scale = JSON.parse(saved);
                    joystickScale = scale.joystick || 1.0;
                    buttonsScale = scale.buttons || 1.0;
                    buttonsSpacing = scale.spacing || 1.0;
                    applyScale();
                } catch (e) {
                    console.log('缩放加载失败');
                }
            }
        }
        
        // 保存缩放
        function saveScale() {
            const scale = {
                joystick: joystickScale,
                buttons: buttonsScale,
                spacing: buttonsSpacing
            };
            localStorage.setItem('controllerScale', JSON.stringify(scale));
        }
        
        // 应用缩放
        function applyScale() {
            // 摇杆缩放
            joystickZoneEl.style.transform = `scale(${joystickScale})`;
            joystickScaleValue.textContent = Math.round(joystickScale * 100) + '%';
            
            // 按钮缩放（只缩放按钮本身，不影响间距）
            const btns = buttonsZoneEl.querySelectorAll('.btn');
            btns.forEach(btn => {
                btn.style.transform = btn.style.transform.replace(/scale\([^)]*\)\s*/g, '') + ` scale(${buttonsScale})`;
                // 保持原有的 translate 变换
                if (btn.classList.contains('btn-n') || btn.classList.contains('btn-s')) {
                    btn.style.transform = `translateX(-50%) scale(${buttonsScale})`;
                } else {
                    btn.style.transform = `translateY(-50%) scale(${buttonsScale})`;
                }
            });
            buttonsScaleValue.textContent = Math.round(buttonsScale * 100) + '%';
            
            // 按钮间距
            const spacingSize = SPACING_BASE * buttonsSpacing;
            buttonsZoneEl.style.width = spacingSize + 'px';
            buttonsZoneEl.style.height = spacingSize + 'px';
            spacingValue.textContent = Math.round(buttonsSpacing * 100) + '%';
        }
        
        // 切换缩放面板
        scaleBtn.addEventListener('click', () => {
            scalePanel.classList.toggle('visible');
            scaleBtn.classList.toggle('active', scalePanel.classList.contains('visible'));
            if (navigator.vibrate) {
                navigator.vibrate(20);
            }
        });
        
        // 摇杆缩放
        joystickScaleUp.addEventListener('click', () => {
            joystickScale = Math.min(SCALE_MAX, joystickScale + SCALE_STEP);
            applyScale();
            saveScale();
            if (navigator.vibrate) navigator.vibrate(15);
        });
        
        joystickScaleDown.addEventListener('click', () => {
            joystickScale = Math.max(SCALE_MIN, joystickScale - SCALE_STEP);
            applyScale();
            saveScale();
            if (navigator.vibrate) navigator.vibrate(15);
        });
        
        // 按钮缩放
        buttonsScaleUp.addEventListener('click', () => {
            buttonsScale = Math.min(SCALE_MAX, buttonsScale + SCALE_STEP);
            applyScale();
            saveScale();
            if (navigator.vibrate) navigator.vibrate(15);
        });
        
        buttonsScaleDown.addEventListener('click', () => {
            buttonsScale = Math.max(SCALE_MIN, buttonsScale - SCALE_STEP);
            applyScale();
            saveScale();
            if (navigator.vibrate) navigator.vibrate(15);
        });
        
        // 按钮间距
        spacingUp.addEventListener('click', () => {
            buttonsSpacing = Math.min(SPACING_MAX, buttonsSpacing + SPACING_STEP);
            applyScale();
            saveScale();
            if (navigator.vibrate) navigator.vibrate(15);
        });
        
        spacingDown.addEventListener('click', () => {
            buttonsSpacing = Math.max(SPACING_MIN, buttonsSpacing - SPACING_STEP);
            applyScale();
            saveScale();
            if (navigator.vibrate) navigator.vibrate(15);
        });
        
        // 重置全部
        scaleResetBtn.addEventListener('click', () => {
            joystickScale = 1.0;
            buttonsScale = 1.0;
            buttonsSpacing = 1.0;
            applyScale();
            saveScale();
            if (navigator.vibrate) navigator.vibrate(30);
        });
        
        // 点击面板外关闭
        document.addEventListener('click', (e) => {
            if (!scalePanel.contains(e.target) && e.target !== scaleBtn && !scaleBtn.contains(e.target)) {
                scalePanel.classList.remove('visible');
                scaleBtn.classList.remove('active');
            }
        });
        
        // 加载保存的缩放
        loadScale();

        // ==================== 全屏 + 横屏锁定 ====================
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        
        const expandIcon = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
        const compressIcon = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
        
        // 锁定横屏
        async function lockLandscape() {
            try {
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                    console.log('横屏锁定成功');
                }
            } catch (err) {
                console.log('横屏锁定失败（可能不支持）:', err.message);
            }
        }
        
        // 解锁屏幕方向
        function unlockOrientation() {
            try {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            } catch (err) {
                console.log('解锁方向失败:', err.message);
            }
        }
        
        async function toggleFullscreen() {
            if (!document.fullscreenElement) {
                try {
                    await document.documentElement.requestFullscreen();
                    fullscreenIcon.innerHTML = compressIcon;
                    // 全屏后锁定横屏
                    await lockLandscape();
                } catch (err) {
                    console.log('全屏失败:', err);
                }
            } else {
                try {
                    unlockOrientation();
                    await document.exitFullscreen();
                    fullscreenIcon.innerHTML = expandIcon;
                } catch (err) {
                    console.log('退出全屏失败:', err);
                }
            }
        }
        
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // 提示页面的全屏按钮
        const hintFullscreenBtn = document.getElementById('hintFullscreenBtn');
        hintFullscreenBtn.addEventListener('click', toggleFullscreen);
        
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenIcon.innerHTML = compressIcon;
            } else {
                fullscreenIcon.innerHTML = expandIcon;
                unlockOrientation();
            }
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }
        });

        // ==================== 控制器状态（轮询模式） ====================
        const controllerState = {
            joystick: { x: 0, y: 0 },
            buttons: { N: false, S: false, E: false, W: false }
        };
        let pollInterval = null;
        const POLL_RATE = 60;  // 60Hz 轮询频率

        // ==================== WebSocket 连接 ====================
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 10;
        const statusDot = document.querySelector('.status-dot');
        const latencyDisplay = document.getElementById('latencyDisplay');
        
        let pingInterval = null;
        let latencyHistory = [];
        const maxLatencyHistory = 5;
        
        function updateLatencyDisplay(latency) {
            latencyHistory.push(latency);
            if (latencyHistory.length > maxLatencyHistory) {
                latencyHistory.shift();
            }
            const avgLatency = Math.round(latencyHistory.reduce((a, b) => a + b, 0) / latencyHistory.length);
            
            latencyDisplay.textContent = `${avgLatency} ms`;
            
            latencyDisplay.classList.remove('good', 'medium', 'bad');
            if (avgLatency < 50) {
                latencyDisplay.classList.add('good');
            } else if (avgLatency < 100) {
                latencyDisplay.classList.add('medium');
            } else {
                latencyDisplay.classList.add('bad');
            }
        }
        
        function sendPing() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const pingStartTime = Date.now();
                ws.send(JSON.stringify({ type: 'ping', timestamp: pingStartTime }));
            }
        }
        
        function updateStatus(state) {
            connectionState = state; // 'online', 'offline', 'connecting'
            if (state === 'online') {
                statusDot.style.background = '#00ff00';
                statusDot.style.boxShadow = '0 0 10px #00ff00';
                statusDot.style.animation = '';
            } else if (state === 'connecting') {
                statusDot.style.background = '#ffaa00';
                statusDot.style.boxShadow = '0 0 10px #ffaa00';
                statusDot.style.animation = 'blink 1s infinite';
            } else {
                statusDot.style.background = '#ff0066';
                statusDot.style.boxShadow = '0 0 10px #ff0066';
                statusDot.style.animation = 'blink 0.5s infinite';
                latencyDisplay.textContent = '-- ms';
                latencyDisplay.classList.remove('good', 'medium', 'bad');
            }
            updateStatusText();
        }
        
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            console.log('正在连接服务器:', wsUrl);
            updateStatus('connecting');
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('WebSocket 连接成功!');
                reconnectAttempts = 0;
                updateStatus('online');
                
                latencyHistory = [];
                sendPing();
                pingInterval = setInterval(sendPing, 2000);
                
                // 启动轮询
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(sendControllerState, 1000 / POLL_RATE);
            };
            
            ws.onclose = () => {
                console.log('WebSocket 连接断开');
                updateStatus('offline');
                
                if (pingInterval) {
                    clearInterval(pingInterval);
                    pingInterval = null;
                }
                
                // 停止轮询
                if (pollInterval) {
                    clearInterval(pollInterval);
                    pollInterval = null;
                }
                
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    const delay = Math.min(1000 * reconnectAttempts, 5000);
                    console.log(`${delay/1000}秒后尝试重连... (${reconnectAttempts}/${maxReconnectAttempts})`);
                    updateStatus('connecting');
                    setTimeout(connectWebSocket, delay);
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket 错误:', error);
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'connected') {
                        // 收到服务器分配的控制器 ID
                        const controllerId = data.controller_id;
                        const playerIdEl = document.getElementById('playerId');
                        playerIdEl.textContent = `P${controllerId}`;
                        console.log(`分配玩家编号: P${controllerId}`);
                    } else if (data.type === 'pong') {
                        const latency = Date.now() - data.timestamp;
                        updateLatencyDisplay(latency);
                    }
                } catch (e) {
                    console.log('收到消息:', event.data);
                }
            };
        }
        
        function sendMessage(data) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            }
        }
        
        // 发送完整控制器状态（轮询）
        function sendControllerState() {
            sendMessage({
                type: 'state',
                joystick: controllerState.joystick,
                buttons: controllerState.buttons
            });
        }
        
        connectWebSocket();
        
        // ==================== 摇杆控制 ====================
        const joystickZone = document.getElementById('joystickZone');
        const joystick = document.getElementById('joystick');
        const xValueDisplay = document.getElementById('xValue');
        const yValueDisplay = document.getElementById('yValue');
        
        let joystickTouchId = null;
        let isDragging = false;
        const maxDistance = 50;
        
        // 获取摇杆中心位置
        function getJoystickCenter() {
            const rect = joystickZone.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }
        
        function moveJoystick(screenX, screenY) {
            const center = getJoystickCenter();
            
            let deltaX = screenX - center.x;
            let deltaY = screenY - center.y;
            
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            if (distance > maxDistance) {
                const scale = maxDistance / distance;
                deltaX *= scale;
                deltaY *= scale;
            }
            
                joystick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            
            // 归一化值
            const normalizedX = deltaX / maxDistance;
            const normalizedY = deltaY / maxDistance;
            
            xValueDisplay.textContent = normalizedX.toFixed(2);
            yValueDisplay.textContent = normalizedY.toFixed(2);
            
            // 更新状态（轮询时会自动发送）
            controllerState.joystick.x = parseFloat(normalizedX.toFixed(3));
            controllerState.joystick.y = parseFloat(normalizedY.toFixed(3));
            }
        
        function resetJoystick() {
            joystick.style.transition = 'transform 0.15s ease-out';
            joystick.style.transform = 'translate(0, 0)';
            setTimeout(() => {
                joystick.style.transition = '';
            }, 150);
            
            xValueDisplay.textContent = '0.00';
            yValueDisplay.textContent = '0.00';
            
            // 更新状态（轮询时会自动发送）
            controllerState.joystick.x = 0;
            controllerState.joystick.y = 0;
            
            joystickTouchId = null;
            isDragging = false;
        }
        
        // 鼠标事件
        joystickZone.addEventListener('mousedown', (e) => {
            isDragging = true;
            moveJoystick(e.clientX, e.clientY);
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                moveJoystick(e.clientX, e.clientY);
            }
        });
        
        document.addEventListener('mouseup', () => {
            if (isDragging) {
                resetJoystick();
            }
        });
        
        // 触摸事件
        joystickZone.addEventListener('touchstart', (e) => {
            if (joystickTouchId === null) {
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                isDragging = true;
                moveJoystick(touch.clientX, touch.clientY);
                
                if (navigator.vibrate) {
                    navigator.vibrate(10);
                }
            }
            e.preventDefault();
        }, { passive: false });
        
        document.addEventListener('touchmove', (e) => {
            if (joystickTouchId !== null) {
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === joystickTouchId) {
                        moveJoystick(e.touches[i].clientX, e.touches[i].clientY);
                        break;
                    }
                }
            }
            e.preventDefault();
        }, { passive: false });
        
        document.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    isDragging = false;
                    resetJoystick();
                    break;
                }
            }
        });
        
        document.addEventListener('touchcancel', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    isDragging = false;
                    resetJoystick();
                    break;
                }
            }
        });
        
        // ==================== 按钮事件 ====================
        // 按钮配置：显示文字 → 标准方向ID（N/S/E/W）
        const buttonConfig = [
            { display: '北', id: 'N' },
            { display: '南', id: 'S' },
            { display: '西', id: 'W' },
            { display: '东', id: 'E' }
        ];
        const buttonTouchIds = {};
        
        buttonConfig.forEach(({ display, id }) => {
            const element = document.getElementById(`btn${display}`);
            buttonTouchIds[display] = null;
            
            function onPress() {
                // 更新状态（轮询时会自动发送）
                controllerState.buttons[id] = true;
                if (navigator.vibrate) {
                    navigator.vibrate(30);
                }
                element.classList.add('pressed');
            }
            
            function onRelease() {
                // 更新状态（轮询时会自动发送）
                controllerState.buttons[id] = false;
                element.classList.remove('pressed');
                buttonTouchIds[display] = null;
            }
            
            element.addEventListener('mousedown', onPress);
            element.addEventListener('mouseup', onRelease);
            element.addEventListener('mouseleave', onRelease);
            
            element.addEventListener('touchstart', (e) => {
                if (buttonTouchIds[display] === null) {
                    buttonTouchIds[display] = e.changedTouches[0].identifier;
                    onPress();
                }
                e.preventDefault();
                e.stopPropagation();
            }, { passive: false });
            
            element.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === buttonTouchIds[display]) {
                        onRelease();
                        break;
                    }
                }
                e.preventDefault();
                e.stopPropagation();
            }, { passive: false });
            
            element.addEventListener('touchcancel', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === buttonTouchIds[display]) {
                        onRelease();
                        break;
                    }
                }
                e.preventDefault();
                e.stopPropagation();
            }, { passive: false });
        });
        
        // 防止页面滚动
        document.body.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        // 页面关闭时断开连接
        window.addEventListener('beforeunload', () => {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
