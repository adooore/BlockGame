<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方寸枢机 - 颜色收集</title>
    <script src="libs/tailwind.js"></script>
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-pink: #ff00ff;
            --bg-dark: #050505;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'JetBrains Mono', monospace;
            touch-action: none;
        }

        /* Scanlines Effect */
        body::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 3px 100%;
            z-index: 10;
            pointer-events: none;
        }

        canvas { display: block; }

        #ui-overlay {
            position: absolute;
            top: 30px;
            left: 30px;
            color: var(--neon-cyan);
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 10px var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            transform-origin: top left;
            transition: transform 0.2s ease;
        }

        .cyber-border {
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 10px var(--neon-cyan);
            background: rgba(0, 0, 0, 0.8);
        }

        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 30px 40px;
            border-radius: 4px;
            text-align: center;
            display: none;
            z-index: 100;
            font-family: 'Orbitron', sans-serif;
            min-width: 400px;
        }

        .neon-text-pink { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink); }
        .neon-text-cyan { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }

        @keyframes flicker {
            0% { opacity: 0.9; } 5% { opacity: 0.5; } 10% { opacity: 0.9; } 100% { opacity: 1; }
        }
        .flicker { animation: flicker 3s infinite step-end; }

        .btn-cyber {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px 40px;
            font-size: 1.1rem;
            min-width: 200px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
        }

        .btn-cyber:hover, .btn-cyber.selected {
            background: var(--neon-cyan);
            color: #000 !important;
            box-shadow: 0 0 30px var(--neon-cyan);
        }

        /* 调试面板样式由 debugPanel.js 模块注入 */

        /* 菜单操作提示样式 */
        .menu-control-hints {
            margin-top: 24px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
        .hint-item { display: flex; align-items: center; gap: 4px; }
        .hint-key {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #fff;
            min-width: 20px;
            text-align: center;
        }
        .hint-sep { color: rgba(255, 255, 255, 0.3); }
        .hint-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-family: 'Zhi Mang Xing', cursive;
            font-size: 14px;
            color: #fff;
        }
        .hint-btn-west {
            border: 2px solid #3b82f6;
            background: rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.02); }
        }
    </style>
    <!-- 引入模块 -->
    <script src="js/controlHint.js"></script>
    <script src="js/gameData.js"></script>
    <script src="js/gridSystem.js"></script>
    <script src="js/waveSystem.js"></script>
    <script src="js/loadingAnimations.js"></script>
    <script src="js/gameUtils.js"></script>
    <script src="js/player.js"></script>
    <script src="js/controllerManager.js"></script>
    <script src="js/soundManager.js"></script>
    <script src="js/pauseMenu.js"></script>
    <script src="js/gameWebSocket.js"></script>
    <script src="js/debugPanel.js"></script>
</head>
<body>

    <div id="ui-overlay" class="flicker">
        <div class="text-3xl font-black mb-2 tracking-widest">用时: <span id="timer">00:00</span></div>
        <div class="text-sm opacity-70">最快记录: <span id="best-time">--:--</span></div>
        <div class="mt-2 text-xs" style="opacity: 0.8;">
            <span style="color: #4ade80;">游戏: <span id="play-time">00:00</span></span>
            <span class="ml-3" style="color: #ff6b6b;">惩罚: <span id="penalty-time-display">+0s</span></span>
        </div>
        
        <!-- 关卡标题 -->
        <div id="level-title" class="mb-2" style="font-size: 14px; opacity: 0.6; letter-spacing: 2px;"></div>
        
        <!-- 颜色指示器容器 -->
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <!-- 目标颜色指示器 -->
            <div id="target-color-box" class="mt-2" style="background: rgba(0,0,0,0.8); border: 3px solid #00f2ff; border-radius: 10px; padding: 12px 16px; display: inline-block;">
                <div style="font-size: 10px; opacity: 0.7; margin-bottom: 5px;">收集目标</div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div id="target-color-indicator" style="width: 35px; height: 35px; border-radius: 6px; background: #00f2ff; box-shadow: 0 0 15px #00f2ff;"></div>
                <div>
                        <div id="target-color-name" style="font-size: 16px; font-weight: bold;">青色</div>
                        <div id="target-color-count" style="font-size: 10px; opacity: 0.7;">剩余: 0</div>
                </div>
            </div>
        </div>
        
            <!-- 危险颜色指示器（第三关显示） -->
            <div id="danger-color-box" class="mt-2" style="background: rgba(0,0,0,0.8); border: 3px solid #ff00ff; border-radius: 10px; padding: 12px 16px; display: none;">
                <div style="font-size: 10px; opacity: 0.7; margin-bottom: 5px;">⚠ 危险障碍</div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div id="danger-color-indicator" style="width: 35px; height: 35px; border-radius: 6px; background: #ff00ff; box-shadow: 0 0 15px #ff00ff;"></div>
                    <div>
                        <div id="danger-color-name" style="font-size: 16px; font-weight: bold; color: #ff00ff;">粉色</div>
                        <div style="font-size: 10px; opacity: 0.7;">触碰即死</div>
        </div>
                </div>
            </div>
        </div>
        
        <!-- 操作提示和玩家状态由 JS 动态生成 -->
        <div id="game-ui-container"></div>
        <!-- 调试信息 -->
        <div id="debug-info" class="mt-4 text-xs tracking-widest" style="font-family: 'JetBrains Mono', monospace;">
            <div>波次: <span id="wave-num" class="neon-text-cyan">0</span></div>
            <div class="mt-1" id="color-counts">
                <!-- 动态生成颜色计数 -->
            </div>
        </div>
    </div>
    
    <!-- 开始蒙版由 JS 动态生成 -->

    <!-- Game Over / Victory 界面由 JS 动态生成 -->

    <!-- 调试面板由 debugPanel.js 模块动态创建 -->

    <canvas id="gameCanvas"></canvas>

    <script>
        // ==================== 获取关卡信息 ====================
        const urlParams = new URLSearchParams(window.location.search);
        const currentLevel = parseInt(urlParams.get('level')) || 1;
        
        // 关卡模式名称配置
        const LEVEL_MODES = {
            1: '基础模式',
            2: '动态目标',
            3: '极限模式'
        };
        
        // ==================== 加载界面 ====================
        const loadingScreen = LoadingAnimations.create({
            title: `颜色收集 · ${LEVEL_MODES[currentLevel] || '基础模式'}`,
            subtitle: '🤝 合作模式',
            subtitle2: '携手通关 · 共同挑战',
            minDuration: 1000,
            showControls: true,
            onComplete: () => {
                // 加载动画结束后播放游戏BGM并开始游戏
                SoundManager.playGameBGM();
                SoundManager.initBGMAutoplay();
                startGame();
            }
        });
        
        // ==================== 游戏配置 ====================
        const config = {
            gridSize: 12,
            tileGap: 6,
            playerSizeRatio: 0.5,
            moveSpeed: 5,
            dashMultiplier: 3.5,
            dashDuration: 8,
            dashCooldown: 30,
            jumpPower: 14,
            gravity: 1.0,
            trailLength: 6,
            maxWaves: 12,
            initialCyan: 12,
            cyanDecrement: 1,
            minCyan: 6,
            initialPink: 5,
            pinkIncrement: 2,
            maxPink: 25,
            colors: { bg: '#050505', grid: '#1a1a1a', cyan: '#00f2ff', pink: '#ff00ff' },
            collectibleColors: ['cyan', 'yellow', 'purple', 'orange'],
            colorHex: { cyan: '#00f2ff', yellow: '#facc15', purple: '#a855f7', orange: '#fb923c', pink: '#ff00ff', red: '#ff4444', gray: '#888888' },
            colorNames: { cyan: '青色', yellow: '黄色', purple: '紫色', orange: '橙色', pink: '粉色', red: '红色', gray: '灰色' },
            wrongColorPenalty: 5,
            dangerColors: ['pink', 'red', 'gray'],
            dangerColorHex: { pink: '#ff00ff', red: '#ff4444', gray: '#888888' },
            dangerColorNames: { pink: '粉色', red: '红色', gray: '灰色' },
            // 第三关：所有颜色统一池，可以互换
            allColors: ['cyan', 'yellow', 'purple', 'orange', 'pink', 'red', 'gray']
        };
        
        // ==================== 关卡配置 ====================
        // currentLevel 和 urlParams 已在上方定义
        const levelNames = { 1: '颜色收集 I', 2: '颜色收集 II', 3: '颜色收集 III' };
        const levelSubtitles = {
            1: '基础模式 - 固定目标与障碍',
            2: '进阶模式 - 动态目标颜色',
            3: '极限模式 - 双重颜色变换'
        };
        
        let targetColor = 'cyan';
        let dangerColor = 'pink';
        
        // 玩家颜色（使用 GameData 统一管理）
        const ALL_COLORS = GameData.playerColors.getAllColors();

        // ==================== DOM 元素 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timerElement = document.getElementById('timer');
        const bestTimeElement = document.getElementById('best-time');

        // ==================== 游戏状态 ====================
        let gameState = 'waiting';
        let gameTime = 0;
        let gameStartTime = 0;
        let bestTime = 0;
        let invincibleTimer = 0;
        const INVINCIBLE_DURATION = 120;
        const REVIVE_PENALTY = 60;
        let penaltyTime = 0;  // 惩罚时间（秒）
        let purePlayTime = 0;  // 纯游戏时间（秒）
        let width, height;
        
        // ==================== 初始化模块 ====================
        const gridSys = GridSystem.create({ gridSize: config.gridSize, tileGap: config.tileGap, colors: config.colors });
        const waveSys = WaveSystem.create({
            maxWaves: config.maxWaves,
            initialTarget: config.initialCyan,
            targetDecrement: config.cyanDecrement,
            minTarget: config.minCyan,
            initialDanger: config.initialPink,
            dangerIncrement: config.pinkIncrement,
            maxDanger: config.maxPink
        });
        const floatingText = GameUtils.createFloatingTextSystem();
        const menuSystem = GameUtils.createMenuSystem();
        const debugLog = GameUtils.createDebugLog('logContent', 20);
        
        // 游戏界面（使用抽象层）
        let gameScreens = null;   // 游戏结束屏幕
        
        // 基准 tileSize（用于速度缩放）
        const BASE_TILE_SIZE = 70;
        let scaledMoveSpeed = config.moveSpeed;
        
        // ==================== 玩家对象 ====================
        // 通过 ControllerManager 管理玩家，游戏只需关心玩家对象本身
        const GAME_PLAYER_COLORS = [ALL_COLORS[0], ALL_COLORS[1], ALL_COLORS[2], ALL_COLORS[3]];
        const SPAWN_OFFSETS = [
            { x: -1, y: 0 },   // P1 左侧
            { x: 1, y: 0 },    // P2 右侧
            { x: 0, y: -1 },   // P3 上方
            { x: 0, y: 1 }     // P4 下方
        ];
        
        // 兼容旧代码的引用
        let player = null;
        let player2 = null;
        
        /**
         * 创建游戏玩家对象（由 ControllerManager 调用）
         */
        function createGamePlayer(id) {
            // 从 GameData 读取保存的颜色，没有则使用默认
            const savedColor = GameData.playerColors.getPlayerColor(id);
            const colorData = savedColor || GAME_PLAYER_COLORS[(id - 1) % GAME_PLAYER_COLORS.length];
            
            const p = {
                id: id,
                x: 0, y: 0, z: 0, vz: 0, width: 0, height: 0, vx: 0, vy: 0,
                trail: [], 
                colors: { main: colorData.main, glow: colorData.glow, core: colorData.core },
                isJumping: false, isJumpHeld: false,
                dashTimer: 0, dashCooldown: 0, ghostMarker: null
            };
            // 设置初始大小
            const { tileSize } = gridSys;
            p.width = tileSize * config.playerSizeRatio;
            p.height = tileSize * config.playerSizeRatio;
            resetPlayerPosition(p, id);
            console.log(`[Game] 玩家 ${id} 加入游戏，颜色:`, colorData.name || colorData.main);

            // 更新兼容引用
            if (id === 1) player = p;
            if (id === 2) player2 = p;
            
            return p;
        }
        
        /**
         * 移除游戏玩家（由 ControllerManager 调用）
         */
        function removeGamePlayer(id) {
            console.log(`[Game] 玩家 ${id} 离开游戏`);
            if (id === 1) player = null;
            if (id === 2) player2 = null;
        }
        
        /**
         * 更新控制器 UI 显示（P1-P8）
         */
        // 游戏内 UI（操作提示 + 玩家状态）
        const gameUI = GameUtils.createGameUI(document.getElementById('game-ui-container'));
        
        function updateControllerUI() {
            gameUI.updateControllerUI(ControllerManager);
        }

        // ==================== 远程控制器 (WebSocket) ====================
        // 记录上一帧的按钮状态，用于检测按下事件
        let prevButtonStates = {};

        // 使用 GameWebSocket 抽象层
        GameWebSocket.init({
            loadingScreen: loadingScreen,
            onConfigLoaded: (gameData) => {
                // 加载最快记录
                const records = GameData._cache?.records?.eatAndAvoid;
                if (records?.bestTime) {
                    bestTime = records.bestTime;
                    bestTimeElement.textContent = GameUtils.formatBestTime(bestTime);
                }
                // 配置加载完成，初始化控制器
                initControllerAfterConfig();
            },
            onControllerUpdate: updateControllerUI
        });
        
        // 设置页面卸载时发送退出游戏状态
        GameWebSocket.setupUnloadHandler();

        // ==================== 玩家颜色加载 ====================
        function loadPlayerColors() {
            GameData.playerColors.applyToAllPlayers(ControllerManager.getPlayers());
        }

        // ==================== 异步加载最快记录 ====================
        async function loadBestTime() {
            bestTime = await GameData.records.getBestTime('eatAndAvoid');
            bestTimeElement.textContent = GameUtils.formatBestTime(bestTime);
        }
        loadBestTime();
            
        // ==================== UI 更新函数 ====================
        function updateTargetColorUI() {
            const hex = config.colorHex[targetColor];
            const name = config.colorNames[targetColor];
            const box = document.getElementById('target-color-box');
            const indicator = document.getElementById('target-color-indicator');
            const nameEl = document.getElementById('target-color-name');
            
            box.style.borderColor = hex;
            indicator.style.background = hex;
            indicator.style.boxShadow = `0 0 20px ${hex}`;
            nameEl.textContent = name;
            nameEl.style.color = hex;
            nameEl.style.textShadow = `0 0 10px ${hex}`;
        }
        
        function updateDangerColorUI() {
            // 使用统一的颜色配置（支持所有颜色作为危险色）
            const hex = config.colorHex[dangerColor] || '#ff00ff';
            const name = config.colorNames[dangerColor] || '未知';
            const box = document.getElementById('danger-color-box');
            const indicator = document.getElementById('danger-color-indicator');
            const nameEl = document.getElementById('danger-color-name');
            
            box.style.borderColor = hex;
            indicator.style.background = hex;
            indicator.style.boxShadow = `0 0 15px ${hex}`;
            nameEl.textContent = name;
            nameEl.style.color = hex;
        }
        
        function initLevelUI() {
            document.getElementById('level-title').textContent = `${levelNames[currentLevel]} - ${levelSubtitles[currentLevel]}`;
            // 所有关卡都显示危险障碍框，UI统一
            document.getElementById('danger-color-box').style.display = 'inline-block';
            updateDangerColorUI();
            console.log(`[Game] 关卡模式: ${currentLevel} - ${levelNames[currentLevel]}`);
        }
        
        function updateDebugInfo() {
            document.getElementById('wave-num').textContent = waveSys.waveNumber;
            
            // 动态生成所有颜色的计数
            const colorCountsEl = document.getElementById('color-counts');
            let html = '';
            
            // 第三关: 所有颜色统一显示
            // 其他关卡: 分开显示收集色和危险色
            const colorsToShow = currentLevel >= 3 ? config.allColors : config.collectibleColors;
            
            colorsToShow.forEach(color => {
                const count = gridSys.countTiles(color);
                const hex = config.colorHex[color];
                const isTarget = color === targetColor;
                const isDanger = color === dangerColor;
                let marker = '■';
                if (isTarget) marker = '★';
                else if (isDanger) marker = '⚠';
                html += `<span style="color: ${hex}; text-shadow: 0 0 5px ${hex}; ${isTarget || isDanger ? 'font-weight: bold;' : ''}">${marker}</span> ${count} `;
            });
            
            // 非第三关显示危险色
            if (currentLevel < 3) {
                html += '<br>';
                config.dangerColors.forEach(color => {
                    const count = gridSys.countTiles(color);
                    const hex = config.colorHex[color];
                    const isDanger = color === dangerColor;
                    const marker = isDanger ? '⚠' : '■';
                    html += `<span style="color: ${hex}; text-shadow: 0 0 5px ${hex}; ${isDanger ? 'font-weight: bold;' : ''}">${marker}</span> ${count} `;
                });
            }
            
            colorCountsEl.innerHTML = html;
        }
        
        // 判断是否为当前的危险颜色
        function isDangerColor(type) { return type === dangerColor; }

        // ==================== 波次系统 ====================
        function triggerNewWave() {
            // 关卡3: 所有颜色可互换，目标和危险从同一个池子里选
            // 关卡1-2: 目标从收集色选，危险固定为粉色
            let availableColors;
            
            if (currentLevel === 3) {
                // 第三关：从所有颜色中随机选择目标和危险（不能相同）
                availableColors = [...config.allColors];
                targetColor = GameUtils.randomChoice(availableColors);
                const dangerChoices = availableColors.filter(c => c !== targetColor);
                dangerColor = GameUtils.randomChoice(dangerChoices);
                updateDangerColorUI();
            } else if (currentLevel === 2) {
                // 第二关：目标颜色变换，危险固定
                availableColors = config.collectibleColors;
                targetColor = GameUtils.randomChoice(availableColors);
                dangerColor = 'pink';
            } else {
                // 第一关：固定目标和危险
                availableColors = config.collectibleColors;
                targetColor = 'cyan';
                dangerColor = 'pink';
            }
            
            updateTargetColorUI();
            
            // 使用波次系统生成方块
            const allPlayers = ControllerManager.getPlayers();
            const result = waveSys.triggerWave(gridSys, {
                targetColors: availableColors,
                dangerColors: [dangerColor],
                currentTarget: targetColor,
                currentDanger: dangerColor,
                players: Object.values(allPlayers),
                dynamicTarget: currentLevel >= 2,
                dynamicDanger: currentLevel >= 3,
                otherColorRatio: 0.6
            });
            
            // 覆盖波次系统的颜色（因为我们自己设置了）
            // 重新放置方块以使用正确的颜色
            gridSys.clearAll();
            const occupied = gridSys.getOccupiedTiles(Object.values(allPlayers));
            const availableTiles = gridSys.getAvailableTiles(occupied);
            const shuffled = GameUtils.shuffle([...availableTiles]);
            
            const { targetCount, dangerCount } = waveSys.getWaveConfig();
            // 干扰色比例随波次递增：60% -> 100%
            // 第1波60%，第12波100%
            const waveProgress = (waveSys.waveNumber - 1) / (config.maxWaves - 1);
            const otherColorRatio = 0.6 + waveProgress * 0.4;  // 0.6 ~ 1.0
            const otherColorCount = Math.max(1, Math.floor(targetCount * otherColorRatio));
            
            let idx = 0;
            const collectibleTiles = [];
            
            // 放置目标颜色方块
            const actualTarget = Math.min(targetCount, shuffled.length - idx);
            for (let i = 0; i < actualTarget && idx < shuffled.length; i++, idx++) {
                shuffled[idx].type = targetColor;
                shuffled[idx].pulse = 0;
                collectibleTiles.push(shuffled[idx]);
            }
            
            // 放置其他颜色方块（干扰项）- 排除目标色和危险色
            if (currentLevel >= 2) {
                const otherColors = availableColors.filter(c => c !== targetColor && c !== dangerColor);
            otherColors.forEach(color => {
                const count = Math.min(otherColorCount, shuffled.length - idx);
                for (let i = 0; i < count && idx < shuffled.length; i++, idx++) {
                    shuffled[idx].type = color;
                    shuffled[idx].pulse = 0;
                    collectibleTiles.push(shuffled[idx]);
                }
            });
            }
            
            // 安全区
            const safeZone = new Set();
            const directions = [[-1,0], [1,0], [0,-1], [0,1]];
            collectibleTiles.forEach(tile => {
                directions.forEach(([dr, dc]) => {
                    const nr = tile.row + dr;
                    const nc = tile.col + dc;
                    if (nr >= 0 && nr < config.gridSize && nc >= 0 && nc < config.gridSize) {
                        safeZone.add(`${nr},${nc}`);
                    }
                });
            });
            
            // 放置危险方块
            let dangerPlaced = 0;
            for (let i = idx; i < shuffled.length && dangerPlaced < dangerCount; i++) {
                const tile = shuffled[i];
                if (!safeZone.has(`${tile.row},${tile.col}`)) {
                    tile.type = dangerColor;
                    tile.pulse = 0;
                    dangerPlaced++;
                }
            }
            
            console.log(`[Wave ${waveSys.waveNumber}] 目标: ${targetColor}, 目标数: ${actualTarget}, 粉色: ${dangerPlaced}`);
            debugLog.logWave(waveSys.waveNumber, actualTarget, dangerPlaced);
            
            invincibleTimer = INVINCIBLE_DURATION;
        }
        
        function checkAndRefresh() {
            if (gameState !== 'playing') return;
            
            const targetCount = gridSys.countTiles(targetColor);
            document.getElementById('target-color-count').textContent = `剩余: ${targetCount}`;
            
            if (targetCount === 0) {

                    victory();

                    triggerNewWave();
                }
            }
        }

        // ==================== 游戏输入处理 ====================
        // ControllerManager 已经处理了键盘映射，这里只需要监听特殊事件
        let menuInputThrottle = false;
        let menuInputLocked = false;  // 菜单输入锁定（游戏结束后必须松开所有按键才能操作）
        let prevMenuInput = { joystick: { x: 0, y: 0 }, buttons: { N: false, S: false, E: false, W: false } };
        
        /**
         * 重置菜单输入状态（游戏结束时调用）
         * 锁定菜单输入，直到玩家松开所有按键
         */
        function resetMenuInputState() {
            menuInputLocked = true;
            menuInputThrottle = true;
            console.log('[Menu] 菜单输入已锁定，等待松开所有按键');
        }
        
        /**
         * 检测输入变化（用于菜单等需要检测"按下"而非"按住"的场景）
         */
        function checkMenuInput() {
            const input = ControllerManager.getInput(1);
            if (!input) {
                console.log('[Menu] 没有获取到输入');
                return;
            }
            
            const deadzone = 0.3;
            
            // 检查是否有任何输入（摇杆或按钮）
            const hasAnyInput = Math.abs(input.joystick.x) > deadzone || 
                               Math.abs(input.joystick.y) > deadzone ||
                               input.buttons.N || input.buttons.S || 
                               input.buttons.E || input.buttons.W;
            
            // 如果菜单被锁定，等待所有按键松开才解锁
            if (menuInputLocked) {
                console.log('[Menu] 锁定中, hasAnyInput:', hasAnyInput, 
                    'joystick:', input.joystick.x.toFixed(2), input.joystick.y.toFixed(2),
                    'buttons:', input.buttons);
                if (!hasAnyInput) {
                    console.log('[Menu] 检测到全部松开，解锁菜单！');
                    menuInputLocked = false;
                    menuInputThrottle = false;
                    // 重置 prevMenuInput 为全部松开状态
                    prevMenuInput = { joystick: { x: 0, y: 0 }, buttons: { N: false, S: false, E: false, W: false } };
                }
                return;  // 锁定期间不处理菜单输入
            }
            
            // 检测摇杆移动（有死区的方向变化）
            const newUp = input.joystick.y < -deadzone;
            const newDown = input.joystick.y > deadzone;
            const oldUp = prevMenuInput.joystick.y < -deadzone;
            const oldDown = prevMenuInput.joystick.y > deadzone;
            
            if (!menuInputThrottle) {
                if (newUp && !oldUp) {
                    console.log('[Menu] 触发 moveUp');
                        menuSystem.moveUp();
                    menuInputThrottle = true;
                    setTimeout(() => menuInputThrottle = false, 150);
                    }
                if (newDown && !oldDown) {
                    console.log('[Menu] 触发 moveDown');
                        menuSystem.moveDown();
                    menuInputThrottle = true;
                    setTimeout(() => menuInputThrottle = false, 150);
                    }
                }
            
            // 确认按钮 (只有西键 = 确认，避免跳跃键误触)
            const confirmPressed = (input.buttons.W && !prevMenuInput.buttons.W);
            if (confirmPressed) {
                console.log('[Menu] 触发 confirm');
                menuSystem.confirm();
            }
            
            // 保存当前状态
            prevMenuInput = {
                joystick: { ...input.joystick },
                buttons: { ...input.buttons }
            };
        }

        // ==================== 游戏更新 ====================
        function update() {
            // 暂停检测（手柄 Start 按钮）
            PauseMenu.pollGamepadStart();
            if (PauseMenu.isPaused()) return;
            
            if (gameState !== 'playing') return;

            if (gameStartTime > 0) {
                purePlayTime = (Date.now() - gameStartTime) / 1000;
                gameTime = purePlayTime + penaltyTime;
                timerElement.textContent = GameUtils.formatTime(gameTime);
                document.getElementById('play-time').textContent = GameUtils.formatTime(purePlayTime);
                document.getElementById('penalty-time-display').textContent = penaltyTime > 0 ? `+${penaltyTime}s` : '+0s';
            }

            const deadzone = 0.3;
            const players = ControllerManager.getPlayers();

            // 遍历所有活跃玩家
            Object.values(players).forEach(p => {
                // 从 ControllerManager 获取统一的输入（已合并键盘和手柄）
                const input = ControllerManager.getInput(p.id);
                
                p.vx = 0; p.vy = 0;
                
                // 获取摇杆输入（ControllerManager 已处理键盘->摇杆映射）
                if (input && (Math.abs(input.joystick.x) > deadzone || Math.abs(input.joystick.y) > deadzone)) {
                    p.vx = input.joystick.x;
                    p.vy = input.joystick.y;
            }
            
                // 处理按钮输入（按下事件）
                if (input && input.buttons) {
                    const prevState = prevButtonStates[p.id] || { S: false, E: false };
                    
                    // 南键 = 跳跃
                    p.isJumpHeld = input.buttons.S;
                    if (input.buttons.S && !prevState.S && !p.isJumping) {
                        p.isJumping = true;
                        p.vz = config.jumpPower;
                        p.ghostMarker = { x: p.x, y: p.y, type: 'jump', opacity: 1, timer: 60 };
                        SoundManager.playJump();
                    }
                    
                    // 东键 = 冲刺
                    if (input.buttons.E && !prevState.E && p.dashCooldown <= 0 && (p.vx !== 0 || p.vy !== 0)) {
                        p.dashTimer = config.dashDuration;
                        p.dashCooldown = config.dashCooldown;
                        p.ghostMarker = { x: p.x, y: p.y, type: 'dash', opacity: 1, timer: 60 };
                        SoundManager.playDash();
                    }
                    
                    // 保存当前状态供下一帧比较
                    prevButtonStates[p.id] = { S: input.buttons.S, E: input.buttons.E };
                }
                
                // 静步检测 (北键 = 静步)
                const isPrecise = input && input.buttons && input.buttons.N;
                const speedMult = isPrecise ? 0.5 : 1.0;

                updatePlayerMovement(p, speedMult);
            });

            if (invincibleTimer > 0) invincibleTimer--;

            // 碰撞检测 - 遍历所有玩家
            Object.values(players).forEach(p => {
                checkPlayerCollision(p);
            });

            gridSys.grid.forEach(t => t.pulse += 0.05);
            updateDebugInfo();
            checkAndRefresh();
        }
        
        function updatePlayerMovement(p, speedMult) {
            const { gridX, gridY, gridTotalDim, tileSize } = gridSys;
            
            const isDashing = p.dashTimer > 0;
            if (isDashing) {
                p.x += p.vx * scaledMoveSpeed * config.dashMultiplier * speedMult;
                p.y += p.vy * scaledMoveSpeed * config.dashMultiplier * speedMult;
                p.dashTimer--;
                } else {
                p.x += p.vx * scaledMoveSpeed * speedMult;
                p.y += p.vy * scaledMoveSpeed * speedMult;
                }
            if (p.dashCooldown > 0) p.dashCooldown--;

            if (p.isJumping) {
                p.z += p.vz;
                const effectiveGravity = p.isJumpHeld ? config.gravity * 0.5 : config.gravity;
                p.vz -= effectiveGravity;
                if (p.z <= 0) { 
                    p.z = 0; p.vz = 0; p.isJumping = false; p.isJumpHeld = false;
                    SoundManager.playLand();
                }
                }

            const isMoving = p.vx !== 0 || p.vy !== 0;
            if (isMoving || p.isJumping) p.trail.unshift({x: p.x, y: p.y, z: p.z, opacity: 1});
            const maxTrail = p.dashTimer > 0 ? config.trailLength + 4 : config.trailLength;
            while (p.trail.length > maxTrail) p.trail.pop();
            if (!isMoving && !p.isJumping && p.trail.length > 0) p.trail.pop();

            p.x = Math.max(gridX, Math.min(p.x, gridX + gridTotalDim - p.width));
            p.y = Math.max(gridY, Math.min(p.y, gridY + gridTotalDim - p.height));

            if (p.ghostMarker) {
                p.ghostMarker.timer--;
                p.ghostMarker.opacity = p.ghostMarker.timer / 60;
                if (p.ghostMarker.timer <= 0) p.ghostMarker = null;
                }
            }

        function checkPlayerCollision(p) {
            if (p.z >= 1) return;
            
            const { gridX, gridY, tileSize } = gridSys;
            const cx = p.x + p.width/2;
            const cy = p.y + p.height/2;
                const col = Math.floor((cx - gridX) / (tileSize + config.tileGap));
                const row = Math.floor((cy - gridY) / (tileSize + config.tileGap));

                if (row >= 0 && row < config.gridSize && col >= 0 && col < config.gridSize) {
                const tile = gridSys.grid.find(t => t.row === row && t.col === col);
                    if (tile && tile.type !== 'none') {
                    // 判断是否为危险颜色（当前波次的危险色）
                    if (isDangerColor(tile.type) && invincibleTimer <= 0) {
                            gameOver();
                            return;
                    } 
                    // 判断是否为可收集颜色（非危险色的所有颜色）
                    else if (!isDangerColor(tile.type) && config.colorHex[tile.type]) {
                        const pos = gridSys.getTilePosition(row, col);
                            if (tile.type === targetColor) {
                                tile.type = 'none';
                            floatingText.show('+正确', config.colorHex[targetColor], pos.centerX, pos.y);
                            SoundManager.playScore();  // 播放得分音效
                            } else {
                                tile.type = 'none';
                            penaltyTime += config.wrongColorPenalty;
                            floatingText.show(`+${config.wrongColorPenalty}秒 颜色错误!`, '#ff6b6b', pos.centerX, pos.y);
                            SoundManager.playError();  // 播放错误音效
                            ControllerManager.vibrateLight();  // 手柄震动反馈
                            }
                        }
                    }
                }
            }
            
        // ==================== 绘制 ====================
        function draw() {
            // 重置 canvas 状态，防止残留效果
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            
            ctx.fillStyle = config.colors.bg;
            ctx.fillRect(0, 0, width, height);

            const { gridX, gridY, gridTotalDim, tileSize } = gridSys;

            // 网格线
            gridSys.drawGridLines(ctx);

            // 方块
            gridSys.drawTiles(ctx, (tile) => {
                // 所有颜色都从统一的 colorHex 获取
                const color = config.colorHex[tile.type] || config.colors.cyan;
                // 目标色高亮，危险色用不同的渲染风格
                return { 
                    color, 
                    isHighlight: tile.type === targetColor,
                    isDanger: isDangerColor(tile.type)
                };
            });

            // 绘制玩家 - 遍历所有玩家
            const players = ControllerManager.getPlayers();
            Object.values(players).forEach(p => {
                drawPlayer(p);
            });

            // 浮动文字
            floatingText.draw(ctx);
            floatingText.update();
            
            // 菜单状态下检查输入
            if (gameState === 'gameover' || gameState === 'victory') {
                checkMenuInput();
            }
            
            requestAnimationFrame(() => { update(); draw(); });
        }
        
        function drawPlayer(p) {
            const { tileSize } = gridSys;

            // Ghost Marker
            if (p.ghostMarker) {
                const ghost = p.ghostMarker;
                ctx.globalAlpha = ghost.opacity * 0.6;
                ctx.strokeStyle = p.colors.main;
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.strokeRect(ghost.x, ghost.y, p.width, p.height);
                ctx.beginPath();
                ctx.moveTo(ghost.x + p.width/2, ghost.y + p.height/2);
                ctx.lineTo(p.x + p.width/2, p.y + p.height/2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.globalAlpha = 1;
            }

            // Shadow
            if (p.z > 0) {
                const shadowScale = Math.max(0.2, 1 - p.z / 150);
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath();
                ctx.ellipse(p.x + p.width/2, p.y + p.height/2, (p.width/2) * shadowScale, (p.height/2) * shadowScale, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Trails
            p.trail.forEach((t, i) => {
                const trailScale = 1 + (t.z / 120);
                const tw = p.width * trailScale;
                const th = p.height * trailScale;
                const tx = t.x - (tw - p.width) / 2;
                const ty = t.y - (th - p.height) / 2;
                ctx.globalAlpha = (p.trail.length - i) / (p.trail.length * 3);
                ctx.fillStyle = p.colors.main;
                ctx.fillRect(tx, ty, tw, th);
            });
            ctx.globalAlpha = 1.0;

            // Body
            const jumpScale = 1 + (p.z / 80);
            const drawW = p.width * jumpScale;
            const drawH = p.height * jumpScale;
            const drawX = p.x - (drawW - p.width) / 2;
            const drawY = p.y - (drawH - p.height) / 2;

            const isInvincible = invincibleTimer > 0;
            if (isInvincible) ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 50) * 0.5;

            ctx.shadowBlur = 15 + Math.sin(Date.now()/100) * 5 + (p.z/5);
            ctx.shadowColor = isInvincible ? '#ffffff' : p.colors.glow;
            ctx.fillStyle = p.colors.main;
            ctx.fillRect(drawX, drawY, drawW, drawH);
            
            ctx.fillStyle = p.colors.core;
            ctx.fillRect(drawX + drawW*0.25, drawY + drawH*0.25, drawW*0.5, drawH*0.5);
            ctx.shadowBlur = 0;
                ctx.globalAlpha = 1.0;
            }

        // ==================== 游戏结束/胜利 ====================
        function gameOver() {
            gameState = 'gameover';
            ControllerManager.vibrateStrong();  // 死亡时强烈震动
            
            const finalTime = Math.floor(gameTime);
            const finalPlayTime = Math.floor(purePlayTime);
            const finalPenalty = Math.floor(penaltyTime);
            
            gameScreens.showGameOver({
                totalTime: finalTime,
                playTime: finalPlayTime,
                penaltyTime: finalPenalty,
                bestTime: bestTime
            });
            
            ControlHint.hide();
            resetMenuInputState();
        }
        
        function victory() {
            gameState = 'victory';
            const finalTime = Math.floor(gameTime);
            const finalPlayTime = Math.floor(purePlayTime);
            const finalPenalty = Math.floor(penaltyTime);
            
            if (bestTime === 0 || finalTime < bestTime) {
                bestTime = finalTime;
                GameData.records.setBestTime('eatAndAvoid', bestTime);
            }
            
            bestTimeElement.textContent = GameUtils.formatBestTime(bestTime);
            
            gameScreens.showVictory({
                totalTime: finalTime,
                playTime: finalPlayTime,
                penaltyTime: finalPenalty,
                bestTime: bestTime
            });
            
            ControlHint.hide();
            debugLog.add(`<span style="color: #ffd700;">🎉 通关！游戏: ${GameUtils.formatTime(finalPlayTime)} + 惩罚: ${finalPenalty}s = 总计: ${GameUtils.formatTime(finalTime)}</span>`);
            resetMenuInputState();
        }
        
        function resetPlayerPosition(p, playerId) {
            p.trail = [];
            // 根据玩家ID设置不同的初始位置
            const id = playerId || p.id || 1;
            const offset = SPAWN_OFFSETS[(id - 1) % SPAWN_OFFSETS.length];
            p.x = width / 2 - p.width / 2 + offset.x * gridSys.tileSize * 1.5;
            p.y = height / 2 - p.height / 2 + offset.y * gridSys.tileSize * 1.5;
            p.z = 0;
            p.vz = 0;
        }

        // ==================== 调试面板初始化（由 DebugPanel 模块处理）====================

        // ControllerManager 初始化延迟到 WebSocket 连接成功后
        // 这样可以先加载配置，再根据配置创建玩家，避免先创建再删除
        let controllerInitialized = false;
        
        function initControllerAfterConfig() {
            if (controllerInitialized) return;
            controllerInitialized = true;
            
            const keyboardEnabled = GameData.gameSettings.getKeyboardEnabled();
            console.log('[Game] 配置加载完成，键盘控制:', keyboardEnabled ? '启用' : '禁用');
            
            ControllerManager.init({

                    console.log('[Game] 设备重新分配，通知 Web 控制器更新 playerId:', webControllerMapping);
                    const ws = GameData._ws;

        // ==================== 音频（使用 SoundManager 统一管理）====================

        // 全局按钮点击音效
        document.addEventListener('click', (e) => {
            const target = e.target.closest('button, .btn-cyber, .menu-btn');
            if (target) {
                SoundManager.playClick();
            }
        });
        
        // 加载保存的音量设置
        (function applyVolumeSettings() {
            const volumes = GameData.gameSettings.getVolume();
            SoundManager.setMasterVolume(volumes.master);
            SoundManager.setBGMVolume(volumes.bgm);
            SoundManager.setSFXVolume(volumes.sfx);
        })();
        
        // BGM 已在加载动画 onComplete 中播放
        // 页面卸载通知已由 GameWebSocket.setupUnloadHandler() 处理
    </script>
</body>
</html>
