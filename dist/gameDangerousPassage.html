<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方寸枢机 - 危险通道</title>
    <script src="libs/tailwind.js"></script>
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-pink: #ff00ff;
            --bg-dark: #050505;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'JetBrains Mono', monospace;
            touch-action: none;
        }

        /* Scanlines Effect */
        body::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 3px 100%;
            z-index: 10;
            pointer-events: none;
        }

        canvas { display: block; }

        #ui-overlay {
            position: absolute;
            top: 30px;
            left: 30px;
            color: var(--neon-cyan);
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 10px var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            transform-origin: top left;
            transition: transform 0.2s ease;
        }

        .cyber-border {
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 10px var(--neon-cyan);
            background: rgba(0, 0, 0, 0.8);
        }

        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 30px 40px;
            border-radius: 4px;
            text-align: center;
            display: none;
            z-index: 100;
            font-family: 'Orbitron', sans-serif;
            min-width: 400px;
        }

        .neon-text-pink { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink); }
        .neon-text-cyan { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }

        @keyframes flicker {
            0% { opacity: 0.9; } 5% { opacity: 0.5; } 10% { opacity: 0.9; } 100% { opacity: 1; }
        }
        .flicker { animation: flicker 3s infinite step-end; }

        .btn-cyber {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px 40px;
            font-size: 1.1rem;
            min-width: 200px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
        }

        .btn-cyber:hover, .btn-cyber.selected {
            background: var(--neon-cyan);
            color: #000 !important;
            box-shadow: 0 0 30px var(--neon-cyan);
        }

        /* 调试面板样式由 debugPanel.js 模块注入 */

        /* 菜单操作提示样式 */
        .menu-control-hints {
            margin-top: 24px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
        .hint-item { display: flex; align-items: center; gap: 4px; }
        .hint-key {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #fff;
            min-width: 20px;
            text-align: center;
        }
        .hint-sep { color: rgba(255, 255, 255, 0.3); }
        .hint-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-family: 'Zhi Mang Xing', cursive;
            font-size: 14px;
            color: #fff;
        }
        .hint-btn-west {
            border: 2px solid #3b82f6;
            background: rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.02); }
        }
    </style>
    <!-- 引入模块 -->
    <script src="js/controlHint.js"></script>

    <script src="js/loadingAnimations.js"></script>
    <script src="js/gameUtils.js"></script>

    <script src="js/controllerManager.js"></script>

    <script src="js/pauseMenu.js"></script>

    <script src="js/debugPanel.js"></script>
</head>
<body>

    <div id="ui-overlay" class="flicker">
        <div class="text-3xl font-black mb-2 tracking-widest">用时: <span id="timer">00:00</span></div>
        <div class="text-sm opacity-70">最快记录: <span id="best-time">--:--</span></div>
        <div class="mt-2 text-xs" style="opacity: 0.8;">
            <span style="color: #4ade80;">游戏: <span id="play-time">00:00</span></span>
            <span class="ml-3" style="color: #ff6b6b;">惩罚: <span id="penalty-time-display">+0s</span></span>
        </div>
        
        <!-- 关卡标题 -->
        <div id="level-title" class="mb-2" style="font-size: 14px; opacity: 0.6; letter-spacing: 2px;"></div>
        
        <!-- 颜色指示器容器 -->
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <!-- 目标颜色指示器 -->
            <div id="target-color-box" class="mt-2" style="background: rgba(0,0,0,0.8); border: 3px solid #00f2ff; border-radius: 10px; padding: 12px 16px; display: inline-block;">
                <div style="font-size: 10px; opacity: 0.7; margin-bottom: 5px;">收集目标</div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div id="target-color-indicator" style="width: 35px; height: 35px; border-radius: 6px; background: #00f2ff; box-shadow: 0 0 15px #00f2ff;"></div>
                <div>
                        <div id="target-color-name" style="font-size: 16px; font-weight: bold;">青色</div>
                        <div id="target-color-count" style="font-size: 10px; opacity: 0.7;">剩余: 0</div>
                </div>
            </div>
        </div>
        
            <!-- 危险颜色指示器（第三关显示） -->
            <div id="danger-color-box" class="mt-2" style="background: rgba(0,0,0,0.8); border: 3px solid #ff00ff; border-radius: 10px; padding: 12px 16px; display: none;">
                <div style="font-size: 10px; opacity: 0.7; margin-bottom: 5px;">⚠ 危险障碍</div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div id="danger-color-indicator" style="width: 35px; height: 35px; border-radius: 6px; background: #ff4444; box-shadow: 0 0 15px #ff0000;"></div>
                    <div>
                        <div id="danger-color-name" style="font-size: 16px; font-weight: bold; color: #ff4444;">红线</div>
                        <div id="danger-desc" style="font-size: 10px; opacity: 0.7;">闪避移动</div>
        </div>
                </div>
            </div>
        </div>
        
        <!-- 操作提示和玩家状态由 JS 动态生成 -->
        <div id="game-ui-container"></div>
        <!-- 调试信息 -->
        <div id="debug-info" class="mt-4 text-xs tracking-widest" style="font-family: 'JetBrains Mono', monospace;">
            <div>波次: <span id="wave-num" class="neon-text-cyan">0</span></div>
            <div class="mt-1" id="color-counts">
                <!-- 动态生成颜色计数 -->
            </div>
        </div>
    </div>
    
    <!-- 开始蒙版由 JS 动态生成 -->

    <!-- Game Over / Victory 界面由 JS 动态生成 -->

    <!-- 调试面板由 debugPanel.js 模块动态创建 -->

    <canvas id="gameCanvas"></canvas>

    <script>
        // ==================== 获取关卡信息 ====================
        const urlParams = new URLSearchParams(window.location.search);
        const currentLevel = parseInt(urlParams.get('level')) || 1;
        
        // 关卡模式名称配置
        const LEVEL_MODES = {
            1: '基础通道',
            2: '双重封锁',
            3: '极限穿越'
        };
        
        // ==================== 加载界面 ====================
        const loadingScreen = LoadingAnimations.create({
            title: `危险通道 · ${LEVEL_MODES[currentLevel] || '基础通道'}`,
            subtitle: '🤝 合作模式',
            subtitle2: '携手通关 · 共同挑战',
            minDuration: 1000,
            showControls: true,
            onComplete: () => {
                // 加载动画结束后播放游戏BGM并开始游戏
                SoundManager.playDangerousBGM();
                SoundManager.initBGMAutoplay();
                startGame();
            }
        });
        
        // ==================== 游戏配置 ====================
        const config = {
            gridSize: 12,
            tileGap: 6,
            playerSizeRatio: 0.5,
            moveSpeed: 7.5,
            dashMultiplier: 3.5,
            dashDuration: 8,
            dashCooldown: 30,
            jumpPower: 14,
            gravity: 1.0,
            trailLength: 6,
            maxWaves: 12,
            initialCyan: 4,      // 第一关4个方块
            cyanDecrement: -1,   // 负数表示递增（每波+1）
            minCyan: 4,
            maxCyan: 16,         // 递增模式的上限
            initialPink: 5,
            pinkIncrement: 2,
            maxPink: 25,
            colors: { bg: '#050505', grid: '#1a1a1a', cyan: '#00f2ff', pink: '#ff00ff' },
            collectibleColors: ['cyan', 'yellow', 'purple', 'orange'],
            colorHex: { cyan: '#00f2ff', yellow: '#facc15', purple: '#a855f7', orange: '#fb923c', pink: '#ff00ff', red: '#ff4444', gray: '#888888' },
            colorNames: { cyan: '青色', yellow: '黄色', purple: '紫色', orange: '橙色', pink: '粉色', red: '红色', gray: '灰色' },
            wrongColorPenalty: 5,
            dangerColors: ['pink', 'red', 'gray'],
            dangerColorHex: { pink: '#ff00ff', red: '#ff4444', gray: '#888888' },
            dangerColorNames: { pink: '粉色', red: '红色', gray: '灰色' },
            // 第三关：所有颜色统一池，可以互换
            allColors: ['cyan', 'yellow', 'purple', 'orange', 'pink', 'red', 'gray']
        };
        
        // ==================== 关卡配置 ====================
        // currentLevel 和 urlParams 已在上方定义
        
        const levelNames = { 1: '危险通道 I', 2: '危险通道 II', 3: '危险通道 III' };
        const levelSubtitles = {
            1: '基础模式 - 三格通道',
            2: '进阶模式 - 双层通道',
            3: '极限模式 - 多重通道'
        };
        
        let targetColor = 'cyan';
        let dangerColor = 'pink';
        
        // 玩家颜色（使用 GameData 统一管理）
        const ALL_COLORS = GameData.playerColors.getAllColors();

        // ==================== DOM 元素 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timerElement = document.getElementById('timer');
        const bestTimeElement = document.getElementById('best-time');

        // ==================== 游戏状态 ====================
        let gameState = 'waiting';
        let gameTime = 0;
        let gameStartTime = 0;
        let bestTime = 0;
        let invincibleTimer = 0;
        const INVINCIBLE_DURATION = 120;
        const REVIVE_PENALTY = 60;
        let penaltyTime = 0;  // 惩罚时间（秒）
        let purePlayTime = 0;  // 纯游戏时间（秒）
        let width, height;
        
        // ==================== 危险通道系统 ====================
        // 根据关卡配置不同的通道布局
        // 第一关：单通道居中（静态）
        // 第二关：双通道（静态）
        // 第三关：双滚动红线（动态，全图刷方块）
        
        const dangerZoneConfig = {
            color: '#ff4444',
            glowColor: '#ff0000'
        };
        
        // 根据关卡生成危险区域配置（第一关、第二关使用）
        function getDangerZones() {
            if (currentLevel === 1) {
                // 第一关：单通道，3格高，居中
                return [{
                    height: 3,
                    startRow: 4,
                    gapWidth: 3,
                    gapStartCol: 5,
                    offset: 1
                }];
            } else if (currentLevel === 2) {
                // 第二关：双通道
                return [
                    {
                        height: 3,
                        startRow: 2,
                        gapWidth: 3,
                        gapStartCol: 3,
                        offset: 1
                    },
                    {
                        height: 3,
                        startRow: 7,
                        gapWidth: 3,
                        gapStartCol: 7,
                        offset: -1
                    }
                ];
            } else {
                // 第三关：不使用静态通道，使用滚动红线
                return [];
            }
        }
        
        const dangerZones = getDangerZones();
        
        // ==================== 第三关：滚动墙壁系统 ====================
        // 和第二关一样的3行墙壁（带错位缺口），但是整体横向滚动
        const rollingWalls = [];
        const rollingWallConfig = {
            height: 3,           // 墙壁高度（行数）
            minSpeed: 0.75,      // 最小速度（第一波）
            maxSpeed: 1.5,       // 最大速度（最终波）
            gapWidth: 4,         // 缺口宽度（格数）- 4格宽通道
            offset: 1            // 每行缺口偏移量
        };
        
        // 获取当前波次的滚动速度
        function getRollingSpeed() {
            const waveNum = waveSys.waveNumber || 1;
            const maxWaves = config.maxWaves;
            // 从 minSpeed 线性增加到 maxSpeed
            const progress = Math.min((waveNum - 1) / (maxWaves - 1), 1);
            return rollingWallConfig.minSpeed + (rollingWallConfig.maxSpeed - rollingWallConfig.minSpeed) * progress;
        }
        
        // 初始化滚动墙壁（仅第三关）
        function initRollingLines() {
            if (currentLevel !== 3) return;
            
            rollingWalls.length = 0;
            
            // 第一组墙壁：位于上半部分（行2-4），向右滚动
            rollingWalls.push({
                startRow: 2,
                xOffset: 0,          // 当前横向偏移（像素）
                direction: 1,        // 1=向右, -1=向左
                gapStartCol: 3,      // 第一行缺口起始列
                offset: 1            // 每行缺口向右偏移
            });
            
            // 第二组墙壁：位于下半部分（行7-9），向左滚动
            rollingWalls.push({
                startRow: 7,
                xOffset: 0,
                direction: -1,
                gapStartCol: 7,
                offset: -1           // 每行缺口向左偏移
            });
        }
        
        // 更新滚动墙壁位置
        function updateRollingLines(dtScale) {
            if (currentLevel !== 3) return;
            
            const { tileSize } = gridSys;
            const totalTileSize = tileSize + config.tileGap;
            const gridWidth = config.gridSize * totalTileSize;
            const currentSpeed = getRollingSpeed();
            
            rollingWalls.forEach(wall => {
                // 移动墙壁（速度随波次增加）
                wall.xOffset += wall.direction * currentSpeed * dtScale;
                
                // 循环滚动（当偏移超过一个格子宽度时重置）
                if (wall.xOffset > totalTileSize) {
                    wall.xOffset -= totalTileSize;
                    // 缺口位置也要移动
                    wall.gapStartCol = (wall.gapStartCol + 1) % config.gridSize;
                } else if (wall.xOffset < -totalTileSize) {
                    wall.xOffset += totalTileSize;
                    wall.gapStartCol = (wall.gapStartCol - 1 + config.gridSize) % config.gridSize;
                }
            });
        }
        
        // 获取滚动墙壁某一行的缺口范围（考虑偏移）
        function getRollingGapRange(wall, rowIndex) {
            const baseCol = wall.gapStartCol + rowIndex * wall.offset;
            // 处理环绕
            const start = ((baseCol % config.gridSize) + config.gridSize) % config.gridSize;
            const end = start + rollingWallConfig.gapWidth;
            return { start, end };
        }
        
        // 绘制滚动墙壁
        function drawRollingLines() {
            if (currentLevel !== 3) return;
            
            const { gridX, gridY, tileSize, gridTotalDim } = gridSys;
            const gap = config.tileGap;
            const totalTileSize = tileSize + gap;
            
            // 保存画布状态
            ctx.save();
            
            // 设置裁剪区域，限制在网格范围内
            ctx.beginPath();
            ctx.rect(gridX, gridY, gridTotalDim, gridTotalDim);
            ctx.clip();
            
            ctx.shadowBlur = 20;
            ctx.shadowColor = dangerZoneConfig.glowColor;
            ctx.fillStyle = dangerZoneConfig.color;
            
            rollingWalls.forEach(wall => {
                // 绘制3行墙壁，每行有错位的缺口
                for (let i = 0; i < rollingWallConfig.height; i++) {
                    const row = wall.startRow + i;
                    const rowY = gridY + row * totalTileSize;
                    const gapRange = getRollingGapRange(wall, i);
                    
                    // 绘制墙壁（跳过缺口），左右各多绘制1格用于裁剪
                    for (let col = -1; col <= config.gridSize; col++) {
                        // 使用模运算处理列号，确保缺口判断正确
                        const normalizedCol = ((col % config.gridSize) + config.gridSize) % config.gridSize;
                        
                        // 检查是否在缺口范围内
                        let inGap = false;
                        if (gapRange.end <= config.gridSize) {
                            // 缺口没有环绕
                            inGap = normalizedCol >= gapRange.start && normalizedCol < gapRange.end;
                        } else {
                            // 缺口环绕到另一边
                            inGap = normalizedCol >= gapRange.start || normalizedCol < (gapRange.end % config.gridSize);
                        }
                        
                        if (!inGap) {
                            const blockX = gridX + col * totalTileSize + wall.xOffset;
                            ctx.fillRect(blockX, rowY, tileSize, tileSize);
                        }
                    }
                }
            });
            
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            
            // 恢复画布状态（移除裁剪）
            ctx.restore();
        }
        
        // 检测滚动墙壁碰撞
        function checkRollingLineCollision(p) {
            if (currentLevel !== 3) return false;
            if (p.z >= 1) return false;  // 跳跃中不检测
            
            const { gridX, gridY, tileSize } = gridSys;
            const gap = config.tileGap;
            const totalTileSize = tileSize + gap;
            
            const playerLeft = p.x;
            const playerRight = p.x + p.width;
            const playerTop = p.y;
            const playerBottom = p.y + p.height;
            
            for (const wall of rollingWalls) {
                // 检查每一行
                for (let i = 0; i < rollingWallConfig.height; i++) {
                    const row = wall.startRow + i;
                    const rowY = gridY + row * totalTileSize;
                    const rowBottom = rowY + tileSize;
                    
                    // 检查玩家是否在这一行
                    if (playerBottom > rowY && playerTop < rowBottom) {
                        const gapRange = getRollingGapRange(wall, i);
                        
                        // 检查每一列
                        for (let col = 0; col < config.gridSize; col++) {
                            // 检查是否在缺口范围内
                            let inGap = false;
                            if (gapRange.end <= config.gridSize) {
                                inGap = col >= gapRange.start && col < gapRange.end;
                            } else {
                                inGap = col >= gapRange.start || col < (gapRange.end % config.gridSize);
                            }
                            
                            if (!inGap) {
                                // 这是墙壁，检查碰撞
                                const blockX = gridX + col * totalTileSize + wall.xOffset;
                                const blockRight = blockX + tileSize;
                                
                                if (playerRight > blockX && playerLeft < blockRight) {
                                    return true;  // 碰撞！
                                }
                            }
                        }
                    }
                }
            }
            
            return false;
        }
        
        /**
         * 获取某个通道某一行的缺口范围
         * @param {object} zone - 危险区域配置
         * @param {number} rowIndex - 相对于通道起始行的索引 (0, 1, 2...)
         * @returns {object} { start: 缺口起始列, end: 缺口结束列 }
         */
        function getGapRange(zone, rowIndex) {
            const start = zone.gapStartCol + rowIndex * zone.offset;
            const end = start + zone.gapWidth;
            return { 
                start: Math.max(0, start), 
                end: Math.min(config.gridSize, end) 
            };
        }
        
        /**
         * 绘制所有危险通道（两边墙壁，中间缺口）
         */
        function drawDangerZone() {
            const { gridX, gridY, tileSize } = gridSys;
            const gap = config.tileGap;
            const totalTileSize = tileSize + gap;
            
            // 绘制发光效果
            ctx.shadowBlur = 20;
            ctx.shadowColor = dangerZoneConfig.glowColor;
            ctx.fillStyle = dangerZoneConfig.color;
            
            // 遍历所有危险区域
            dangerZones.forEach(zone => {
                // 逐行绘制，每行留出错位的缺口
                for (let i = 0; i < zone.height; i++) {
                    const row = zone.startRow + i;
                    const y = gridY + row * totalTileSize;
                    const gapRange = getGapRange(zone, i);
                    
                    // 绘制左边的墙（从第0列到缺口开始）
                    if (gapRange.start > 0) {
                        const leftWidth = gapRange.start * totalTileSize - gap;
                        ctx.fillRect(gridX, y, leftWidth, tileSize);
                    }
                    
                    // 绘制右边的墙（从缺口结束到最后一列）
                    if (gapRange.end < config.gridSize) {
                        const rightX = gridX + gapRange.end * totalTileSize;
                        const rightWidth = (config.gridSize - gapRange.end) * totalTileSize - gap;
                        ctx.fillRect(rightX, y, rightWidth, tileSize);
                    }
                }
            });
            
            // 重置阴影
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
        }
        
        /**
         * 检测玩家是否碰到任何危险区域（墙壁或滚动红线）
         */
        function checkDangerZoneCollision(p) {
            if (p.z >= 1) return false;  // 跳跃中不检测
            
            // 第三关检测滚动红线
            if (currentLevel === 3) {
                return checkRollingLineCollision(p);
            }
            
            // 第一、二关检测静态通道
            const { gridX, gridY, tileSize } = gridSys;
            const gap = config.tileGap;
            const totalTileSize = tileSize + gap;
            
            // 玩家边界
            const playerLeft = p.x;
            const playerRight = p.x + p.width;
            const playerTop = p.y;
            const playerBottom = p.y + p.height;
            
            // 检查每个危险区域
            for (const zone of dangerZones) {
                // 检查每一行的墙壁
                for (let i = 0; i < zone.height; i++) {
                    const row = zone.startRow + i;
                    const rowY = gridY + row * totalTileSize;
                    const rowBottom = rowY + tileSize;
                    
                    // 检查玩家是否在这一行的垂直范围内
                    if (playerBottom > rowY && playerTop < rowBottom) {
                        const gapRange = getGapRange(zone, i);
                        const gapLeftX = gridX + gapRange.start * totalTileSize;
                        const gapRightX = gridX + gapRange.end * totalTileSize - gap;
                        
                        // 检查玩家是否在缺口内（安全区域）
                        const inGap = playerLeft >= gapLeftX && playerRight <= gapRightX;
                        
                        // 如果不在缺口内，就是碰到墙了
                        if (!inGap) {
                            return true;
                        }
                    }
                }
            }
            
            return false;
        }

        // ==================== 波次系统 ====================
        // 可收集的颜色池
        const collectibleColors = ['cyan', 'yellow', 'purple', 'orange'];
        
        function triggerNewWave() {
            // 增加波次计数
            waveSys.triggerWave(gridSys, {
                targetColors: collectibleColors,
                dangerColors: [],
                currentTarget: targetColor,
                currentDanger: 'red',
                players: Object.values(ControllerManager.getPlayers()),
                dynamicTarget: false,
                dynamicDanger: false
            });
            
            const waveNum = waveSys.waveNumber;
            
            // ===== 三阶段波次系统 =====
            // 第一阶段（1-4波）：只刷新青色目标
            // 第二阶段（5-8波）：青色目标 + 干扰方块
            // 第三阶段（9-12波）：随机目标颜色 + 干扰方块
            
            const phase = waveNum <= 4 ? 1 : (waveNum <= 8 ? 2 : 3);
            
            // 第三阶段：随机切换目标颜色
            if (phase === 3) {
                targetColor = collectibleColors[Math.floor(Math.random() * collectibleColors.length)];
            } else {
                targetColor = 'cyan';
            }
            
            dangerColor = 'red';  // 红线颜色标识
            updateTargetColorUI();
            
            // 重新放置方块
            gridSys.clearAll();
            const allPlayers = ControllerManager.getPlayers();
            const occupied = gridSys.getOccupiedTiles(Object.values(allPlayers));
            const availableTiles = gridSys.getAvailableTiles(occupied);
            
            // 第三关：全图都可以刷方块
            // 第一、二关：过滤掉危险区域的墙壁格子，但保留缺口处的格子
            let safeTiles;
            if (currentLevel === 3) {
                // 第三关全图刷方块
                safeTiles = availableTiles;
            } else {
                safeTiles = availableTiles.filter(tile => {
                    // 检查每个危险区域
                    for (const zone of dangerZones) {
                        if (tile.row >= zone.startRow && tile.row < zone.startRow + zone.height) {
                            // 在危险区域的行内，检查是否在缺口中
                            const rowIndex = tile.row - zone.startRow;
                            const gapRange = getGapRange(zone, rowIndex);
                            // 如果在缺口内，是安全的
                            if (tile.col >= gapRange.start && tile.col < gapRange.end) {
                                return true;
                            }
                            return false;
                        }
                    }
                    return true;
                });
            }
            
            console.log(`[Wave] 关卡${currentLevel} 可用格子: ${availableTiles.length}, 安全格子: ${safeTiles.length}`);
            
            const shuffled = GameUtils.shuffle([...safeTiles]);
            const { targetCount } = waveSys.getWaveConfig();
            
            let idx = 0;
            let actualTarget = 0;
            
            if (phase >= 2) {
                // 阶段2、3：所有颜色均匀分布，每种颜色4个
                const perColorCount = 4;  // 每种颜色固定4个
                
                // 打乱颜色顺序，增加随机性
                const shuffledColors = GameUtils.shuffle([...collectibleColors]);
                
                shuffledColors.forEach(color => {
                    for (let i = 0; i < perColorCount && idx < shuffled.length; i++, idx++) {
                        shuffled[idx].type = color;
                        shuffled[idx].pulse = 0;
                        if (color === targetColor) actualTarget++;
                    }
                });
            } else {
                // 阶段1：只放目标颜色（青色），固定4个
                actualTarget = Math.min(4, shuffled.length);
                for (let i = 0; i < actualTarget && idx < shuffled.length; i++, idx++) {
                    shuffled[idx].type = targetColor;
                    shuffled[idx].pulse = 0;
                }
            }
            
            // 日志
            const phaseNames = { 1: '基础', 2: '均衡混淆', 3: '变色混淆' };
            const totalBlocks = idx;
            console.log(`[Wave ${waveNum}] 阶段${phase}(${phaseNames[phase]}) 目标: ${targetColor}, 目标数: ${actualTarget}, 总数: ${totalBlocks}`);
            debugLog.logWave(waveNum, actualTarget, 0);
            debugLog.add(`<span style="color: #facc15;">阶段 ${phase}: ${phaseNames[phase]}模式</span>`);
            
            invincibleTimer = INVINCIBLE_DURATION;
        }

        /**

         */
        function checkMenuInput() {
            const input = ControllerManager.getInput(1);
            if (!input) return;
            
            const deadzone = 0.3;
            
            // 检查是否有任何输入（摇杆或按钮）
            const hasAnyInput = Math.abs(input.joystick.x) > deadzone || 
                               Math.abs(input.joystick.y) > deadzone ||
                               input.buttons.N || input.buttons.S || 
                               input.buttons.E || input.buttons.W;
            
            // 如果菜单被锁定，等待所有按键松开才解锁
            if (menuInputLocked) {
                if (!hasAnyInput) {
                    menuInputLocked = false;
                    menuInputThrottle = false;
                    prevMenuInput = { joystick: { x: 0, y: 0 }, buttons: { N: false, S: false, E: false, W: false } };
                }
                return;
            }
            
            // 检测摇杆移动（有死区的方向变化）
            const newUp = input.joystick.y < -deadzone;
            const newDown = input.joystick.y > deadzone;
            const oldUp = prevMenuInput.joystick.y < -deadzone;
            const oldDown = prevMenuInput.joystick.y > deadzone;
            
            if (!menuInputThrottle) {
                if (newUp && !oldUp) {
                    menuSystem.moveUp();
                    menuInputThrottle = true;
                    setTimeout(() => menuInputThrottle = false, 150);
                }
                if (newDown && !oldDown) {
                    menuSystem.moveDown();
                    menuInputThrottle = true;
                    setTimeout(() => menuInputThrottle = false, 150);
                }
            }
            
            // 确认按钮 (只有西键 = 确认，避免跳跃键误触)
            const confirmPressed = (input.buttons.W && !prevMenuInput.buttons.W);
            if (confirmPressed) {
                menuSystem.confirm();
            }
            
            // 保存当前状态
            prevMenuInput = {
                joystick: { ...input.joystick },
                buttons: { ...input.buttons }
            };
        }

        // ==================== 游戏更新 ====================
        function update(fixedDt) {
            // 暂停检测（手柄 Start 按钮）
            PauseMenu.pollGamepadStart();
            if (PauseMenu.isPaused()) return;
            
            if (gameState !== 'playing') return;
            const dtScale = fixedDt * 60;
            
            // 第三关：更新滚动红线
            updateRollingLines(dtScale);

            if (gameStartTime > 0) {
                purePlayTime = (Date.now() - gameStartTime) / 1000;
                gameTime = purePlayTime + penaltyTime;
                timerElement.textContent = GameUtils.formatTime(gameTime);
                document.getElementById('play-time').textContent = GameUtils.formatTime(purePlayTime);
                document.getElementById('penalty-time-display').textContent = penaltyTime > 0 ? `+${penaltyTime}s` : '+0s';
            }

            const deadzone = 0.3;
            const players = ControllerManager.getPlayers();

            // 遍历所有活跃玩家
            Object.values(players).forEach(p => {
                const input = ControllerManager.getInput(p.id);
                const { speedMult } = handlePlayerInput(p, input, {
                    onJump: () => SoundManager.playJump(),
                    onDash: () => SoundManager.playDash()
                }, {
                    enablePreciseMovement: true,
                    preciseSpeedMultiplier: DEFAULT_CONFIG.preciseSpeedMultiplier
                });
                const { gridX, gridY, gridTotalDim } = gridSys;
                updatePlayerMovement(p, {
                    speedMult,
                    dtScale,
                    bounds: { minX: gridX, maxX: gridX + gridTotalDim - p.width, minY: gridY, maxY: gridY + gridTotalDim - p.height },
                    onLand: () => SoundManager.playLand()
                });
            });

            if (invincibleTimer > 0) invincibleTimer = Math.max(0, invincibleTimer - dtScale);
            
            // 碰撞检测 - 遍历所有玩家
            Object.values(players).forEach(p => {
                // 检测危险区域碰撞
                if (invincibleTimer <= 0 && checkDangerZoneCollision(p)) {
                    gameOver();
                    return;
                }
                // 检测方块碰撞（收集得分方块）
                checkPlayerCollision(p);
            });

            gridSys.grid.forEach(t => t.pulse += 0.05 * dtScale);
            updateDebugInfo();
            checkAndRefresh();
        }
        
        function checkPlayerCollision(p) {
            if (p.z >= 1) return;  // 跳跃中不检测方块碰撞
            
            const { gridX, gridY, tileSize } = gridSys;
            const cx = p.x + p.width/2;
            const cy = p.y + p.height/2;
            const col = Math.floor((cx - gridX) / (tileSize + config.tileGap));
            const row = Math.floor((cy - gridY) / (tileSize + config.tileGap));

            if (row >= 0 && row < config.gridSize && col >= 0 && col < config.gridSize) {
                const tile = gridSys.grid.find(t => t.row === row && t.col === col);
                if (tile && tile.type !== 'none') {
                    const pos = gridSys.getTilePosition(row, col);
                    
                    if (tile.type === targetColor) {
                        // 正确颜色：得分
                        tile.type = 'none';
                        floatingText.show('+1', config.colorHex[targetColor], pos.centerX, pos.y);
                        SoundManager.playScore();
                    } else if (collectibleColors.includes(tile.type)) {
                        // 干扰颜色：惩罚5秒
                        tile.type = 'none';
                        penaltyTime += config.wrongColorPenalty;
                        floatingText.show(`+${config.wrongColorPenalty}秒`, '#ff6b6b', pos.centerX, pos.y);
                        SoundManager.playError();
                        ControllerManager.vibrateLight();  // 手柄震动反馈
                    }
                }
            }
        }
            
        // ==================== 绘制 ====================
        function draw(alpha = 1) {
            // 重置 canvas 状态，防止残留效果
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            
            ctx.fillStyle = config.colors.bg;
            ctx.fillRect(0, 0, width, height);

            const { gridX, gridY, gridTotalDim, tileSize } = gridSys;

            // 网格线
            gridSys.drawGridLines(ctx);

            // 方块
            gridSys.drawTiles(ctx, (tile) => {
                // 所有颜色都从统一的 colorHex 获取
                const color = config.colorHex[tile.type] || config.colors.cyan;
                // 目标色高亮
                return { 
                    color, 
                    isHighlight: tile.type === targetColor,
                    isDanger: false  // 红线模式没有危险方块
                };
            });
            
            // 绘制危险区域
            if (currentLevel === 3) {
                // 第三关：绘制滚动红线
                drawRollingLines();
            } else {
                // 第一、二关：绘制静态通道
                drawDangerZone();
            }

            // 绘制玩家 - 遍历所有玩家
            const players = ControllerManager.getPlayers();
            Object.values(players).forEach(p => {
                drawPlayer(p, alpha);
            });

            // 浮动文字
            floatingText.draw(ctx);
            floatingText.update();
            
            // 菜单状态下检查输入
            if (gameState === 'gameover' || gameState === 'victory') {
                checkMenuInput();
            }
            
        }
        
        function drawPlayer(p, alpha = 1) {
            drawPlayerSprite(ctx, p, {
                alpha,
                invincible: invincibleTimer > 0,
                invinciblePulseMs: 50,
                shadowFill: 'rgba(0,0,0,0.6)',
                glowBlurBase: 15,
                glowBlurJumpDivisor: 5
            });
        }

        // ==================== 游戏结束/胜利 ====================
        function gameOver() {
            gameState = 'gameover';
            ControllerManager.vibrateStrong();  // 死亡时强烈震动
            
            const finalTime = Math.floor(gameTime);
            const finalPlayTime = Math.floor(purePlayTime);
            const finalPenalty = Math.floor(penaltyTime);
            
            gameScreens.showGameOver({
                totalTime: finalTime,
                playTime: finalPlayTime,
                penaltyTime: finalPenalty,
                bestTime: bestTime
            });
            
            ControlHint.hide();
            resetMenuInputState();
        }
        
        function victory() {
            gameState = 'victory';
            const finalTime = Math.floor(gameTime);
            const finalPlayTime = Math.floor(purePlayTime);
            const finalPenalty = Math.floor(penaltyTime);
            
            if (bestTime === 0 || finalTime < bestTime) {
                bestTime = finalTime;
                GameData.records.setBestTime('eatAndAvoid', bestTime);
            }
            
            bestTimeElement.textContent = GameUtils.formatBestTime(bestTime);
            
            gameScreens.showVictory({
                totalTime: finalTime,
                playTime: finalPlayTime,
                penaltyTime: finalPenalty,
                bestTime: bestTime
            });
            
            ControlHint.hide();
            debugLog.add(`<span style="color: #ffd700;">🎉 通关！游戏: ${GameUtils.formatTime(finalPlayTime)} + 惩罚: ${finalPenalty}s = 总计: ${GameUtils.formatTime(finalTime)}</span>`);
            resetMenuInputState();
        }
        
        function resetPlayerPosition(p, playerId) {
            p.trail = [];
            // 玩家刷新在地图底部
            const { gridX, gridY, gridTotalDim, tileSize } = gridSys;
            const gap = config.tileGap;
            const totalTileSize = tileSize + gap;
            
            // 根据玩家ID设置不同的水平位置（底部一排横向排列）
            const id = playerId || p.id || 1;
            const bottomY = gridY + gridTotalDim - p.height - totalTileSize * 0.5;  // 底部倒数第一行
            const centerX = gridX + gridTotalDim / 2;
            const spacing = tileSize * 1.5;
            
            // 玩家横向排列：P1在中偏左，P2在中偏右，P3更左，P4更右
            const xOffsets = [-0.5, 0.5, -1.5, 1.5];
            p.x = centerX - p.width / 2 + xOffsets[(id - 1) % 4] * spacing;
            p.y = bottomY;
            p.prevX = p.x;
            p.prevY = p.y;
            p.z = 0;
            p.prevZ = 0;
            p.vz = 0;
        }
        
        function resetGame() {
            gameState = 'waiting';  // 重置游戏状态
            gameTime = 0;
            gameStartTime = 0;
            penaltyTime = 0;
            purePlayTime = 0;
            timerElement.textContent = '00:00';
            document.getElementById('play-time').textContent = '00:00';
            document.getElementById('penalty-time-display').textContent = '+0s';
            
            waveSys.reset();
            gridSys.clearAll();
            
            // 第三关：初始化滚动红线
            initRollingLines();
            
            // 重置所有玩家
            ControllerManager.resetAllPlayers(p => {
                resetPlayerPosition(p);
                p.isJumping = false;
                p.dashTimer = 0;
                p.dashCooldown = 0;
                p.ghostMarker = null;
            });
        }
        
        // ==================== 调试面板初始化（由 DebugPanel 模块处理）====================
        DebugPanel.init({
            onVictoryTest: () => {
                if (gameState === 'playing' || gameState === 'waiting') {
                    if (gameState === 'waiting') startGame();
                    victory();
                }
            }
        });
        
        // ==================== 初始化 ====================
        window.addEventListener('resize', resize);
        gridSys.initGrid();
        initLevelUI();
        
        // 初始化游戏结束屏幕（使用抽象层，支持复用）
        gameScreens = GameUtils.createGameScreens({
            gameType: 'dangerousPassage',
            currentLevel: currentLevel,
            maxLevel: 3,
            onRestart: () => {
                gameScreens.hide();
                resetGame();
                // 重新播放BGM并开始游戏
                SoundManager.playDangerousBGM();
                startGame();
            },
            onRevive: () => {
                gameScreens.hide();
                gameState = 'playing';
                penaltyTime += REVIVE_PENALTY;
                floatingText.show(`+${REVIVE_PENALTY}秒复活惩罚`, '#ff6b6b', width/2, height/2 - 50);
                // 重新播放BGM
                SoundManager.playDangerousBGM();
                ControllerManager.resetAllPlayers(p => {
                    resetPlayerPosition(p);
                    p.isJumping = false;
                    p.dashTimer = 0;
                    p.dashCooldown = 0;
                    p.ghostMarker = null;
                });
                invincibleTimer = INVINCIBLE_DURATION;
            },
            onNextLevel: currentLevel < 3 ? () => {
                window.location.href = `gameDangerousPassage.html?level=${currentLevel + 1}`;
            } : null,  // 危险通道第3关是最终关，无下一关
            onBackToMenu: () => {
                window.location.href = 'index.html';
            }
        });
        gameScreens.bindMenuSystem(menuSystem);
        
        // 初始化暂停菜单
        PauseMenu.init({
            canPause: () => gameState === 'playing',
            onPause: () => {
                console.log('[Game] 游戏暂停');
            },
            onResume: () => {
                console.log('[Game] 游戏恢复');
            },
            onRestart: () => {
                resetGame();
                startGame();
            },
            onBackToMenu: () => {
                window.location.href = 'index.html';
            }
        });
        
        // ControllerManager 初始化延迟到 WebSocket 连接成功后
        // 这样可以先加载配置，再根据配置创建玩家，避免先创建再删除
        let controllerInitialized = false;
        
        function initControllerAfterConfig() {
            if (controllerInitialized) return;
            controllerInitialized = true;
            
            const keyboardEnabled = GameData.gameSettings.getKeyboardEnabled();
            console.log('[Game] 配置加载完成，键盘控制:', keyboardEnabled ? '启用' : '禁用');
            
            ControllerManager.init({
                onPlayerCreate: createGamePlayer,
                onPlayerRemove: removeGamePlayer,
                onUpdate: () => {
                    updateControllerUI();
                    if (gameState === 'waiting' && ControllerManager.hasAnyInput()) {
                        startGame();
                    }
                },
                onReassign: (webControllerMapping) => {
                    // 键盘开关后重新分配了 playerId，通知所有 Web 控制器更新显示
                    console.log('[Game] 设备重新分配，通知 Web 控制器更新 playerId:', webControllerMapping);
                    const ws = GameData._ws;
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        Object.entries(webControllerMapping).forEach(([controllerId, playerId]) => {
                            ws.send(JSON.stringify({
                                type: 'update_player_id',
                                controller_id: parseInt(controllerId),
                                player_id: playerId
                            }));
                        });
                    }
                    updateControllerUI();
                },
                enableKeyboard: keyboardEnabled
            });
            
            loadPlayerColors();
            updateControllerUI();
        }
        
        resize();
        resetGame();
        initFrameScheduler();
        
        // ==================== 音频（使用 SoundManager 统一管理）====================
        SoundManager.preload();
        
        // 全局按钮点击音效
        document.addEventListener('click', (e) => {
            const target = e.target.closest('button, .btn-cyber, .menu-btn');
            if (target) {
                SoundManager.playClick();
            }
        });
        
        // 加载保存的音量设置
        (function applyVolumeSettings() {
            const volumes = GameData.gameSettings.getVolume();
            SoundManager.setMasterVolume(volumes.master);
            SoundManager.setBGMVolume(volumes.bgm);
            SoundManager.setSFXVolume(volumes.sfx);
        })();
        
        // BGM 已在加载动画 onComplete 中播放
        // 页面卸载通知已由 GameWebSocket.setupUnloadHandler() 处理
    </script>
</body>
</html>
