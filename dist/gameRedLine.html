<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方寸枢机 - 红线危机</title>
    <script src="libs/tailwind.js"></script>
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-pink: #ff00ff;
            --bg-dark: #050505;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'JetBrains Mono', monospace;
            touch-action: none;
        }

        /* Scanlines Effect */
        body::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 3px 100%;
            z-index: 10;
            pointer-events: none;
        }

        canvas { display: block; }

        #ui-overlay {
            position: absolute;
            top: 30px;
            left: 30px;
            color: var(--neon-cyan);
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 10px var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            transform-origin: top left;
            transition: transform 0.2s ease;
        }

        .cyber-border {
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 10px var(--neon-cyan);
            background: rgba(0, 0, 0, 0.8);
        }

        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 30px 40px;
            border-radius: 4px;
            text-align: center;
            display: none;
            z-index: 100;
            font-family: 'Orbitron', sans-serif;
            min-width: 400px;
        }

        .neon-text-pink { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink); }
        .neon-text-cyan { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }

        @keyframes flicker {
            0% { opacity: 0.9; } 5% { opacity: 0.5; } 10% { opacity: 0.9; } 100% { opacity: 1; }
        }
        .flicker { animation: flicker 3s infinite step-end; }

        .btn-cyber {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px 40px;
            font-size: 1.1rem;
            min-width: 200px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
        }

        .btn-cyber:hover, .btn-cyber.selected {
            background: var(--neon-cyan);
            color: #000 !important;
            box-shadow: 0 0 30px var(--neon-cyan);
        }

        /* 调试日志面板 */
        .debug-log {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 280px;
            max-height: 200px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #888;
            overflow-y: auto;
            z-index: 50;
        }
        .debug-log-title { color: #00ff00; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .debug-log-item { padding: 3px 0; border-bottom: 1px solid #222; }
        .debug-log-item:last-child { border-bottom: none; }
        .log-wave { color: #00f2ff; }
        .log-cyan { color: #00f2ff; }
        .log-pink { color: #ff00ff; }

        /* 菜单操作提示样式 */
        .menu-control-hints {
            margin-top: 24px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
        .hint-item { display: flex; align-items: center; gap: 4px; }
        .hint-key {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #fff;
            min-width: 20px;
            text-align: center;
        }
        .hint-sep { color: rgba(255, 255, 255, 0.3); }
        .hint-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-family: 'Zhi Mang Xing', cursive;
            font-size: 14px;
            color: #fff;
        }
        .hint-btn-west {
            border: 2px solid #3b82f6;
            background: rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.02); }
        }
    </style>
    <!-- 引入模块 -->
    <script src="js/controlHint.js"></script>
    <script src="js/gameData.js"></script>
    <script src="js/gridSystem.js"></script>
    <script src="js/waveSystem.js"></script>
    <script src="js/gameUtils.js"></script>
    <script src="js/player.js"></script>
    <script src="js/controllerManager.js"></script>
</head>
<body>

    <div id="ui-overlay" class="flicker">
        <div class="text-3xl font-black mb-2 tracking-widest">用时: <span id="timer">00:00</span></div>
        <div class="text-sm opacity-70">最快记录: <span id="best-time">--:--</span></div>
        <div class="mt-2 text-xs" style="opacity: 0.8;">
            <span style="color: #4ade80;">游戏: <span id="play-time">00:00</span></span>
            <span class="ml-3" style="color: #ff6b6b;">惩罚: <span id="penalty-time-display">+0s</span></span>
        </div>
        
        <!-- 关卡标题 -->
        <div id="level-title" class="mb-2" style="font-size: 14px; opacity: 0.6; letter-spacing: 2px;"></div>
        
        <!-- 颜色指示器容器 -->
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <!-- 目标颜色指示器 -->
            <div id="target-color-box" class="mt-2" style="background: rgba(0,0,0,0.8); border: 3px solid #00f2ff; border-radius: 10px; padding: 12px 16px; display: inline-block;">
                <div style="font-size: 10px; opacity: 0.7; margin-bottom: 5px;">收集目标</div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div id="target-color-indicator" style="width: 35px; height: 35px; border-radius: 6px; background: #00f2ff; box-shadow: 0 0 15px #00f2ff;"></div>
                <div>
                        <div id="target-color-name" style="font-size: 16px; font-weight: bold;">青色</div>
                        <div id="target-color-count" style="font-size: 10px; opacity: 0.7;">剩余: 0</div>
                </div>
            </div>
        </div>
        
            <!-- 危险颜色指示器（第三关显示） -->
            <div id="danger-color-box" class="mt-2" style="background: rgba(0,0,0,0.8); border: 3px solid #ff00ff; border-radius: 10px; padding: 12px 16px; display: none;">
                <div style="font-size: 10px; opacity: 0.7; margin-bottom: 5px;">⚠ 危险障碍</div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div id="danger-color-indicator" style="width: 35px; height: 35px; border-radius: 6px; background: #ff4444; box-shadow: 0 0 15px #ff0000;"></div>
                    <div>
                        <div id="danger-color-name" style="font-size: 16px; font-weight: bold; color: #ff4444;">红线</div>
                        <div id="danger-desc" style="font-size: 10px; opacity: 0.7;">闪避移动</div>
        </div>
                </div>
            </div>
        </div>
        
        <div class="mt-4 text-[10px] tracking-widest opacity-60">[WASD] 移动 | [J] 跳跃 | [K] 冲刺 | [I] 静步</div>
        <div class="mt-1 text-[10px] tracking-widest opacity-70" style="display: flex; align-items: center; gap: 6px;">
            <span>[摇杆] 移动</span>
            <span style="color: rgba(255,255,255,0.4);">|</span>
            <span style="display: inline-flex; align-items: center; gap: 2px;"><span style="width: 16px; height: 16px; border: 1.5px solid #4ade80; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: 'Zhi Mang Xing', cursive; font-size: 11px; color: #4ade80;">南</span> 跳跃</span>
            <span style="color: rgba(255,255,255,0.4);">|</span>
            <span style="display: inline-flex; align-items: center; gap: 2px;"><span style="width: 16px; height: 16px; border: 1.5px solid #f87171; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: 'Zhi Mang Xing', cursive; font-size: 11px; color: #f87171;">东</span> 冲刺</span>
            <span style="color: rgba(255,255,255,0.4);">|</span>
            <span style="display: inline-flex; align-items: center; gap: 2px;"><span style="width: 16px; height: 16px; border: 1.5px solid #facc15; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: 'Zhi Mang Xing', cursive; font-size: 11px; color: #facc15;">北</span> 静步</span>
        </div>
        <div id="controller-status" class="mt-4 text-xs tracking-widest">
            <span id="p1-status" class="opacity-30">● P1</span>
            <span id="p2-status" class="ml-3 opacity-30">● P2</span>
            <span id="p3-status" class="ml-3 opacity-30">● P3</span>
            <span id="p4-status" class="ml-3 opacity-30">● P4</span>
        </div>
        <!-- 调试信息 -->
        <div id="debug-info" class="mt-4 text-xs tracking-widest" style="font-family: 'JetBrains Mono', monospace;">
            <div>波次: <span id="wave-num" class="neon-text-cyan">0</span></div>
            <div class="mt-1" id="color-counts">
                <!-- 动态生成颜色计数 -->
            </div>
        </div>
    </div>
    
    <!-- 开始蒙版由 JS 动态生成 -->

    <!-- Game Over / Victory 界面由 JS 动态生成 -->

    <!-- 调试日志面板 -->
    <div class="debug-log" id="debugLog">
        <div class="debug-log-title">
            [DEBUG LOG]
            <button id="victory-test-btn" style="margin-left: 10px; padding: 2px 8px; font-size: 10px; background: #333; border: 1px solid #ffd700; color: #ffd700; cursor: pointer;">快速通关</button>
        </div>
        <div id="logContent"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // ==================== 游戏配置 ====================
        const config = {
            gridSize: 12,
            tileGap: 6,
            playerSizeRatio: 0.5,
            moveSpeed: 5,
            dashMultiplier: 3.5,
            dashDuration: 8,
            dashCooldown: 30,
            jumpPower: 14,
            gravity: 1.0,
            trailLength: 6,
            maxWaves: 12,
            initialCyan: 12,
            cyanDecrement: 1,
            minCyan: 6,
            initialPink: 5,
            pinkIncrement: 2,
            maxPink: 25,
            colors: { bg: '#050505', grid: '#1a1a1a', cyan: '#00f2ff', pink: '#ff00ff' },
            collectibleColors: ['cyan', 'yellow', 'purple', 'orange'],
            colorHex: { cyan: '#00f2ff', yellow: '#facc15', purple: '#a855f7', orange: '#fb923c', pink: '#ff00ff', red: '#ff4444', gray: '#888888' },
            colorNames: { cyan: '青色', yellow: '黄色', purple: '紫色', orange: '橙色', pink: '粉色', red: '红色', gray: '灰色' },
            wrongColorPenalty: 5,
            dangerColors: ['pink', 'red', 'gray'],
            dangerColorHex: { pink: '#ff00ff', red: '#ff4444', gray: '#888888' },
            dangerColorNames: { pink: '粉色', red: '红色', gray: '灰色' },
            // 第三关：所有颜色统一池，可以互换
            allColors: ['cyan', 'yellow', 'purple', 'orange', 'pink', 'red', 'gray']
        };
        
        // ==================== 关卡配置 ====================
        const urlParams = new URLSearchParams(window.location.search);
        const levelMode = parseInt(urlParams.get('level')) || 1;
        
        const levelNames = { 1: '红线追击 I', 2: '红线追击 II', 3: '红线追击 III' };
        const levelSubtitles = {
            1: '基础模式 - 单向红线',
            2: '进阶模式 - 双向红线',
            3: '极限模式 - 十字红线'
        };
        
        let targetColor = 'cyan';
        let dangerColor = 'pink';
        
        // 玩家颜色（使用 GameData 统一管理）
        const ALL_COLORS = GameData.playerColors.getAllColors();

        // ==================== DOM 元素 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timerElement = document.getElementById('timer');
        const bestTimeElement = document.getElementById('best-time');

        // ==================== 游戏状态 ====================
        let gameState = 'waiting';
        let gameTime = 0;
        let gameStartTime = 0;
        let bestTime = 0;
        let invincibleTimer = 0;
        const INVINCIBLE_DURATION = 120;
        const REVIVE_PENALTY = 60;
        let penaltyTime = 0;  // 惩罚时间（秒）
        let purePlayTime = 0;  // 纯游戏时间（秒）
        let width, height;
        
        // ==================== 红线系统 ====================
        const redLineConfig = {
            color: '#ff4444',
            glowColor: '#ff0000',
            baseSpeed: 1 / 60,  // 基础速度：每帧移动的格子数，约1秒1格（60fps）
            maxSpeedMult: 3,    // 最终速度倍率：第12波时达到3倍速
            warningTime: 60     // 红线出现前的警告时间（帧）
        };
        
        // 红线对象数组（支持多条红线）
        let redLines = [];
        
        /**
         * 创建一条红线
         * @param {string} direction - 移动方向: 'down', 'up', 'left', 'right'
         * @param {number} startPos - 起始位置（行号或列号）
         */
        function createRedLine(direction, startPos = 0) {
            const line = {
                direction: direction,
                position: startPos,  // 当前位置（小数，表示行/列）
                isHorizontal: direction === 'left' || direction === 'right',
                warning: redLineConfig.warningTime,  // 警告倒计时
                active: false  // 是否激活（警告结束后激活）
            };
            
            // 根据方向设置起始位置
            if (direction === 'down') line.position = -1;
            else if (direction === 'up') line.position = config.gridSize;
            else if (direction === 'right') line.position = -1;
            else if (direction === 'left') line.position = config.gridSize;
            
            return line;
        }
        
        /**
         * 初始化红线（根据关卡模式）
         */
        function initRedLines() {
            redLines = [];
            
            if (levelMode === 1) {
                // 第一关：单条从上往下的红线
                redLines.push(createRedLine('down'));
            } else if (levelMode === 2) {
                // 第二关：两条红线，一条从上往下，一条从下往上
                redLines.push(createRedLine('down'));
                redLines.push(createRedLine('up'));
            } else {
                // 第三关：十字红线，水平和垂直各一条
                redLines.push(createRedLine('down'));
                redLines.push(createRedLine('right'));
            }
        }
        
        /**
         * 更新红线位置
         */
        function updateRedLines() {
            redLines.forEach(line => {
                // 警告阶段
                if (line.warning > 0) {
                    line.warning--;
                    if (line.warning <= 0) {
                        line.active = true;
                    }
                    return;
                }
                
                // 移动红线（速度随波次增加，第1波1倍速，第12波2倍速）
                const waveProgress = (waveSys.waveNumber - 1) / (config.maxWaves - 1);  // 0 ~ 1
                const speedMult = 1 + waveProgress * (redLineConfig.maxSpeedMult - 1);   // 1 ~ 2
                const speed = redLineConfig.baseSpeed * speedMult;
                
                switch (line.direction) {
                    case 'down':
                        line.position += speed;
                        if (line.position >= config.gridSize) {
                            line.position = -1;
                            line.warning = redLineConfig.warningTime;
                            line.active = false;
                        }
                        break;
                    case 'up':
                        line.position -= speed;
                        if (line.position < -1) {
                            line.position = config.gridSize;
                            line.warning = redLineConfig.warningTime;
                            line.active = false;
                        }
                        break;
                    case 'right':
                        line.position += speed;
                        if (line.position >= config.gridSize) {
                            line.position = -1;
                            line.warning = redLineConfig.warningTime;
                            line.active = false;
                        }
                        break;
                    case 'left':
                        line.position -= speed;
                        if (line.position < -1) {
                            line.position = config.gridSize;
                            line.warning = redLineConfig.warningTime;
                            line.active = false;
                        }
                        break;
                }
            });
        }
        
        /**
         * 绘制红线
         */
        function drawRedLines() {
            const { gridX, gridY, tileSize } = gridSys;
            const gap = config.tileGap;
            const totalTileSize = tileSize + gap;
            
            // 确保开始绘制前重置所有状态
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            
            redLines.forEach(line => {
                // 计算红线位置
                const pos = Math.floor(line.position);
                const fraction = line.position - pos;
                
                if (line.isHorizontal) {
                    // 水平红线（整行）
                    const x = gridX + pos * totalTileSize + fraction * totalTileSize;
                    
                    if (line.active) {
                        // 绘制激活的红线
                        ctx.fillStyle = redLineConfig.color;
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = redLineConfig.glowColor;
                        ctx.fillRect(x, gridY, tileSize, config.gridSize * totalTileSize - gap);
                        ctx.shadowBlur = 0;
                        ctx.shadowColor = 'transparent';
                    } else if (line.warning > 0) {
                        // 绘制警告效果
                        const alpha = 0.3 + Math.sin(Date.now() / 100) * 0.2;
                        ctx.fillStyle = `rgba(255, 68, 68, ${alpha})`;
                        // 警告线显示在即将出现的位置
                        const warnX = line.direction === 'right' ? gridX : gridX + (config.gridSize - 1) * totalTileSize;
                        ctx.fillRect(warnX, gridY, tileSize, config.gridSize * totalTileSize - gap);
                    }
                } else {
                    // 垂直红线（整列变成整行显示）
                    const y = gridY + pos * totalTileSize + fraction * totalTileSize;
                    
                    if (line.active) {
                        ctx.fillStyle = redLineConfig.color;
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = redLineConfig.glowColor;
                        ctx.fillRect(gridX, y, config.gridSize * totalTileSize - gap, tileSize);
                        ctx.shadowBlur = 0;
                        ctx.shadowColor = 'transparent';
                    } else if (line.warning > 0) {
                        const alpha = 0.3 + Math.sin(Date.now() / 100) * 0.2;
                        ctx.fillStyle = `rgba(255, 68, 68, ${alpha})`;
                        const warnY = line.direction === 'down' ? gridY : gridY + (config.gridSize - 1) * totalTileSize;
                        ctx.fillRect(gridX, warnY, config.gridSize * totalTileSize - gap, tileSize);
                    }
                }
            });
            
            // 确保绘制完成后重置状态
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
        }
        
        /**
         * 检测玩家是否碰到红线
         */
        function checkRedLineCollision(p) {
            if (p.z >= 1) return false;  // 跳跃中不检测
            
            const { gridX, gridY, tileSize } = gridSys;
            const gap = config.tileGap;
            const totalTileSize = tileSize + gap;
            
            // 玩家的边界框
            const playerLeft = p.x;
            const playerRight = p.x + p.width;
            const playerTop = p.y;
            const playerBottom = p.y + p.height;
            
            for (const line of redLines) {
                if (!line.active) continue;
                
                // 计算红线的实际像素位置（与绘制逻辑一致）
                const pos = Math.floor(line.position);
                const fraction = line.position - pos;
                
                if (line.isHorizontal) {
                    // 垂直移动的红线（显示为一列）
                    const lineX = gridX + pos * totalTileSize + fraction * totalTileSize;
                    const lineLeft = lineX;
                    const lineRight = lineX + tileSize;
                    
                    // 检测水平方向重叠
                    if (playerRight > lineLeft && playerLeft < lineRight) {
                        return true;
                    }
                } else {
                    // 水平移动的红线（显示为一行）
                    const lineY = gridY + pos * totalTileSize + fraction * totalTileSize;
                    const lineTop = lineY;
                    const lineBottom = lineY + tileSize;
                    
                    // 检测垂直方向重叠
                    if (playerBottom > lineTop && playerTop < lineBottom) {
                        return true;
                    }
                }
            }
            
            return false;
        }
        
        // ==================== 初始化模块 ====================
        const gridSys = GridSystem.create({ gridSize: config.gridSize, tileGap: config.tileGap, colors: config.colors });
        const waveSys = WaveSystem.create({
            maxWaves: config.maxWaves,
            initialTarget: config.initialCyan,
            targetDecrement: config.cyanDecrement,
            minTarget: config.minCyan,
            initialDanger: config.initialPink,
            dangerIncrement: config.pinkIncrement,
            maxDanger: config.maxPink
        });
        const floatingText = GameUtils.createFloatingTextSystem();
        const menuSystem = GameUtils.createMenuSystem();
        const debugLog = GameUtils.createDebugLog('logContent', 20);
        
        // 游戏界面（使用抽象层）
        let startOverlay = null;  // 开始蒙版
        let gameScreens = null;   // 游戏结束屏幕
        
        // 基准 tileSize（用于速度缩放）
        const BASE_TILE_SIZE = 70;
        let scaledMoveSpeed = config.moveSpeed;
        
        // ==================== 玩家对象 ====================
        // 通过 ControllerManager 管理玩家，游戏只需关心玩家对象本身
        const GAME_PLAYER_COLORS = [ALL_COLORS[0], ALL_COLORS[1], ALL_COLORS[2], ALL_COLORS[3]];
        const SPAWN_OFFSETS = [
            { x: -1, y: 0 },   // P1 左侧

        // ==================== 远程控制器 (WebSocket) ====================
        let wsConnected = false;
        let serverInfo = { ip: null, port: 8088 };
        // 记录上一帧的按钮状态，用于检测按下事件
        let prevButtonStates = {};

        function initWebSocket() {
            const wsUrl = 'ws://localhost:8088/ws/game';
            console.log('连接游戏服务器:', wsUrl);
            const ws = new WebSocket(wsUrl);
            
            ws.onopen = () => { console.log('游戏已连接到服务器!'); wsConnected = true; };
            ws.onclose = () => { 
                console.log('与服务器断开连接'); 
                wsConnected = false;
                // 断开时清理所有手柄
                Object.keys(ControllerManager.controllers).forEach(id => {
                    ControllerManager.onControllerDisconnected(parseInt(id));
                });
                setTimeout(initWebSocket, 3000); 
            };
            ws.onerror = (error) => { console.error('WebSocket 错误:', error); };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    const controllerId = data.controller_id;
                    
                    if (data.type === 'connected') {
                        if (data.server_ip) { serverInfo.ip = data.server_ip; serverInfo.port = data.server_port || 8088; }
                        GameData.setWebSocket(ws);
                        if (data.game_data) {
                            GameData.initFromServer(data.game_data);
                            const records = GameData._cache?.records?.eatAndAvoid;
                            if (records?.bestTime) { bestTime = records.bestTime; bestTimeElement.textContent = GameUtils.formatBestTime(bestTime); }
                        }
                        // 通知 ControllerManager 已连接的控制器
                        (data.controllers || []).forEach(c => {
                            ControllerManager.onControllerConnected(c.id);
                        });
                        updateControllerUI();
                    }
                    else if (data.type === 'controller_joined') {
                        ControllerManager.onControllerConnected(controllerId);
                        updateControllerUI();
                    }
                    else if (data.type === 'controller_left') {
                        ControllerManager.onControllerDisconnected(controllerId);
                        updateControllerUI();
                    }
                    else if (data.type === 'state') {
                        // 更新 ControllerManager 中的输入状态
                        // （会自动触发 onUpdate 回调，统一处理 waiting 状态等）
                        ControllerManager.updateControllerInput(controllerId, data.joystick, data.buttons);
                    }
                    else if (data.type === 'button') {
                        // 单独的按钮事件（保持兼容）
                        const input = ControllerManager.getInput(controllerId);
                        if (input) {
                            input.buttons[data.button] = data.action === 'press';
                        }
                    }
                    else if (data.type === 'save_result' || data.type === 'load_result') {
                        if (data.type === 'load_result' && data.success) GameData.initFromServer(data.data);
                    }
                } catch (e) { console.log('收到消息:', event.data); }
            };
        }

        // ==================== 游戏输入处理 ====================
        // ControllerManager 已经处理了键盘映射，这里只需要监听特殊事件
        let menuInputThrottle = false;
        let menuInputLocked = false;  // 菜单输入锁定（游戏结束后必须松开所有按键才能操作）
        let prevMenuInput = { joystick: { x: 0, y: 0 }, buttons: { N: false, S: false, E: false, W: false } };
        
        /**
         * 重置菜单输入状态（游戏结束时调用）
         * 锁定菜单输入，直到玩家松开所有按键
         */
        function resetMenuInputState() {
            menuInputLocked = true;
            menuInputThrottle = true;
        }
        
        /**
         * 检测输入变化（用于菜单等需要检测"按下"而非"按住"的场景）
         */
        function checkMenuInput() {
            const input = ControllerManager.getInput(1);
            if (!input) return;
            
            const deadzone = 0.3;
            
            // 检查是否有任何输入（摇杆或按钮）
            const hasAnyInput = Math.abs(input.joystick.x) > deadzone || 
                               Math.abs(input.joystick.y) > deadzone ||
                               input.buttons.N || input.buttons.S || 
                               input.buttons.E || input.buttons.W;
            
            // 如果菜单被锁定，等待所有按键松开才解锁
            if (menuInputLocked) {
                if (!hasAnyInput) {
                    menuInputLocked = false;
                    menuInputThrottle = false;
                    prevMenuInput = { joystick: { x: 0, y: 0 }, buttons: { N: false, S: false, E: false, W: false } };
                }
                return;
            }
            
            // 检测摇杆移动（有死区的方向变化）
            const newUp = input.joystick.y < -deadzone;
            const newDown = input.joystick.y > deadzone;
            const oldUp = prevMenuInput.joystick.y < -deadzone;
            const oldDown = prevMenuInput.joystick.y > deadzone;
            
            if (!menuInputThrottle) {
                if (newUp && !oldUp) {
                    menuSystem.moveUp();
                    menuInputThrottle = true;
                    setTimeout(() => menuInputThrottle = false, 150);
                }
                if (newDown && !oldDown) {
                    menuSystem.moveDown();
                    menuInputThrottle = true;
                    setTimeout(() => menuInputThrottle = false, 150);
                }
            }
            
            // 确认按钮 (西键 = 确认，南键也可以确认)
            const confirmPressed = (input.buttons.W && !prevMenuInput.buttons.W) || 
                                   (input.buttons.S && !prevMenuInput.buttons.S);
            if (confirmPressed) {
                menuSystem.confirm();
            }
            
            // 保存当前状态
            prevMenuInput = {
                joystick: { ...input.joystick },
                buttons: { ...input.buttons }
            };
        }
        
        // 监听任意键开始游戏
        window.addEventListener('keydown', e => {
            if (gameState === 'waiting') {
                startGame();
            }
        });

        // ==================== 游戏更新 ====================
        function update() {
            if (gameState !== 'playing') return;

            if (gameStartTime > 0) {
                purePlayTime = (Date.now() - gameStartTime) / 1000;
                gameTime = purePlayTime + penaltyTime;
                timerElement.textContent = GameUtils.formatTime(gameTime);
                document.getElementById('play-time').textContent = GameUtils.formatTime(purePlayTime);
                document.getElementById('penalty-time-display').textContent = penaltyTime > 0 ? `+${penaltyTime}s` : '+0s';
            }

            const deadzone = 0.3;
            const players = ControllerManager.getPlayers();

            // 遍历所有活跃玩家
            Object.values(players).forEach(p => {
                // 从 ControllerManager 获取统一的输入（已合并键盘和手柄）
                const input = ControllerManager.getInput(p.id);
                
                p.vx = 0; p.vy = 0;
                
                // 获取摇杆输入（ControllerManager 已处理键盘->摇杆映射）
                if (input && (Math.abs(input.joystick.x) > deadzone || Math.abs(input.joystick.y) > deadzone)) {
                    p.vx = input.joystick.x;
                    p.vy = input.joystick.y;
                }
                
                // 处理按钮输入（按下事件）
                if (input && input.buttons) {
                    const prevState = prevButtonStates[p.id] || { S: false, E: false };
                    
                    // 南键 = 跳跃
                    p.isJumpHeld = input.buttons.S;
                    if (input.buttons.S && !prevState.S && !p.isJumping) {
                        p.isJumping = true;
                        p.vz = config.jumpPower;
                        p.ghostMarker = { x: p.x, y: p.y, type: 'jump', opacity: 1, timer: 60 };
                    }
                    
                    // 东键 = 冲刺
                    if (input.buttons.E && !prevState.E && p.dashCooldown <= 0 && (p.vx !== 0 || p.vy !== 0)) {
                        p.dashTimer = config.dashDuration;
                        p.dashCooldown = config.dashCooldown;
                        p.ghostMarker = { x: p.x, y: p.y, type: 'dash', opacity: 1, timer: 60 };
                        playSound(sfxDash);
                    }
                    
                    // 保存当前状态供下一帧比较
                    prevButtonStates[p.id] = { S: input.buttons.S, E: input.buttons.E };
                }
                
                // 静步检测 (北键 = 静步)
                const isPrecise = input && input.buttons && input.buttons.N;
                const speedMult = isPrecise ? 0.5 : 1.0;

                updatePlayerMovement(p, speedMult);
            });

            if (invincibleTimer > 0) invincibleTimer--;
            
            // 更新红线位置
            updateRedLines();

            // 碰撞检测 - 遍历所有玩家
            Object.values(players).forEach(p => {
                // 检测红线碰撞
                if (invincibleTimer <= 0 && checkRedLineCollision(p)) {
                    gameOver();
                    return;
                }
                // 检测方块碰撞（收集得分方块）
                checkPlayerCollision(p);
            });

            gridSys.grid.forEach(t => t.pulse += 0.05);
            updateDebugInfo();
            checkAndRefresh();
        }
        
        function updatePlayerMovement(p, speedMult) {
            const { gridX, gridY, gridTotalDim, tileSize } = gridSys;
            
            const isDashing = p.dashTimer > 0;
            if (isDashing) {
                p.x += p.vx * scaledMoveSpeed * config.dashMultiplier * speedMult;
                p.y += p.vy * scaledMoveSpeed * config.dashMultiplier * speedMult;
                p.dashTimer--;
                } else {
                p.x += p.vx * scaledMoveSpeed * speedMult;
                p.y += p.vy * scaledMoveSpeed * speedMult;
                }
            if (p.dashCooldown > 0) p.dashCooldown--;

            if (p.isJumping) {
                p.z += p.vz;
                const effectiveGravity = p.isJumpHeld ? config.gravity * 0.5 : config.gravity;
                p.vz -= effectiveGravity;
                if (p.z <= 0) { 
                    p.z = 0; p.vz = 0; p.isJumping = false; p.isJumpHeld = false;
                    playSound(sfxLand);
                }
                }

            const isMoving = p.vx !== 0 || p.vy !== 0;
            if (isMoving || p.isJumping) p.trail.unshift({x: p.x, y: p.y, z: p.z, opacity: 1});
            const maxTrail = p.dashTimer > 0 ? config.trailLength + 4 : config.trailLength;
            while (p.trail.length > maxTrail) p.trail.pop();
            if (!isMoving && !p.isJumping && p.trail.length > 0) p.trail.pop();

            p.x = Math.max(gridX, Math.min(p.x, gridX + gridTotalDim - p.width));
            p.y = Math.max(gridY, Math.min(p.y, gridY + gridTotalDim - p.height));

            if (p.ghostMarker) {
                p.ghostMarker.timer--;
                p.ghostMarker.opacity = p.ghostMarker.timer / 60;
                if (p.ghostMarker.timer <= 0) p.ghostMarker = null;
                }
            }

        function checkPlayerCollision(p) {
            if (p.z >= 1) return;  // 跳跃中不检测方块碰撞
            
            const { gridX, gridY, tileSize } = gridSys;
            const cx = p.x + p.width/2;
            const cy = p.y + p.height/2;
            const col = Math.floor((cx - gridX) / (tileSize + config.tileGap));
            const row = Math.floor((cy - gridY) / (tileSize + config.tileGap));

            if (row >= 0 && row < config.gridSize && col >= 0 && col < config.gridSize) {
                const tile = gridSys.grid.find(t => t.row === row && t.col === col);
                if (tile && tile.type !== 'none') {
                    // 红线模式：只收集目标颜色方块
                        if (tile.type === targetColor) {
                            tile.type = 'none';
                        const pos = gridSys.getTilePosition(row, col);
                        floatingText.show('+1', config.colorHex[targetColor], pos.centerX, pos.y);
                        playSound(sfxScore);  // 播放得分音效
                    }
                }
            }
        }
            
        // ==================== 绘制 ====================
        function draw() {
            // 重置 canvas 状态，防止残留效果
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            
            ctx.fillStyle = config.colors.bg;
            ctx.fillRect(0, 0, width, height);

            const { gridX, gridY, gridTotalDim, tileSize } = gridSys;

            // 网格线
            gridSys.drawGridLines(ctx);

            // 方块
            gridSys.drawTiles(ctx, (tile) => {
                // 所有颜色都从统一的 colorHex 获取
                const color = config.colorHex[tile.type] || config.colors.cyan;
                // 目标色高亮
                return { 
                    color, 
                    isHighlight: tile.type === targetColor,
                    isDanger: false  // 红线模式没有危险方块
                };
            });
            
            // 绘制红线
            drawRedLines();

            // 绘制玩家 - 遍历所有玩家
            const players = ControllerManager.getPlayers();
            Object.values(players).forEach(p => {
                drawPlayer(p);
            });

            // 浮动文字
            floatingText.draw(ctx);
            floatingText.update();
            
            // 菜单状态下检查输入
            if (gameState === 'gameover' || gameState === 'victory') {
                checkMenuInput();
            }
            
            requestAnimationFrame(() => { update(); draw(); });
        }
        
        function drawPlayer(p) {
            const { tileSize } = gridSys;

            // Ghost Marker
            if (p.ghostMarker) {
                const ghost = p.ghostMarker;
                ctx.globalAlpha = ghost.opacity * 0.6;
                ctx.strokeStyle = p.colors.main;
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.strokeRect(ghost.x, ghost.y, p.width, p.height);
                ctx.beginPath();
                ctx.moveTo(ghost.x + p.width/2, ghost.y + p.height/2);
                ctx.lineTo(p.x + p.width/2, p.y + p.height/2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.globalAlpha = 1;
            }

            // Shadow
            if (p.z > 0) {
                const shadowScale = Math.max(0.2, 1 - p.z / 150);
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath();
                ctx.ellipse(p.x + p.width/2, p.y + p.height/2, (p.width/2) * shadowScale, (p.height/2) * shadowScale, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Trails
            p.trail.forEach((t, i) => {
                const trailScale = 1 + (t.z / 120);
                const tw = p.width * trailScale;
                const th = p.height * trailScale;
                const tx = t.x - (tw - p.width) / 2;
                const ty = t.y - (th - p.height) / 2;
                ctx.globalAlpha = (p.trail.length - i) / (p.trail.length * 3);
                ctx.fillStyle = p.colors.main;
                ctx.fillRect(tx, ty, tw, th);
            });
            ctx.globalAlpha = 1.0;

            // Body
            const jumpScale = 1 + (p.z / 80);
            const drawW = p.width * jumpScale;
            const drawH = p.height * jumpScale;
            const drawX = p.x - (drawW - p.width) / 2;
            const drawY = p.y - (drawH - p.height) / 2;

            const isInvincible = invincibleTimer > 0;
            if (isInvincible) ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 50) * 0.5;

            ctx.shadowBlur = 15 + Math.sin(Date.now()/100) * 5 + (p.z/5);
            ctx.shadowColor = isInvincible ? '#ffffff' : p.colors.glow;
            ctx.fillStyle = p.colors.main;
            ctx.fillRect(drawX, drawY, drawW, drawH);
            
            ctx.fillStyle = p.colors.core;
            ctx.fillRect(drawX + drawW*0.25, drawY + drawH*0.25, drawW*0.5, drawH*0.5);
            ctx.shadowBlur = 0;
                ctx.globalAlpha = 1.0;
            }

        // ==================== 游戏结束/胜利 ====================
        function gameOver() {
            gameState = 'gameover';
            const finalTime = Math.floor(gameTime);
            const finalPlayTime = Math.floor(purePlayTime);
            const finalPenalty = Math.floor(penaltyTime);
            
            gameScreens.showGameOver({
                totalTime: finalTime,
                playTime: finalPlayTime,
                penaltyTime: finalPenalty,
                bestTime: bestTime
            });
            
            ControlHint.hide();
            resetMenuInputState();
        }
        
        function victory() {
            gameState = 'victory';
            const finalTime = Math.floor(gameTime);
            const finalPlayTime = Math.floor(purePlayTime);
            const finalPenalty = Math.floor(penaltyTime);
            
            if (bestTime === 0 || finalTime < bestTime) {
                bestTime = finalTime;
                GameData.records.setBestTime('eatAndAvoid', bestTime);
            }
            
            bestTimeElement.textContent = GameUtils.formatBestTime(bestTime);
            
            gameScreens.showVictory({
                totalTime: finalTime,
                playTime: finalPlayTime,
                penaltyTime: finalPenalty,
                bestTime: bestTime
            });
            
            ControlHint.hide();
            debugLog.add(`<span style="color: #ffd700;">🎉 通关！游戏: ${GameUtils.formatTime(finalPlayTime)} + 惩罚: ${finalPenalty}s = 总计: ${GameUtils.formatTime(finalTime)}</span>`);
            resetMenuInputState();
        }
        
        function resetPlayerPosition(p, playerId) {
            p.trail = [];
            // 根据玩家ID设置不同的初始位置
            const id = playerId || p.id || 1;
            const offset = SPAWN_OFFSETS[(id - 1) % SPAWN_OFFSETS.length];
            p.x = width / 2 - p.width / 2 + offset.x * gridSys.tileSize * 1.5;
            p.y = height / 2 - p.height / 2 + offset.y * gridSys.tileSize * 1.5;
            p.z = 0;
            p.vz = 0;
        }
        
        function resetGame() {
            gameTime = 0;
            gameStartTime = 0;
            penaltyTime = 0;
            purePlayTime = 0;
            timerElement.textContent = '00:00';
            document.getElementById('play-time').textContent = '00:00';
            document.getElementById('penalty-time-display').textContent = '+0s';
            
            waveSys.reset();
            gridSys.clearAll();
            
            // 重置所有玩家
            ControllerManager.resetAllPlayers(p => {
                resetPlayerPosition(p);
                p.isJumping = false;
                p.dashTimer = 0;
                p.dashCooldown = 0;
                p.ghostMarker = null;
            });
        }
        
        // ==================== 调试按钮 ====================
        document.getElementById('victory-test-btn').addEventListener('click', () => {
            if (gameState === 'playing' || gameState === 'waiting') {
                if (gameState === 'waiting') startGame();
                debugLog.add(`<span style="color: #ffd700;">🎉 [DEBUG] 触发快速通关</span>`);
                victory();
            }
        });
        
        // ==================== 初始化 ====================
        window.addEventListener('resize', resize);
        gridSys.initGrid();
        initLevelUI();
        
        // 初始化开始蒙版（使用抽象层）
        startOverlay = GameUtils.createStartOverlay();
        
        // 初始化游戏结束屏幕（使用抽象层，支持复用）
        gameScreens = GameUtils.createGameScreens({
            gameType: 'redline',
            currentLevel: levelMode,
            maxLevel: 3,
            onRestart: () => {
                gameScreens.hide();
                gameState = 'waiting';
                resetGame();
                startOverlay.show();
            },
            onRevive: () => {
                gameScreens.hide();
                gameState = 'playing';
                penaltyTime += REVIVE_PENALTY;
                floatingText.show(`+${REVIVE_PENALTY}秒复活惩罚`, '#ff6b6b', width/2, height/2 - 50);
                ControllerManager.resetAllPlayers(p => {
                    resetPlayerPosition(p);
                    p.isJumping = false;
                    p.dashTimer = 0;
                    p.dashCooldown = 0;
                    p.ghostMarker = null;
                });
                invincibleTimer = INVINCIBLE_DURATION;
            },
            onNextLevel: levelMode < 3 ? () => {
                window.location.href = `gameRedLine.html?level=${levelMode + 1}`;
            } : null,
            onBackToMenu: () => {
                window.location.href = 'index.html';
            }
        });
        gameScreens.bindMenuSystem(menuSystem);
        
        // 初始化 ControllerManager（统一管理键盘和手柄输入）
        ControllerManager.init({
            onPlayerCreate: createGamePlayer,
            onPlayerRemove: removeGamePlayer,
            onUpdate: () => {
                updateControllerUI();
                // 检查 waiting 状态下的任意输入（统一处理所有输入源）
                if (gameState === 'waiting' && ControllerManager.hasAnyInput()) {
                    startGame();
                }
            },
            enableKeyboard: true
        });
        
        resize();
        loadPlayerColors();
        resetGame();
        updateControllerUI();
        draw();
        
        // ==================== 背景音乐 ====================
        const bgm = new Audio('source/eat_and_avoid_bgm.wav');
        bgm.loop = true;
        bgm.volume = 0.5;
        let bgmStarted = false;
        
        function tryPlayBGM() {
            if (bgmStarted) return;
            bgm.play().then(() => { bgmStarted = true; }).catch(() => {});
        }
        
        // ==================== 音效 ====================
        const sfxDash = new Audio('source/flash_effect.wav');
        const sfxLand = new Audio('source/fall_effect.wav');
        const sfxScore = new Audio('source/score_effect.wav');
        sfxDash.volume = 0.6;
        sfxLand.volume = 0.5;
        sfxScore.volume = 0.5;
        
        function playSound(audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }
        
        ['click', 'keydown', 'touchstart'].forEach(event => {
            document.addEventListener(event, tryPlayBGM, { once: false });
        });
        tryPlayBGM();
    </script>
</body>
</html>
