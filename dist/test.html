<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>摇杆测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            background: #1a1a2e;
            font-family: monospace;
        }

        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        /* 竖屏时旋转 */
        @media screen and (orientation: portrait) {
            .container {
                width: 100vh;
                height: 100vw;
                transform: rotate(90deg);
                transform-origin: left top;
                position: absolute;
                top: 0;
                left: 100vw;
            }
        }

        /* 摇杆区域 */
        .joystick-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .joystick-zone {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: #2a2a4a;
            border: 3px solid #00ffff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            touch-action: none;
        }

        .joystick {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #00ffff, #0088aa);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            cursor: pointer;
        }

        /* 轴向标签 */
        .axis-label {
            position: absolute;
            font-size: 14px;
            color: #00ffff;
            font-weight: bold;
        }
        .axis-label.x-pos { right: -30px; top: 50%; transform: translateY(-50%); }
        .axis-label.x-neg { left: -30px; top: 50%; transform: translateY(-50%); }
        .axis-label.y-neg { top: -25px; left: 50%; transform: translateX(-50%); }
        .axis-label.y-pos { bottom: -25px; left: 50%; transform: translateX(-50%); }

        /* 数值显示 */
        .values {
            display: flex;
            gap: 30px;
            font-size: 18px;
        }

        .value {
            padding: 10px 20px;
            background: #2a2a4a;
            border-radius: 8px;
        }

        .value.x { color: #ff00ff; border: 2px solid #ff00ff; }
        .value.y { color: #00ff00; border: 2px solid #00ff00; }

        /* 全屏按钮 */
        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #2a2a4a;
            border: 2px solid #00ffff;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .fullscreen-btn svg {
            fill: #00ffff;
            width: 24px;
            height: 24px;
        }

        /* 状态 */
        .status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #666;
            font-size: 12px;
        }

        .status.connected { color: #00ff00; }
    </style>
</head>
<body>
    <div class="container">
        <div class="joystick-wrapper">
            <div class="joystick-zone" id="joystickZone">
                <div class="joystick" id="joystick"></div>
                <span class="axis-label x-pos">+X</span>
                <span class="axis-label x-neg">-X</span>
                <span class="axis-label y-neg">-Y</span>
                <span class="axis-label y-pos">+Y</span>
            </div>
            <div class="values">
                <span class="value x">X: <span id="xValue">0.00</span></span>
                <span class="value y">Y: <span id="yValue">0.00</span></span>
            </div>
        </div>
    </div>

    <button class="fullscreen-btn" id="fullscreenBtn">
        <svg viewBox="0 0 24 24" id="fullscreenIcon">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
    </button>

    <div class="status" id="status">未连接</div>

    <script>
        // 全局阻止触摸默认行为
        document.addEventListener('touchmove', (e) => {
            if (document.fullscreenElement) e.preventDefault();
        }, { passive: false });

        // ==================== 全屏 ====================
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const expandIcon = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
        const compressIcon = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            fullscreenIcon.innerHTML = document.fullscreenElement ? compressIcon : expandIcon;
        });

        // ==================== WebSocket ====================
        const statusEl = document.getElementById('status');
        let ws = null;

        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws`);

            ws.onopen = () => {
                statusEl.textContent = '已连接';
                statusEl.className = 'status connected';
            };

            ws.onclose = () => {
                statusEl.textContent = '断开连接，重连中...';
                statusEl.className = 'status';
                setTimeout(connect, 2000);
            };

            ws.onerror = () => ws.close();
        }

        function send(data) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            }
        }

        connect();

        // ==================== 摇杆 ====================
        const joystickZone = document.getElementById('joystickZone');
        const joystick = document.getElementById('joystick');
        const xValueEl = document.getElementById('xValue');
        const yValueEl = document.getElementById('yValue');

        let isDragging = false;
        let touchId = null;
        let dragStart = null;
        let startOffset = { x: 0, y: 0 };
        const maxDistance = 60;

        function isPortrait() {
            return window.innerHeight > window.innerWidth;
        }

        function getCenter() {
            const rect = joystickZone.getBoundingClientRect();
            return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        }

        function startDrag(x, y) {
            dragStart = { x, y };
            const center = getCenter();
            startOffset = { x: x - center.x, y: y - center.y };
        }

        function move(screenX, screenY) {
            if (!dragStart) return;

            let dx = (screenX - dragStart.x) + startOffset.x;
            let dy = (screenY - dragStart.y) + startOffset.y;

            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > maxDistance) {
                const scale = maxDistance / dist;
                dx *= scale;
                dy *= scale;
            }

            // CSS 坐标转换（竖屏时）
            let cssX = isPortrait() ? dy : dx;
            let cssY = isPortrait() ? -dx : dy;

            joystick.style.transform = `translate(${cssX}px, ${cssY}px)`;

            // 归一化值
            const normX = cssX / maxDistance;
            const normY = cssY / maxDistance;
            xValueEl.textContent = normX.toFixed(2);
            yValueEl.textContent = normY.toFixed(2);

            // 发送（逆时针旋转90度）
            send({ type: 'joystick', x: normY, y: -normX });
        }

        function reset() {
            joystick.style.transition = 'transform 0.15s';
            joystick.style.transform = 'translate(0, 0)';
            setTimeout(() => joystick.style.transition = '', 150);

            xValueEl.textContent = '0.00';
            yValueEl.textContent = '0.00';
            dragStart = null;
            startOffset = { x: 0, y: 0 };
            touchId = null;
            isDragging = false;

            send({ type: 'joystick_release' });
        }

        // 鼠标事件
        joystickZone.addEventListener('mousedown', (e) => {
            isDragging = true;
            startDrag(e.clientX, e.clientY);
            move(e.clientX, e.clientY);
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) move(e.clientX, e.clientY);
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) reset();
        });

        // 触摸事件
        joystickZone.addEventListener('touchstart', (e) => {
            if (touchId === null) {
                const t = e.changedTouches[0];
                touchId = t.identifier;
                isDragging = true;
                startDrag(t.clientX, t.clientY);
                move(t.clientX, t.clientY);
            }
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (touchId !== null) {
                for (const t of e.touches) {
                    if (t.identifier === touchId) {
                        move(t.clientX, t.clientY);
                        break;
                    }
                }
            }
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            for (const t of e.changedTouches) {
                if (t.identifier === touchId) {
                    reset();
                    break;
                }
            }
        });

        document.addEventListener('touchcancel', (e) => {
            for (const t of e.changedTouches) {
                if (t.identifier === touchId) {
                    reset();
                    break;
                }
            }
        });
    </script>
</body>
</html>
